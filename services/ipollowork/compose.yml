services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-bookworm}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ipollowork
      POSTGRES_USER: ipollowork
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a private database password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U ipollowork -d ipollowork']
      interval: 5s
      timeout: 3s
      retries: 20
  work:
    build: .
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:4785:4785"
    environment:
      SERVICE_ORIGIN: ${SERVICE_ORIGIN:?Set the public HTTPS origin}
      DATABASE_URL: postgresql://ipollowork:${POSTGRES_PASSWORD}@postgres:5432/ipollowork
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-20}
      DATABASE_CONNECTION_TIMEOUT_MS: ${DATABASE_CONNECTION_TIMEOUT_MS:-3000}
      DATABASE_STATEMENT_TIMEOUT_MS: ${DATABASE_STATEMENT_TIMEOUT_MS:-15000}
      DATABASE_LOCK_TIMEOUT_MS: ${DATABASE_LOCK_TIMEOUT_MS:-3000}
      DATABASE_QUEUE_LIMIT: ${DATABASE_QUEUE_LIMIT:-128}
      API_CONCURRENCY: ${API_CONCURRENCY:-32}
      AUTH_CONCURRENCY: ${AUTH_CONCURRENCY:-2}
      EXECUTION_CONCURRENCY: ${EXECUTION_CONCURRENCY:-8}
      TRANSFER_CONCURRENCY: ${TRANSFER_CONCURRENCY:-4}
      MCP_CONCURRENCY: ${MCP_CONCURRENCY:-128}
      REQUEST_QUEUE_LIMIT: ${REQUEST_QUEUE_LIMIT:-160}
      API_QUEUE_WAIT_MS: ${API_QUEUE_WAIT_MS:-5000}
      AUTH_QUEUE_WAIT_MS: ${AUTH_QUEUE_WAIT_MS:-20000}
      WORK_QUEUE_WAIT_MS: ${WORK_QUEUE_WAIT_MS:-120000}
      SHUTDOWN_GRACE_MS: ${SHUTDOWN_GRACE_MS:-25000}
      RELAY_MAX_CONNECTIONS: ${RELAY_MAX_CONNECTIONS:-200}
      RELAY_MAX_PENDING: ${RELAY_MAX_PENDING:-32}
      RELAY_REFRESH_INTERVAL_MS: ${RELAY_REFRESH_INTERVAL_MS:-5000}
      HOST: 0.0.0.0
      PORT: 4785
      DATA_DIR: /data
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-}
      OSS_RAM_ROLE: ${OSS_RAM_ROLE:-}
      OSS_INTERNAL: ${OSS_INTERNAL:-false}
      PUBLICATION_ORIGIN: ${PUBLICATION_ORIGIN:-}
      MAIL_WEBHOOK_URL: ${MAIL_WEBHOOK_URL:-}
      MAIL_WEBHOOK_TOKEN: ${MAIL_WEBHOOK_TOKEN:-}
      PERSONAL_STORAGE_GIB: ${PERSONAL_STORAGE_GIB:-200}
      ORGANIZATION_STORAGE_GIB: ${ORGANIZATION_STORAGE_GIB:-500}
      PERSONAL_RETENTION_DAYS: ${PERSONAL_RETENTION_DAYS:-7}
      MAX_ARTIFACT_BYTES: ${MAX_ARTIFACT_BYTES:-536870912}
      PAYMENT_FEE_BPS: ${PAYMENT_FEE_BPS:-500}
      MINIMUM_MARGIN_BPS: ${MINIMUM_MARGIN_BPS:-3000}
      MEMBERSHIP_OPERATING_RESERVE_FEN: ${MEMBERSHIP_OPERATING_RESERVE_FEN:-3000}
      APP_DATA_DATABASE_URL: ${APP_DATA_DATABASE_URL:-}
    volumes:
      - work-data:/data
    stop_grace_period: 40s
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4785/api/health',{signal:AbortSignal.timeout(2000)}).then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  work-data:
  postgres-data:
