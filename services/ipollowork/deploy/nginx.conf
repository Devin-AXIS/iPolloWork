# Include these locations in the TLS server for SERVICE_ORIGIN.
# The proxy must replace X-Real-IP. Set TRUSTED_PROXY_IPS to its exact peer IP.
location / {
    proxy_pass http://127.0.0.1:4785;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 75s;
    client_max_body_size 25m;
}
location = /__tunnel_gateway__ {
    proxy_pass http://127.0.0.1:4785;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 90s;
    # Native registration queries identify sessions. Do not write them to access logs.
    access_log off;
}
location ^~ /__liveshare/assets/ {
    proxy_pass http://127.0.0.1:4785;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_read_timeout 75s;
    # Paths carry short-lived, share-scoped viewer credentials.
    access_log off;
}
