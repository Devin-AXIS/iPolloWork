<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Workspace Canvas</title>
  <style>
    :root { color-scheme: light; font: 13px/1.5 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--dsw-alias-bg-base, #fff); color: var(--dsw-alias-label-primary, #191919); }
    main { display: flex; height: 100svh; min-height: 360px; max-width: 1120px; margin: auto; flex-direction: column; gap: 16px; padding: 24px; }
    header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
    h1 { margin: 0 0 4px; font-size: 16px; font-weight: 500; }
    button { min-height: 32px; border: 1px solid var(--dsw-alias-border-l1, #d9d9d9); border-radius: 8px; background: var(--dsw-alias-bg-base, #fff); color: inherit; padding: 6px 12px; font: inherit; cursor: pointer; }
    button:hover { background: var(--dsw-alias-bg-module-platform, #f2f3f5); }
    textarea { min-height: 200px; width: 100%; flex: 1; resize: none; border: 1px solid var(--dsw-alias-border-l1, #d9d9d9); border-radius: 10px; background: var(--dsw-alias-bg-base, #fff); color: inherit; padding: 16px; font: inherit; line-height: 1.8; }
    textarea:focus-visible, button:focus-visible { outline: 2px solid var(--dsw-alias-label-primary, #191919); outline-offset: 2px; }
    small, footer { color: var(--dsw-alias-label-secondary, #68707b); font-size: 12px; }
    footer { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; }
    @media(max-width:520px) { main { padding: 16px; gap: 12px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div><h1>Workspace Canvas</h1><small id="status">Connecting…</small></div>
      <button id="ask" type="button">Ask AI to improve</button>
    </header>
    <textarea id="board" aria-label="Canvas content">Goal

• Add a clear objective
• Break it into the next three actions
• Let the agent update this canvas</textarea>
    <footer><span id="draft-note">Temporary draft · Copy to a project file to keep your work</span><span id="count"></span></footer>
  </main>
  <script>
    const board = document.querySelector("#board");
    const status = document.querySelector("#status");
    const initialBoard = board.value;
    let zh = false;
    const tr = (cn, en) => zh ? cn : en;
    function updateCount() { document.querySelector("#count").textContent = tr(`${board.value.length} 字`, `${board.value.length} characters`); }
    function hostAppearance(context) {
      if (context?.theme) { document.documentElement.dataset.theme = context.theme; document.documentElement.style.colorScheme = context.theme; }
      zh = String(context?.locale || document.documentElement.lang).startsWith("zh");
      document.documentElement.lang = zh ? "zh-CN" : "en";
      document.querySelector("h1").textContent = tr("画布草稿", "Canvas draft");
      document.querySelector("#ask").textContent = tr("交给 AI 完善", "Ask AI to improve");
      document.querySelector("#draft-note").textContent = tr("临时草稿 · 可复制到项目文件保存", "Temporary draft · Copy to a project file to keep your work");
      board.setAttribute("aria-label", tr("画布内容", "Canvas content"));
      updateCount();
    }
    const pending = new Map();
    let requestId = 0;
    let contextTimer = 0;

    function post(message) { parent.postMessage(message, "*"); }
    function respond(id, result) { post({ jsonrpc: "2.0", id, result }); }
    function request(method, params) {
      const id = ++requestId;
      post({ jsonrpc: "2.0", id, method, params });
      return new Promise((resolve, reject) => pending.set(id, { resolve, reject }));
    }
    function publishContext() {
      clearTimeout(contextTimer);
      contextTimer = setTimeout(() => {
        void request("ui/update-model-context", {
          content: [{ type: "text", text: `Current canvas:\n${board.value}` }],
          structuredContent: { canvas: board.value }
        });
      }, 120);
    }
    function toolResult(text) {
      publishContext();
      return { content: [{ type: "text", text }], structuredContent: { canvas: board.value } };
    }

    addEventListener("message", (event) => {
      if (event.source !== parent || !event.data || event.data.jsonrpc !== "2.0") return;
      const message = event.data;
      if (message.id !== undefined && !message.method) {
        const handler = pending.get(message.id);
        if (!handler) return;
        pending.delete(message.id);
        message.error ? handler.reject(new Error(message.error.message)) : handler.resolve(message.result);
        return;
      }
      if (message.method === "tools/list") {
        respond(message.id, { tools: [
          { name: "replace_board", description: "Replace all canvas text.", inputSchema: { type: "object", properties: { text: { type: "string" } }, required: ["text"] } },
          { name: "append_note", description: "Append one note to the canvas.", inputSchema: { type: "object", properties: { text: { type: "string" } }, required: ["text"] } }
        ] });
        return;
      }
      if (message.method === "tools/call") {
        const args = message.params?.arguments || {};
        if (message.params?.name === "replace_board") board.value = String(args.text || "");
        if (message.params?.name === "append_note") board.value += `${board.value ? "\n" : ""}${String(args.text || "")}`;
        respond(message.id, toolResult("Canvas updated."));
        return;
      }
      if (message.method === "ui/resource-teardown") respond(message.id, {});
      if (message.method === "ui/notifications/host-context-changed") {
        hostAppearance(message.params);
      }
    });

    board.addEventListener("input", () => { updateCount(); publishContext(); });
    document.querySelector("#ask").addEventListener("click", async () => {
      clearTimeout(contextTimer);
      try {
        await request("ui/update-model-context", {
        content: [{ type: "text", text: `Current canvas:\n${board.value}` }],
        structuredContent: { canvas: board.value }
      });
        await request("ui/message", {
        role: "user",
        content: [{ type: "text", text: tr("请完善当前画布，保留原本的目标与意图。", "Improve the active canvas while preserving its intent.") }]
        });
      } catch (error) { status.textContent = error.message; }
    });

    request("ui/initialize", {
      protocolVersion: "2025-11-21",
      appInfo: { name: "Workspace Canvas", version: "1.0.0" },
      appCapabilities: { tools: {}, availableDisplayModes: ["inline", "fullscreen"] }
    }).then((host) => {
      post({ jsonrpc: "2.0", method: "ui/notifications/initialized", params: {} });
      document.querySelector("#ask").hidden = !host.hostCapabilities?.message;
      hostAppearance(host.hostContext);
      if (zh && board.value === initialBoard) board.value = "目标\n\n• 写清楚这次要完成什么\n• 拆成接下来要做的三件事\n• 与 AI 一起完善计划";
      status.textContent = tr("已连接 · 编辑内容可交给 AI 继续完善", "Connected · Share your draft with AI");
      updateCount();
      publishContext();
    }).catch((error) => { status.textContent = error.message; });
  </script>
</body>
</html>
