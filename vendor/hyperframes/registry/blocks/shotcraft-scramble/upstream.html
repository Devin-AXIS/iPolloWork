<!-- scramble — Scramble Decode 乱码锁定 -->
<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    [data-composition-id="Scramble"] { background: #07080c; overflow: hidden; }
    .design-stage { position:absolute;left:0;top:0;width:480px;height:270px;overflow:hidden;transform:scale(4);transform-origin:top left; }
    #row { position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#07080c;font-family:"SF Mono",Menlo,monospace;font-size:34px;letter-spacing:2px; }
  </style>
</head>
<body>
  <div data-composition-id="Scramble" data-start="0" data-duration="3.2" data-fps="30" data-width="1920" data-height="1080">
    <div class="design-stage"><div id="row"></div></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    window.__timelines = window.__timelines || {};
    const rand=s=>{const x=Math.sin(s*127.1+311.7)*43758.5453;return x-Math.floor(x);};
    const seg=(t,t0,t1)=>Math.min(1,Math.max(0,(t-t0)/(t1-t0)));
    const TEXT='TEMPLATE MOTION DEMO', POOL='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#$%&*+=<>/\\', CHARS=[...TEXT];
    const row=document.getElementById('row'); const tl=gsap.timeline({paused:true}); const DUR=3.2; const state={t:0};
    tl.to(state,{t:1,duration:DUR,ease:'none',onUpdate:()=>{
      const t=state.t, frame=Math.floor(t*96);
      row.innerHTML=CHARS.map((ch,i)=>{
        let content=ch,color='#3d4560',textShadow='none';
        if(ch!==' '){const lockAt=0.25+(i/CHARS.length)*0.6+rand(i*7)*0.06;
          if(t<0.06)content=' '; else if(t<lockAt)content=POOL[Math.floor(rand(i*131+Math.floor(frame/2))*POOL.length)];
          else{const flash=1-seg(t,lockAt,lockAt+0.1);color=flash>0.4?'#dff3ff':'#e8eaf0';textShadow=`0 0 ${flash*18}px rgba(120,200,255,${flash})`;}}
        return `<span style="min-width:0.62em;text-align:center;color:${color};text-shadow:${textShadow}">${content===' '?'&nbsp;':content}</span>`;
      }).join('');
    }},0);
    window.__timelines['Scramble']=tl;
  </script>
</body>
</html>
