<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GSAP SplitText Reveal</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body {
        display: grid;
        place-items: center;
        background: var(--background, #0b0a12);
        color: var(--text, #f5f0ff);
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      .frame { position: relative; width: 100%; padding: 0 150px; text-align: center; }
      .label { margin-bottom: 44px; color: #a78bfa; font-size: 20px; font-weight: 700; letter-spacing: .24em; text-transform: uppercase; }
      h1 { margin: 0 auto; max-width: 1500px; font-size: 132px; line-height: .9; letter-spacing: -.075em; text-wrap: balance; }
      .char { display: inline-block; will-change: transform, opacity, filter; }
      .line { width: 0; height: 8px; margin: 58px auto 0; border-radius: 999px; background: linear-gradient(90deg, #8b5cf6, #ec4899, #f59e0b); }
      .orb { position: absolute; width: 420px; height: 420px; border-radius: 50%; filter: blur(90px); opacity: .18; }
      .orb-a { left: -120px; top: -240px; background: #8b5cf6; }
      .orb-b { right: -100px; bottom: -260px; background: #ec4899; }
    </style>
  </head>
  <body>
    <main class="frame">
      <div class="orb orb-a"></div>
      <div class="orb orb-b"></div>
      <div class="label">SplitText typography</div>
      <h1 id="headline">MAKE MOTION MATTER</h1>
      <div class="line"></div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/SplitText.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      var variables = window.__hyperframes && window.__hyperframes.getVariables
        ? window.__hyperframes.getVariables()
        : {};
      var headline = typeof variables.headline === "string" ? variables.headline : "MAKE MOTION MATTER";
      var backgroundColor = typeof variables.backgroundColor === "string" ? variables.backgroundColor : "#0B0A12";
      var textColor = typeof variables.textColor === "string" ? variables.textColor : "#F5F0FF";
      var stagger = typeof variables.stagger === "number" ? variables.stagger : 0.045;
      var ease = typeof variables.ease === "string" ? variables.ease : "power4.out";
      document.documentElement.style.setProperty("--background", backgroundColor);
      document.documentElement.style.setProperty("--text", textColor);
      document.getElementById("headline").textContent = headline;

      gsap.registerPlugin(SplitText);
      var split = new SplitText("#headline", { type: "words,chars", charsClass: "char" });
      var timeline = gsap.timeline({ paused: true });
      timeline
        .from(".label", { opacity: 0, y: 18, duration: 0.7, ease: "power2.out" })
        .from(split.chars, {
          opacity: 0,
          yPercent: 130,
          rotateX: -80,
          filter: "blur(12px)",
          stagger: stagger,
          duration: 1.15,
          ease: ease
        }, 0.18)
        .to(".line", { width: 520, duration: 1, ease: "power3.out" }, 0.65)
        .from(".orb", { scale: 0.2, opacity: 0, stagger: 0.18, duration: 1.5, ease: "power2.out" }, 0.3);

      window.__timelines["gsap-splittext-reveal"] = timeline;
      window.addEventListener("hf-seek", function (event) {
        timeline.seek(Math.max(0, Math.min(event.detail.time, 6)));
      });
      timeline.seek(0);
    </script>
  </body>
</html>
