<!-- brace-expand — Brace Expand Reveal 括号拉幕 -->
<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    [data-composition-id="BraceExpand"] { background: #0a0b10; overflow: hidden; }
    .design-stage {
      position: absolute; left: 0; top: 0;
      width: 480px; height: 270px; overflow: hidden;
      transform: scale(4); transform-origin: top left;
    }
  </style>
</head>
<body>
  <div data-composition-id="BraceExpand" data-start="0" data-duration="3.8" data-fps="30" data-width="1920" data-height="1080">
    <div class="design-stage"><div id="root" style="position:absolute;inset:0;"></div></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    window.__timelines = window.__timelines || {};
    const E = { linear:t=>t,inOutQuad:t=>t<0.5?2*t*t:-1+(4-2*t)*t,outBack:(t,s=1.70158)=>1+(s+1)*Math.pow(t-1,3)+s*Math.pow(t-1,2) };
    const lerp=(t,a,b)=>a+(b-a)*t;
    const seg=(t,t0,t1,ease=E.linear)=>ease(Math.min(1,Math.max(0,(t-t0)/(t1-t0))));
    const tl=gsap.timeline({paused:true}); const DUR=3.8; const HALF=148; const FONT='-apple-system,system-ui,sans-serif';
    const root=document.getElementById('root'); const state={t:0};
    tl.to(state,{t:1,duration:DUR,ease:'none',onUpdate:()=>{
      const t=state.t, on=t>=0.07?1:0, ex=seg(t,0.13,0.34,E.outBack), sc=lerp(ex,0.6,1), x=HALF*ex*sc;
      const ls=lerp(seg(t,0.42,0.62,E.inOutQuad),1,2.6);
      root.innerHTML=`<div style="position:absolute;left:50%;top:50%;width:0;height:0">
        <div style="position:absolute;left:0;top:0;transform:translate(-50%,-50%);overflow:hidden;height:60px;display:flex;align-items:center;justify-content:center;width:${Math.max(0,x*2-34)}px;opacity:${on}">
          <div style="font-weight:800;font-size:38px;font-family:${FONT};color:#fff;white-space:nowrap;letter-spacing:${ls}px;transform:scale(${sc})">Your title</div></div>
        <div style="position:absolute;left:0;top:0;font-weight:800;font-size:44px;font-family:${FONT};color:#fff;transform:translate(-50%,-50%) translateX(${-x}px) scale(${sc});opacity:${on}">{</div>
        <div style="position:absolute;left:0;top:0;font-weight:800;font-size:44px;font-family:${FONT};color:#fff;transform:translate(-50%,-50%) translateX(${x}px) scale(${sc});opacity:${on}">}</div></div>`;
    }},0);
    window.__timelines['BraceExpand']=tl;
  </script>
</body>
</html>
