<!-- typing-code-block -->
<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    [data-composition-id="TypingCodeBlock"] { background: #0a0b10; overflow: hidden; }
    .design-stage { position:absolute;left:0;top:0;width:480px;height:270px;overflow:hidden;transform:scale(4);transform-origin:top left; }
  </style>
</head>
<body>
  <div data-composition-id="TypingCodeBlock" data-start="0" data-duration="4.6" data-fps="30" data-width="1920" data-height="1080">
    <div class="design-stage"><div id="root" style="position:absolute;inset:0;"></div></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    window.__timelines = window.__timelines || {};
    const E={outCubic:t=>1-Math.pow(1-t,3)}; const seg=(t,t0,t1,e=t=>t)=>e(Math.min(1,Math.max(0,(t-t0)/(t1-t0))));
    const K='#c792ea',ID='#e8eaf0',FN='#82aaff',ST='#c3e88d',PU='#89ddff',CM='#546e7a';
    const LINES=[[['const ',K],['app',ID],[' = ',PU],['createApp',FN],['();',ID]],[['app',ID],['.',PU],['use',FN],['(',ID],['router',ID],[');',ID]],[['app',ID],['.',PU],['mount',FN],['(',ID],["'#root'",ST],[');',ID]],[['// ready',CM]]];
    const FLAT=[]; LINES.forEach((line,row)=>line.forEach(([txt,color])=>[...txt].forEach(ch=>FLAT.push({ch,color,row}))));
    const panel=(x,label,inner)=>`<div style="position:absolute;left:${x}%;top:14%;width:45%;height:72%;background:#10121a;border:1px solid #1c2030;border-radius:8px;padding:10px 12px;box-sizing:border-box;font-family:'SF Mono',Menlo,monospace;font-size:12px;line-height:1.9"><div style="font-size:8px;letter-spacing:2px;color:#4a5270;margin-bottom:6px">${label}</div>${inner}</div>`;
    const root=document.getElementById('root'); const tl=gsap.timeline({paused:true}); const state={t:0};
    tl.to(state,{t:1,duration:4.6,ease:'none',onUpdate:()=>{
      const t=state.t, typed=Math.floor(seg(t,0.08,0.9)*FLAT.length);
      const left=LINES.map((line,i)=>{const k=seg(t,0.08+i*0.14,0.08+i*0.14+0.3,E.outCubic);
        return `<div style="opacity:${k};transform:translateY(${(1-k)*8}px)">${line.map(([txt,color])=>`<span style="color:${color}">${txt}</span>`).join('')}</div>`;}).join('');
      const right=LINES.map((_,row)=>`<div style="min-height:1.9em">${FLAT.map((c,i)=>c.row===row?`<span style="color:${c.color};opacity:${i<typed||i===typed?1:0};background:${i===typed&&typed<FLAT.length?'#3a4468':'transparent'}">${c.ch}</span>`:'').join('')}</div>`).join('');
      root.innerHTML=panel(3.5,'LINE FADE-IN',left)+panel(51.5,'CHAR TYPING',right);
    }},0);
    window.__timelines['TypingCodeBlock']=tl;
  </script>
</body>
</html>
