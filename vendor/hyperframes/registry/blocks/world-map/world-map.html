    <title>World Map</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
      #wm-root {
        position: relative; width: 1920px; height: 1080px; overflow: hidden; padding: 86px 118px 72px;
        background: var(--ipw-color-bg, #f4f6f8); color: var(--ipw-color-text, #15171a);
        font-family: var(--ipw-font-display, Inter, sans-serif);
      }
      .wm-orb {
        position: absolute; right: -130px; top: -210px; width: 620px; height: 620px; border-radius: 50%;
        background: color-mix(in srgb, var(--ipw-color-primary, #20bbc0) 13%, transparent); filter: blur(1px);
      }
      .wm-head { position: relative; z-index: 2; display: flex; align-items: end; justify-content: space-between; }
      .wm-kicker {
        display: flex; align-items: center; gap: 10px; margin-bottom: 17px; color: var(--ipw-color-text, #15171a);
        font: 760 15px/1 var(--ipw-font-body, Inter, sans-serif); letter-spacing: .18em; text-transform: uppercase;
      }
      .wm-kicker::before { content: ""; width: 28px; height: 5px; border-radius: 99px; background: var(--ipw-color-primary, #20bbc0); }
      .wm-title { max-width: 1100px; margin: 0; font-size: 72px; line-height: .96; letter-spacing: -.055em; }
      .wm-source {
        padding-bottom: 5px; color: var(--ipw-color-text, #15171a);
        font: 650 16px/1.2 var(--ipw-font-body, Inter, sans-serif);
      }
      .wm-card {
        position: absolute; left: 118px; right: 118px; top: 268px; bottom: 72px;
        display: grid; grid-template-columns: minmax(0, 1fr) 350px; gap: 30px; padding: 28px;
        border: 1px solid var(--ipw-color-border, #d8dde3); border-radius: var(--ipw-card-radius, 32px);
        background: var(--ipw-color-surface, #fff); box-shadow: var(--ipw-card-shadow, 0 26px 70px rgba(20, 30, 40, .11));
      }
      .wm-map-wrap {
        position: relative; min-width: 0; border-radius: calc(var(--ipw-card-radius, 32px) - 10px); overflow: hidden;
        background: radial-gradient(circle at 50% 45%, color-mix(in srgb, var(--ipw-color-primary, #20bbc0) 9%, transparent), transparent 55%),
          color-mix(in srgb, var(--ipw-color-bg, #f4f6f8) 65%, var(--ipw-color-surface, #fff));
      }
      .wm-map { width: 100%; height: 100%; display: block; }
      .wm-grid { fill: none; stroke: var(--ipw-color-border, #d8dde3); stroke-width: 1.4; stroke-dasharray: 5 10; opacity: .74; }
      .wm-country {
        fill: color-mix(in srgb, var(--ipw-color-muted, #68717c) 16%, var(--ipw-color-surface, #fff));
        fill-rule: evenodd; stroke: var(--ipw-color-border, #d8dde3); stroke-width: 1; stroke-linejoin: round;
        transform-box: fill-box; transform-origin: center;
      }
      .wm-country.is-highlight {
        fill: color-mix(in srgb, var(--ipw-color-primary, #20bbc0) 34%, var(--ipw-color-surface, #fff));
        stroke: var(--ipw-color-primary, #20bbc0); stroke-width: 2;
      }
      .wm-point { transform-box: fill-box; transform-origin: center; }
      .wm-point .wm-ring {
        fill: color-mix(in srgb, var(--ipw-color-primary, #20bbc0) 10%, transparent);
        stroke: var(--ipw-color-primary, #20bbc0); stroke-width: 2; opacity: .52;
      }
      .wm-point .wm-dot { fill: var(--ipw-color-primary, #20bbc0); }
      .wm-point .wm-label {
        fill: var(--ipw-color-text, #15171a); font: 700 14px/1 var(--ipw-font-body, Inter, sans-serif);
        paint-order: stroke; stroke: var(--ipw-color-surface, #fff); stroke-width: 6px; stroke-linejoin: round;
      }
      .wm-point.is-highlight .wm-ring {
        fill: color-mix(in srgb, var(--ipw-color-primary, #20bbc0) 28%, transparent); stroke-width: 4;
      }
      .wm-point.is-highlight .wm-label { fill: var(--ipw-color-text, #15171a); font-weight: 820; }
      .wm-panel { display: flex; flex-direction: column; min-width: 0; padding: 18px 14px 12px 12px; }
      .wm-panel-label {
        color: var(--ipw-color-muted, #68717c); font: 720 13px/1 var(--ipw-font-body, Inter, sans-serif);
        letter-spacing: .15em; text-transform: uppercase;
      }
      .wm-focus {
        margin: 20px 0 30px; padding: 24px; border-radius: calc(var(--ipw-card-radius, 32px) - 12px);
        background: var(--ipw-color-primary, #20bbc0); color: var(--ipw-color-on-primary, #102f31);
      }
      .wm-focus-name { font: 760 20px/1.15 var(--ipw-font-body, Inter, sans-serif); }
      .wm-focus-value { margin-top: 10px; font-size: 66px; font-weight: 800; line-height: .9; letter-spacing: -.06em; }
      .wm-ranking { display: grid; gap: 13px; }
      .wm-rank {
        display: grid; grid-template-columns: 1fr 45px; gap: 12px; align-items: center;
        color: var(--ipw-color-muted, #68717c); font: 680 14px/1 var(--ipw-font-body, Inter, sans-serif);
      }
      .wm-rank-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .wm-rank-value { text-align: right; color: var(--ipw-color-text, #15171a); }
      .wm-bar {
        grid-column: 1 / -1; height: 5px; border-radius: 99px; overflow: hidden;
        background: color-mix(in srgb, var(--ipw-color-border, #d8dde3) 65%, transparent);
      }
      .wm-bar > i {
        display: block; width: var(--wm-value); height: 100%; border-radius: inherit;
        background: var(--ipw-color-primary, #20bbc0); transform-origin: left;
      }
    </style>

          points = root.querySelector(".wm-points"),
          ranking = root.querySelector(".wm-ranking");
        safeRows.forEach((row) => {
          const [x, y] = anchors[row.label],
            group = document.createElementNS("http://www.w3.org/2000/svg", "g"),
            radius = 6 + 9 * Math.max(0, row.value / max),
            labelOffset = labelOffsets[row.label] || [x > 900 ? -radius - 10 : radius + 10, 5, x > 900 ? "end" : "start"];
          group.setAttribute("class", "wm-point" + (row.label === focus.label ? " is-highlight" : ""));
          group.setAttribute("transform", `translate(${x} ${y})`);
          group.innerHTML = `<circle class="wm-ring" r="${radius + 4}"></circle><circle class="wm-dot" r="${radius}"></circle><text class="wm-label" x="${labelOffset[0]}" y="${labelOffset[1]}" text-anchor="${labelOffset[2]}">${row.label}</text>`;
          points.append(group);
        });
        safeRows.slice().sort((a, b) => b.value - a.value).slice(0, 5).forEach((row) => {
          const item = document.createElement("div");
          item.className = "wm-rank";
          item.innerHTML = `<span class="wm-rank-name">${row.label}</span><span class="wm-rank-value">${Math.round(row.value)}</span><span class="wm-bar"><i style="--wm-value:${Math.max(3, row.value / max * 100)}%"></i></span>`;
          ranking.append(item);
        });
        root.querySelectorAll(".wm-country").forEach((country) => {
          country.classList.toggle("is-highlight", country.dataset.country === focus.label);
        });
        root.querySelector(".wm-focus-name").textContent = focus.label;
        const focusValue = root.querySelector(".wm-focus-value");
        focusValue.textContent = String(Math.round(focus.value));
        const tl = gsap.timeline({ paused: true });
        tl.fromTo(root.querySelectorAll(".wm-head > *"), { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: .5, stagger: .08, ease: "power3.out" }, .05)
          .fromTo(root.querySelector(".wm-card"), { scale: .985, opacity: 0 }, { scale: 1, opacity: 1, duration: .55, ease: "power3.out" }, .16)
          .fromTo(root.querySelectorAll(".wm-country"), { y: 8, opacity: 0 }, { y: 0, opacity: 1, duration: .34, stagger: { each: .004, from: "center" }, ease: "power2.out" }, .34)
          .fromTo(root.querySelectorAll(".wm-point"), { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: .42, stagger: .06, ease: "back.out(1.8)" }, .72)
          .fromTo(root.querySelectorAll(".wm-rank"), { x: 18, opacity: 0 }, { x: 0, opacity: 1, duration: .34, stagger: .06, ease: "power2.out" }, .88)
          .fromTo(root.querySelectorAll(".wm-bar > i"), { scaleX: 0 }, { scaleX: 1, duration: .72, stagger: .06, ease: "power3.out" }, 1.02)
          .fromTo(focusValue, { textContent: 0 }, { textContent: Math.round(focus.value), duration: .82, snap: { textContent: 1 }, ease: "power2.out" }, .84)
          .to(root.querySelector(".wm-point.is-highlight"), { scale: 1.12, duration: .38, yoyo: true, repeat: 1, ease: "power2.inOut" }, 1.5);
        window.__timelines[id] = tl;
        tl.seek(0);
      })();
    </script>
  </body>
</html>
