<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=1920,height=1080"/>
<title>Conic Progress Ring</title>
<style>@property --ring-progress{syntax:"<percentage>";inherits:false;initial-value:0%}*{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:transparent}#conic-progress-ring{position:relative;width:1920px;height:1080px;padding:120px 150px;background:var(--ipw-color-bg,#f4f6f8);color:var(--ipw-color-text,#15171a);font-family:var(--ipw-font-display,Inter,sans-serif)}h1{margin:0;max-width:700px;font-size:90px;line-height:.94;letter-spacing:-.075em}.label{margin-top:40px;color:var(--ipw-color-primary,#20bbc0);font:780 32px/1 var(--ipw-font-body,Inter,sans-serif)}.note{position:absolute;left:150px;bottom:130px;color:var(--ipw-color-muted,#68717c);font:700 18px/1 var(--ipw-font-body,Inter,sans-serif)}.stage{position:absolute;right:190px;top:150px;width:780px;height:780px;display:grid;place-items:center}.ring{--ring-progress:0%;position:absolute;inset:0;border-radius:50%;background:conic-gradient(from -90deg,var(--ipw-color-primary,#20bbc0) 0 var(--ring-progress),color-mix(in srgb,var(--ipw-color-border,#d8dde3) 75%,transparent) var(--ring-progress) 100%);mask:radial-gradient(farthest-side,transparent calc(100% - 72px),#000 0)}.value{font-size:180px;font-weight:820;letter-spacing:-.09em}.value small{font-size:.32em;color:var(--ipw-color-muted,#68717c)}</style>
<style>.value{position:relative;z-index:1}</style>
</head>
<body>
<main id="conic-progress-ring" data-composition-id="conic-progress-ring" data-width="1920" data-height="1080" data-start="0" data-duration="7">
<h1 data-ipw-variable="title" data-ipw-ai-slot="title">
</h1>
<div class="label" data-ipw-variable="label" data-ipw-ai-slot="label">
</div>
<div class="note" data-ipw-variable="note" data-ipw-ai-slot="note">
</div>
<section class="stage">
<div class="ring">
</div>
<div class="value">
<span>0</span>
<small>%</small>
</div>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js">
</script>
<script>window.__timelines=window.__timelines||{};(function(){const root=document.getElementById("conic-progress-ring"),values={title:"Completion status",progress:76,label:"Ready for review",note:"One signal, one clear outcome",...(window.__hyperframes?.getVariables?.()??{})},target=Math.max(0,Math.min(100,Number(values.progress)||0)),ring=root.querySelector(".ring"),value=root.querySelector(".value span"),state={progress:0};root.querySelectorAll("[data-ipw-variable]").forEach(el=>el.textContent=String(values[el.dataset.ipwVariable]??""));const tl=gsap.timeline({paused:true});tl.from(root.querySelectorAll("h1,.label,.note"),{y:22,opacity:0,stagger:.1,duration:.48,ease:"power3.out"}).from(root.querySelector(".stage"),{scale:.9,opacity:0,duration:.55,ease:"back.out(1.4)"},.08).to(state,{progress:target,duration:1.2,ease:"power2.out",onUpdate:()=>{ring.style.setProperty("--ring-progress",`${state.progress}%`);value.textContent=String(Math.round(state.progress))}},.2);window.__timelines["conic-progress-ring"]=tl;tl.seek(0)})();</script>
</body>
</html>
