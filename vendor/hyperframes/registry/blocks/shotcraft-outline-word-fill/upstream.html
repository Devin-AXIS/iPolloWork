<!-- outline-word-fill -->
<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    [data-composition-id="OutlineWordFill"] { background: #030303; overflow: hidden; }
    .design-stage { position:absolute;left:0;top:0;width:480px;height:270px;overflow:hidden;transform:scale(4);transform-origin:top left; }
    #root { position:absolute;inset:0;background:#030303;overflow:hidden; }
  </style>
</head>
<body>
  <div data-composition-id="OutlineWordFill" data-start="0" data-duration="2.5" data-fps="30" data-width="1920" data-height="1080">
    <div class="design-stage"><div id="root"></div></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    window.__timelines = window.__timelines || {};
    const E={outCubic:t=>1-Math.pow(1-t,3),outQuad:t=>t*(2-t)}; const lerp=(t,a,b)=>a+(b-a)*t;
    const seg=(t,t0,t1,e=t=>t)=>e(Math.min(1,Math.max(0,(t-t0)/(t1-t0))));
    const rand=s=>{const x=Math.sin(s*127.1+311.7)*43758.5453;return x-Math.floor(x);};
    const DUST=Array.from({length:14},(_,i)=>({size:1+rand(i*7+2)*1.2,opacity:0.06+rand(i+55)*0.14,left:rand(i+13)*100,top:rand(i+29)*100}));
    const root=document.getElementById('root'); const tl=gsap.timeline({paused:true}); const state={t:0};
    tl.to(state,{t:1,duration:2.5,ease:'none',onUpdate:()=>{
      const t=state.t, born=seg(t,0.05,0.14,E.outCubic), zoom=seg(t,0.05,0.19,E.outCubic), bright=seg(t,0.66,0.73,E.outQuad);
      const gv=Math.round(lerp(bright,86,145)), cin=seg(t,0.16,0.3,E.outQuad), shrink=seg(t,0.16,0.76,E.outCubic), ext=seg(t,0.5,0.72,E.outCubic);
      const pop=seg(t,0.742,0.762), flash=pop*(1-seg(t,0.762,0.86,E.outQuad));
      const dust=DUST.map((d,i)=>`<div style="position:absolute;width:${d.size}px;height:${d.size}px;border-radius:50%;background:#fff;opacity:${d.opacity};left:${d.left}%;top:${d.top}%"></div>`).join('');
      const sc=lerp(shrink,2.8,1);
      root.innerHTML=dust+`<svg viewBox="-240 -135 480 270" style="position:absolute;inset:0;width:100%;height:100%">
        <g transform="scale(${sc}) rotate(${t*18})"><circle cx="0" cy="0" r="88" fill="none" stroke="#7d838e" stroke-width="1" stroke-dasharray="6 8" opacity="${cin*0.85}"/></g>
        <line y1="0" y2="0" x1="-240" x2="${-240+ext*144}" stroke="#7d838e" stroke-width="1" stroke-dasharray="5 7" opacity="${ext}"/>
        <line y1="0" y2="0" x1="240" x2="${240-ext*144}" stroke="#7d838e" stroke-width="1" stroke-dasharray="5 7" opacity="${ext}"/></svg>
        <div style="position:absolute;left:50%;top:50%;font-family:-apple-system,'Helvetica Neue',sans-serif;font-size:48px;font-weight:500;letter-spacing:0.5px;line-height:1;opacity:${born};transform:translate(-50%,-53%) scale(${lerp(zoom,3.2,1)})">
          <div style="color:transparent;-webkit-text-stroke:1px rgb(${gv-4},${gv},${gv+8});opacity:${1-pop}">Faster</div>
          <div style="position:absolute;inset:0;color:#fff;opacity:${pop};text-shadow:${flash>0.01?`0 0 ${flash*16}px rgba(255,255,255,${flash*0.45})`:'none'}">Faster</div></div>`;
    }},0);
    window.__timelines['OutlineWordFill']=tl;
  </script>
</body>
</html>
