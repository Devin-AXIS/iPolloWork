<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"title","label":"标题","type":"string","default":"评论区在讨论什么？","maxLength":60},{"id":"comments","label":"评论列表","type":"string","default":"阿椰:这个转场节奏太舒服了|简一:参数能不能分享一下？|橙子汽水:收藏了，今晚就试。","maxLength":280},{"id":"pinned","label":"置顶用户","type":"string","default":"简一","maxLength":28},{"id":"footer","label":"底部文案","type":"string","default":"置顶关键问题，让讨论继续生长。","maxLength":72}]'>
<head><meta charset="UTF-8"/><meta name="viewport" content="width=1920,height=1080"/><title>Douyin Comment Stack</title><style>
*{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:transparent}#root{position:relative;display:flex;width:1920px;height:1080px;padding:72px 110px;overflow:hidden;background:var(--ipw-color-bg,#f4f6f8);color:var(--ipw-color-text,#15171a);font-family:var(--ipw-font-display,Inter,Arial,sans-serif)}#root::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,color-mix(in srgb,var(--ipw-color-border,#d8dde3) 22%,transparent) 1px,transparent 1px),linear-gradient(color-mix(in srgb,var(--ipw-color-border,#d8dde3) 18%,transparent) 1px,transparent 1px);background-size:72px 72px;opacity:.2}#root>*{position:relative;z-index:1}.sm-animate,.sm-pop,.social-list-item{will-change:transform,opacity}
.comments{width:1380px;margin:auto;padding:60px 66px;border:1px solid var(--ipw-color-border,#d8dde3);border-radius:38px;background:var(--ipw-color-surface,#fff);box-shadow:var(--ipw-card-shadow,0 30px 90px rgba(20,30,40,.14))}.comments-head{display:flex;align-items:center}.comments-title{margin:0;font-size:48px;letter-spacing:-.035em}.comments-mark{margin-left:auto;color:#fe2c55;font-size:24px;font-weight:950}.comments-list{display:grid;gap:16px;margin:42px 0}.social-list-item{display:grid;grid-template-columns:170px 1fr;gap:26px;padding:23px 26px;border:1px solid var(--ipw-color-border,#d8dde3);border-radius:20px;background:color-mix(in srgb,var(--ipw-color-surface,#fff) 94%,var(--ipw-color-primary,#4f46e5))}.social-list-item.is-highlight{border-color:#fe2c55;box-shadow:inset 7px 0 0 #fe2c55}.social-list-label{font-size:20px;font-weight:900}.social-list-value{font-size:23px;line-height:1.35}.comments-footer{color:var(--ipw-color-muted,#68717c);font-size:20px}
</style></head>
<body><main id="root" data-composition-id="douyin-comment-stack" data-width="1920" data-height="1080" data-start="0" data-duration="8" data-defaults='{"title":"评论区在讨论什么？","comments":"阿椰:这个转场节奏太舒服了|简一:参数能不能分享一下？|橙子汽水:收藏了，今晚就试。","pinned":"简一","footer":"置顶关键问题，让讨论继续生长。"}'><section class="comments sm-animate"><header class="comments-head"><h1 class="comments-title" data-ipw-variable="title" data-ipw-ai-slot="title"></h1><span class="comments-mark">♪ 抖音热评</span></header><div class="comments-list" data-ipw-list="comments" data-list-mode="pair" data-highlight-key="pinned" data-ipw-ai-slot="comments"></div><span hidden data-ipw-variable="pinned" data-ipw-ai-slot="pinned"></span><footer class="comments-footer" data-ipw-variable="footer" data-ipw-ai-slot="footer"></footer></section></main><script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script><script>window.__timelines=window.__timelines||{};(function(){
const root=document.getElementById("root"),id="douyin-comment-stack";
const defaults=JSON.parse(root.dataset.defaults),runtimeValues=window.__hyperframes?.getVariables?.()??window.__hfVariablesByComp?.[id]??{},values={...defaults,...runtimeValues};
root.querySelectorAll("[data-ipw-variable]").forEach(function(el){el.textContent=String(values[el.dataset.ipwVariable]??"")});
function parts(value){return String(value??"").split(/[|,]/).map(function(item){return item.trim()}).filter(Boolean)}
function pair(value){const index=value.indexOf(":");return index<0?[value,""]:[value.slice(0,index).trim(),value.slice(index+1).trim()]}
root.querySelectorAll("[data-ipw-list]").forEach(function(host){
 const key=host.dataset.ipwList,mode=host.dataset.listMode||"plain",highlight=String(values[host.dataset.highlightKey]??""),active=host.dataset.activeKey?Math.max(1,Number(values[host.dataset.activeKey]??0)):0;
 parts(values[key]).slice(0,4).forEach(function(raw,index){
  const split=pair(raw),item=document.createElement("article");item.className="social-list-item sm-animate";
  if((highlight&&split[0]===highlight)||(active===index+1))item.classList.add("is-highlight");
  if(mode==="pair"||mode==="meter"){
   const label=document.createElement("div"),value=document.createElement("div");label.className="social-list-label";value.className="social-list-value";label.textContent=split[0];value.textContent=split[1];item.append(label,value);
   if(mode==="meter"){const meter=document.createElement("div"),fill=document.createElement("span");meter.className="social-meter";fill.style.width=Math.max(0,Math.min(100,Number.parseFloat(split[1])||0))+"%";meter.append(fill);item.append(meter)}
  }else{item.textContent=raw}
  host.append(item);
 });
});
const initial={};
if("rise"==="slide-left")Object.assign(initial,{x:-58,opacity:0});else if("rise"==="slide-right")Object.assign(initial,{x:58,opacity:0});else if("rise"==="scale")Object.assign(initial,{scale:.88,opacity:0});else if("rise"==="clip")Object.assign(initial,{y:46,opacity:0,clipPath:"inset(0 0 100% 0)"});else Object.assign(initial,{y:48,opacity:0});
const tl=gsap.timeline({paused:true});
tl.fromTo(root.querySelectorAll(".sm-animate"),initial,{x:0,y:0,scale:1,opacity:1,clipPath:"inset(0 0 0% 0)",duration:.62,stagger:.085,ease:"power3.out"},.08).fromTo(root.querySelectorAll(".sm-pop"),{scale:.65,opacity:0},{scale:1,opacity:1,duration:.5,stagger:.08,ease:"back.out(1.5)"},.38).fromTo(root.querySelectorAll(".sm-draw"),{scaleX:0,transformOrigin:"left center"},{scaleX:1,duration:.6,ease:"power2.out"},.22);
window.__timelines[id]=tl;tl.seek(0);
})();</script></body></html>
