<!-- ScrambleDecode -->
<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    [data-composition-id="ScrambleDecode"] { width: 1920px; height: 1080px; background: #ececea; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 48px; }
  </style>
</head>
<body>
  <div data-composition-id="ScrambleDecode" data-start="0" data-duration="4.3333" data-fps="30" data-width="1920" data-height="1080" id="comp"></div>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    window.__timelines = window.__timelines || {};
    const G={bg:'#ececea',line:'#dcdcda',ink:'#2f2f2f',mid:'#8f8f8d',card:'#ffffff'};
    const TEXT='DECODE SPEED', CHARSET='ABCDEF0123456789#$%&', LOCK_START=20, LOCK_STEP=6, FLASH_LEN=2, TOTAL=130;
    const h=n=>{const s=Math.sin(n*127.3)*43758.5453;return s-Math.floor(s);};
    const comp=document.getElementById('comp'); const tl=gsap.timeline({paused:true}); const state={t:0};
    tl.to(state,{t:1,duration:TOTAL/30,ease:'none',onUpdate:()=>{
      const frame=Math.min(TOTAL-1,Math.round(state.t*(TOTAL-1))); const chars=TEXT.split('');
      const lockedCount=chars.filter((c,i)=>c===' '||frame>=LOCK_START+i*LOCK_STEP).length, allLocked=lockedCount===chars.length;
      const row=chars.map((ch,i)=>{if(ch===' ')return `<span style="display:inline-block;width:0.7em"></span>`;
        const lockFrame=LOCK_START+i*LOCK_STEP, locked=frame>=lockFrame, flashing=locked&&frame<lockFrame+FLASH_LEN;
        const tick=Math.floor(frame/2), scrambleChar=CHARSET[Math.floor(h(i*101+tick*7+13)*CHARSET.length)], shown=locked?ch:scrambleChar;
        return `<span style="display:inline-block;width:1ch;text-align:center;color:${flashing?G.card:locked?G.ink:G.mid};background:${flashing?G.ink:'transparent'}">${shown}</span>`;}).join('');
      comp.innerHTML=`<div style="font-family:ui-monospace,Menlo,Monaco,monospace;font-weight:800;font-size:120px;letter-spacing:2px;display:flex">${row}</div>
        <div style="width:900px;height:10px;background:${G.line};border-radius:5px;overflow:hidden"><div style="width:${(lockedCount/chars.length)*100}%;height:100%;background:${allLocked?G.ink:G.mid};border-radius:5px"></div></div>`;
    }},0);
    window.__timelines['ScrambleDecode']=tl;
  </script>
</body>
</html>
