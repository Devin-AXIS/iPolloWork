<!doctype html>
<html
  lang="en"
  data-composition-variables='[{"id":"title","label":"Title","type":"string","default":"A route that connects markets","maxLength":72},{"id":"origin","label":"Origin","type":"string","default":"Shanghai","maxLength":28},{"id":"destination","label":"Destination","type":"string","default":"Singapore","maxLength":28},{"id":"annotation","label":"Annotation","type":"string","default":"One reusable route. No scene rewrite required.","maxLength":96}]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Route Map</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 1920px;
        height: 1080px;
        margin: 0;
        overflow: hidden;
        background: transparent;
      }

      #root {
        --component-accent: var(--ipw-color-primary, #20bbc0);
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background:
          radial-gradient(circle at 78% 18%, color-mix(in srgb, var(--component-accent) 16%, transparent), transparent 31%),
          var(--ipw-color-bg, #f4f6f8);
        color: var(--ipw-color-text, #15171a);
        font-family: Inter, sans-serif;
      }

      #root::before {
        position: absolute;
        inset: 0;
        content: "";
        background-image: linear-gradient(var(--ipw-color-border, rgba(18, 24, 32, 0.08)) 1px, transparent 1px),
          linear-gradient(90deg, var(--ipw-color-border, rgba(18, 24, 32, 0.08)) 1px, transparent 1px);
        background-size: 96px 96px;
        mask-image: linear-gradient(to bottom, black, transparent 82%);
        opacity: 0.46;
      }

      .header {
        position: absolute;
        z-index: 5;
        top: 76px;
        left: 88px;
        width: 1110px;
      }

      .eyebrow {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 18px;
        color: var(--ipw-color-muted, #68717c);
        font-size: 20px;
        font-weight: 750;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .eyebrow::before {
        width: 46px;
        height: 5px;
        border-radius: 999px;
        background: var(--component-accent);
        content: "";
      }

      h1 {
        max-width: 1050px;
        margin: 0;
        font-family: Inter, sans-serif;
        font-size: 82px;
        font-weight: 780;
        line-height: 0.98;
        letter-spacing: -0.055em;
      }

      .map-card {
        position: absolute;
        z-index: 2;
        inset: 246px 72px 64px;
        overflow: hidden;
        border: 1px solid var(--ipw-color-border, rgba(18, 24, 32, 0.11));
        border-radius: var(--ipw-card-radius, 34px);
        background: color-mix(in srgb, var(--ipw-color-surface, #ffffff) 88%, transparent);
        box-shadow: var(--ipw-card-shadow, 0 32px 90px rgba(22, 28, 38, 0.14));
        backdrop-filter: blur(22px);
      }

      .map-svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      .graticule {
        fill: none;
        stroke: var(--ipw-color-border, rgba(18, 24, 32, 0.1));
        stroke-width: 1.2;
      }

      .land {
        fill: color-mix(in srgb, var(--ipw-color-muted, #6b7280) 18%, var(--ipw-color-surface, #ffffff));
        stroke: color-mix(in srgb, var(--ipw-color-border, #d8dde3) 88%, transparent);
        stroke-width: 2;
      }

      .route-shadow,
      .route-line {
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .route-shadow {
        stroke: color-mix(in srgb, var(--component-accent) 24%, transparent);
        stroke-width: 28;
      }

      .route-line {
        stroke: var(--component-accent);
        stroke-width: 8;
      }

      .marker {
        position: absolute;
        z-index: 4;
        width: 28px;
        height: 28px;
        border: 7px solid var(--ipw-color-surface, #ffffff);
        border-radius: 50%;
        background: var(--component-accent);
        box-shadow: 0 0 0 10px color-mix(in srgb, var(--component-accent) 18%, transparent),
          0 14px 28px rgba(17, 24, 39, 0.2);
        transform: translate(-50%, -50%);
      }

      .marker-card {
        position: absolute;
        top: 34px;
        min-width: 180px;
        padding: 14px 16px 15px;
        border: 1px solid var(--ipw-color-border, rgba(18, 24, 32, 0.1));
        border-radius: 18px;
        background: color-mix(in srgb, var(--ipw-color-surface, #ffffff) 90%, transparent);
        box-shadow: 0 16px 40px rgba(22, 28, 38, 0.13);
        backdrop-filter: blur(16px);
      }

      .origin .marker-card {
        left: -2px;
      }

      .destination .marker-card {
        right: -2px;
        text-align: right;
      }

      .marker-card strong {
        display: block;
        font-size: 23px;
        line-height: 1;
      }

      .marker-card span {
        display: block;
        margin-top: 8px;
        color: var(--ipw-color-text, #15171a);
        font-size: 14px;
        font-weight: 800;
        letter-spacing: 0.12em;
      }

      .traveler {
        position: absolute;
        z-index: 6;
        display: grid;
        width: 62px;
        height: 62px;
        place-items: center;
        border: 1px solid color-mix(in srgb, var(--component-accent) 40%, transparent);
        border-radius: 20px;
        background: var(--component-accent);
        color: var(--ipw-color-on-primary, #102f31);
        box-shadow: 0 18px 44px color-mix(in srgb, var(--component-accent) 34%, transparent);
        font-size: 27px;
        transform: translate(-50%, -50%);
      }

      .annotation {
        position: absolute;
        z-index: 7;
        right: 92px;
        top: 82px;
        width: 410px;
        padding: 22px 24px;
        border-left: 4px solid var(--component-accent);
        border-radius: 0 20px 20px 0;
        background: color-mix(in srgb, var(--ipw-color-surface, #ffffff) 82%, transparent);
        color: var(--ipw-color-muted, #68717c);
        font-size: 20px;
        font-weight: 580;
        line-height: 1.45;
        backdrop-filter: blur(18px);
      }

      .component-mark {
        position: absolute;
        z-index: 7;
        right: 100px;
        bottom: 84px;
        display: flex;
        align-items: center;
        gap: 9px;
        color: var(--ipw-color-muted, #68717c);
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .component-mark i {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--component-accent);
      }
    </style>
  </head>
  <body>
    <main
      id="root"
      data-composition-id="route-map"
      data-width="1920"
      data-height="1080"
      data-start="0"
      data-duration="10"
    >
      <header class="header" data-ipw-ai-slot="title">
        <div class="eyebrow">Map component · 01</div>
        <h1 id="title">A route that connects markets</h1>
      </header>

      <section class="map-card" aria-label="Animated route map">
        <svg class="map-svg" viewBox="0 0 1776 690" aria-hidden="true">
          <g class="graticule">
            <path d="M0 138H1776M0 276H1776M0 414H1776M0 552H1776" />
            <path d="M296 0V690M592 0V690M888 0V690M1184 0V690M1480 0V690" />
          </g>
          <g transform="translate(0 -246)">
            <path class="land" d="M100 484 185 426 310 402 402 430 455 497 414 545 330 553 278 632 201 594 124 601 73 553Z" />
            <path class="land" d="M452 650 538 624 614 667 644 747 600 845 548 888 516 812 530 735Z" />
            <path class="land" d="M746 459 850 402 964 417 1038 472 1132 446 1270 480 1366 562 1310 626 1212 617 1140 674 1036 650 948 580 844 564 778 526Z" />
            <path class="land" d="M1044 671 1118 645 1182 698 1160 795 1090 850 1030 778Z" />
            <path class="land" d="M1380 750 1462 716 1558 746 1602 812 1520 856 1427 840Z" />
            <path class="land" d="M1550 525 1600 496 1652 532 1624 570 1578 574Z" />
          </g>
          <path id="route-shadow" class="route-shadow" />
          <path id="route-line" class="route-line" />
        </svg>

        <div id="origin" class="marker origin" data-ipw-ai-slot="origin">
          <div class="marker-card">
            <strong id="origin-label">Shanghai</strong>
            <span id="origin-code">SHA</span>
          </div>
        </div>
        <div id="destination" class="marker destination" data-ipw-ai-slot="destination">
          <div class="marker-card">
            <strong id="destination-label">Singapore</strong>
            <span id="destination-code">SIN</span>
          </div>
        </div>
        <div id="traveler" class="traveler" aria-hidden="true">➜</div>
      </section>

      <aside id="annotation" class="annotation" data-ipw-ai-slot="annotation">
        One configurable component. No scene rewrite required.
      </aside>
      <div class="component-mark"><i></i> Theme linked · Seekable</div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};

      var defaults = {
        title: "A route that connects markets",
        origin: "Shanghai",
        destination: "Singapore",
        annotation: "One reusable route. No scene rewrite required.",
      };
      var root = document.getElementById("root");
      var runtimeCompositionId = root && root.getAttribute("data-composition-id");
      var supplied =
        window.__hyperframes && window.__hyperframes.getVariables
          ? window.__hyperframes.getVariables()
          : (window.__hfVariablesByComp && window.__hfVariablesByComp[runtimeCompositionId]) || {};
      var values = Object.assign({}, defaults, supplied);

      var rootStyle = getComputedStyle(root);
      var bodyFont = rootStyle.getPropertyValue("--ipw-font-body").trim();
      var displayFont = rootStyle.getPropertyValue("--ipw-font-display").trim();
      if (bodyFont) root.style.fontFamily = bodyFont;
      if (displayFont) document.querySelector("h1").style.fontFamily = displayFont;
      var origin = { x: 498, y: 344 };
      var destination = { x: 1248, y: 404 };
      var control = {
        x: (origin.x + destination.x) / 2,
        y: Math.max(72, Math.min(origin.y, destination.y) - 230),
      };
      var routePath =
        "M " + origin.x + " " + origin.y + " Q " + control.x + " " + control.y + " " + destination.x + " " + destination.y;

      document.getElementById("title").textContent = String(values.title);
      document.getElementById("origin-label").textContent = String(values.origin);
      document.getElementById("origin-code").textContent = String(values.origin).slice(0, 3).toUpperCase();
      document.getElementById("destination-label").textContent = String(values.destination);
      document.getElementById("destination-code").textContent = String(values.destination).slice(0, 3).toUpperCase();
      document.getElementById("annotation").textContent = String(values.annotation);
      document.getElementById("origin").style.left = origin.x + "px";
      document.getElementById("origin").style.top = origin.y + "px";
      document.getElementById("destination").style.left = destination.x + "px";
      document.getElementById("destination").style.top = destination.y + "px";
      document.getElementById("route-shadow").setAttribute("d", routePath);
      document.getElementById("route-line").setAttribute("d", routePath);

      function pointOnRoute(progress) {
        var inverse = 1 - progress;
        return {
          x: inverse * inverse * origin.x + 2 * inverse * progress * control.x + progress * progress * destination.x,
          y: inverse * inverse * origin.y + 2 * inverse * progress * control.y + progress * progress * destination.y,
        };
      }

      var traveler = document.getElementById("traveler");
      var travel = { progress: 0 };
      function placeTraveler() {
        var current = pointOnRoute(travel.progress);
        var ahead = pointOnRoute(Math.min(1, travel.progress + 0.01));
        var angle = (Math.atan2(ahead.y - current.y, ahead.x - current.x) * 180) / Math.PI;
        traveler.style.left = current.x + "px";
        traveler.style.top = current.y + "px";
        traveler.style.transform = "translate(-50%, -50%) rotate(" + angle + "deg)";
      }
      placeTraveler();

      var routeLength = document.getElementById("route-line").getTotalLength();
      gsap.set(["#route-line", "#route-shadow"], {
        strokeDasharray: routeLength,
        strokeDashoffset: routeLength,
      });
      gsap.set(["#origin", "#destination", "#traveler", ".annotation", ".component-mark"], {
        opacity: 0,
      });
      gsap.set(["#origin", "#destination", "#traveler"], { scale: 0.35 });
      gsap.set(".annotation", { x: 24 });

      var travelDuration = 4;
      var tl = gsap.timeline({ paused: true });
      tl.from(".header", { y: 24, opacity: 0, duration: 0.62, ease: "power3.out" }, 0.1)
        .from(".map-card", { y: 34, scale: 0.985, opacity: 0, duration: 0.72, ease: "power3.out" }, 0.2)
        .to("#origin", { opacity: 1, scale: 1, duration: 0.34, ease: "back.out(2.4)" }, 0.76)
        .to("#route-shadow", { strokeDashoffset: 0, duration: travelDuration, ease: "power1.inOut" }, 1.02)
        .to("#route-line", { strokeDashoffset: 0, duration: travelDuration, ease: "power2.inOut" }, 1.06)
        .to("#traveler", { opacity: 1, scale: 1, duration: 0.22, ease: "back.out(2)" }, 1.0)
        .to(travel, { progress: 1, duration: travelDuration, ease: "sine.inOut", onUpdate: placeTraveler }, 1.04)
        .to("#destination", { opacity: 1, scale: 1, duration: 0.36, ease: "back.out(2.6)" }, 0.76 + travelDuration)
        .to(".annotation", { opacity: 1, x: 0, duration: 0.46, ease: "power3.out" }, 1.18 + travelDuration)
        .to(".component-mark", { opacity: 1, duration: 0.35, ease: "power2.out" }, 1.34 + travelDuration);

      window.__timelines["route-map"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
