<!doctype html>
<html lang="en" data-composition-variables='[{"id":"name","label":"Name","type":"string","default":"Maya Chen","maxLength":40},{"id":"role","label":"Role","type":"string","default":"Product strategist","maxLength":56},{"id":"eyebrow","label":"Eyebrow","type":"string","default":"FIELD NOTE 01","maxLength":32},{"id":"alignment","label":"Alignment","type":"enum","default":"left","options":[{"value":"left","label":"Left"},{"value":"right","label":"Right"}]}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920,height=1080" />
    <title>Lower Third</title>
    <style>
      *{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:transparent}
      #lt-clean-bar{position:relative;width:1920px;height:1080px;overflow:hidden;font-family:var(--ipw-font-display,Inter,sans-serif);color:var(--ipw-color-text,#15171a)}
      .lt-shell{position:absolute;left:112px;bottom:96px;display:grid;grid-template-columns:12px auto;min-width:580px;overflow:hidden;border:1px solid var(--ipw-color-border,#d8dde3);border-radius:var(--ipw-card-radius,28px);background:var(--ipw-card-bg,var(--ipw-color-surface,#fff));box-shadow:var(--ipw-card-shadow,0 24px 58px rgba(20,30,40,.14));transform-origin:left center;will-change:transform,clip-path}
      .lt-shell.is-right{left:auto;right:112px;transform-origin:right center}.lt-accent{background:var(--ipw-color-primary,#20bbc0);transform-origin:bottom}.lt-copy{padding:26px 40px 28px 32px}.lt-eyebrow{margin-bottom:10px;color:var(--ipw-color-primary,#20bbc0);font:760 16px/1 var(--ipw-font-body,Inter,sans-serif);letter-spacing:.16em;text-transform:uppercase}.lt-name{font-size:54px;font-weight:790;line-height:.96;letter-spacing:-.045em;white-space:nowrap}.lt-role{margin-top:12px;color:var(--ipw-color-muted,#68717c);font:610 24px/1.2 var(--ipw-font-body,Inter,sans-serif);white-space:nowrap}.lt-rule{position:absolute;left:30px;right:30px;bottom:0;height:3px;background:var(--ipw-color-primary,#20bbc0);transform-origin:left}
    </style>
  </head>
  <body>
    <main id="lt-clean-bar" data-composition-id="lt-clean-bar" data-width="1920" data-height="1080" data-start="0" data-duration="6" data-ipw-ai-slot="alignment">
      <section class="lt-shell">
        <i class="lt-accent"></i>
        <div class="lt-copy">
          <div class="lt-eyebrow" data-ipw-variable="eyebrow" data-ipw-ai-slot="eyebrow"></div>
          <div class="lt-name" data-ipw-variable="name" data-ipw-ai-slot="name"></div>
          <div class="lt-role" data-ipw-variable="role" data-ipw-ai-slot="role"></div>
          <i class="lt-rule"></i>
        </div>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <script>
      window.__timelines=window.__timelines||{};(function(){
        const root=document.getElementById("lt-clean-bar"),id=root.dataset.compositionId,values={name:"Maya Chen",role:"Product strategist",eyebrow:"FIELD NOTE 01",alignment:"left",...(window.__hyperframes?.getVariables?.()??window.__hfVariablesByComp?.[id]??{})};
        root.querySelectorAll("[data-ipw-variable]").forEach(el=>{el.textContent=String(values[el.dataset.ipwVariable]??"")});
        const shell=root.querySelector(".lt-shell");shell.classList.toggle("is-right",values.alignment==="right");
        const direction=values.alignment==="right"?90:-90,tl=gsap.timeline({paused:true});
        tl.fromTo(shell,{x:direction,clipPath:values.alignment==="right"?"inset(0 0 0 100%)":"inset(0 100% 0 0)",opacity:0},{x:0,clipPath:"inset(0 0 0 0)",opacity:1,duration:.62,ease:"power4.out"},.08)
          .fromTo(root.querySelector(".lt-accent"),{scaleY:0},{scaleY:1,duration:.42,ease:"power3.out"},.22)
          .fromTo(root.querySelectorAll(".lt-copy>*:not(.lt-rule)"),{y:28,opacity:0},{y:0,opacity:1,duration:.46,stagger:.08,ease:"power3.out"},.28)
          .fromTo(root.querySelector(".lt-rule"),{scaleX:0},{scaleX:1,duration:.5,ease:"power2.out"},.55)
          .to(shell,{y:16,opacity:0,duration:.32,ease:"power2.in"},5.55);
        window.__timelines[id]=tl;tl.seek(0);
      })();
    </script>
  </body>
</html>
