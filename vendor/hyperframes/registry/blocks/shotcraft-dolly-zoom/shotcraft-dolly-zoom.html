<script data-ipw-motion-recipe="1">
(async function(){await document.fonts.ready;const root=document.getElementById("shotcraft-dolly-zoom"),id=root.dataset.compositionId;const values={...{"title":"主体固定背景变焦","mediaUrl":"assets/evidence.svg","captureLayout":"{\"width\":1920,\"height\":1080,\"pixelRatio\":1,\"regions\":[{\"id\":\"region-0\",\"x\":50,\"y\":300,\"width\":240,\"height\":240},{\"id\":\"region-1\",\"x\":330,\"y\":300,\"width\":240,\"height\":240},{\"id\":\"region-2\",\"x\":610,\"y\":300,\"width\":240,\"height\":240},{\"id\":\"region-3\",\"x\":890,\"y\":300,\"width\":240,\"height\":240},{\"id\":\"region-4\",\"x\":1170,\"y\":300,\"width\":240,\"height\":240},{\"id\":\"region-5\",\"x\":1450,\"y\":300,\"width\":240,\"height\":240}],\"heroId\":\"region-3\",\"foregroundIds\":[\"region-0\",\"region-5\"]}"},...(window.__hyperframes?.getVariables?.()??{}),...(window.__hfVariablesByComp?.[id]??{})};const recipe={"version":1,"pattern":"state-transformation","minHoldSeconds":0.7,"textLimits":{"title":{"maxLines":1,"maxLineLength":12}},"events":[{"id":"camera","target":".sc-layer","time":0.65,"duration":3.1666666666666665,"action":"在真实素材上突出一个固定主体，背景膨胀形成一次戏剧性强调。"}],"usage":{"useWhen":["在真实素材上突出一个固定主体，背景膨胀形成一次戏剧性强调。"],"avoidWhen":["不用于日常连续阅读或每幕重复；全片最多一次，不给主体增加运镜或模糊。"],"inputRules":{"title":"单行最多12字；不遮盖素材中的必要信息。","mediaUrl":"已有项目内真实页面截图；禁止用演示卡片或手绘假界面替代。","captureLayout":"JSON: width/height 是截图的 CSS 页面尺寸，pixelRatio 是像素倍率；regions 是6–8个实测 {id,x,y,width,height} 区域，heroId 与两个 foregroundIds 引用已有区域。图片像素尺寸必须一致。先核对裁切，过密或无适合主体时换配方，不猜坐标。"},"readingOrder":["建立真实页面和层次","在真实素材上突出一个固定主体，背景膨胀形成一次戏剧性强调。","保留主体和最终可读画面"],"cueBindings":{"camera":"绑定开始探索/强调主体的实测旁白短语；内部时值比例和各层运动关系不变。"},"fallback":{"overflow":"拆镜或选择合适配方，不缩小文字。","missingInput":"先取得真实截图和实测区域；素材不可用则报告缺口。","timingMismatch":"绑定实测短语并整体重排；过长旁白拆镜，不让相机漫无目的持续移动。","inapplicable":"换合适的已验证配方；仅配方模式下禁止自绘替代。"},"example":{"values":{"title":"主体固定背景变焦","mediaUrl":"assets/evidence.svg","captureLayout":"{\"width\":1920,\"height\":1080,\"pixelRatio\":1,\"regions\":[{\"id\":\"region-0\",\"x\":50,\"y\":300,\"width\":240,\"height\":240},{\"id\":\"region-1\",\"x\":330,\"y\":300,\"width\":240,\"height\":240},{\"id\":\"region-2\",\"x\":610,\"y\":300,\"width\":240,\"height\":240},{\"id\":\"region-3\",\"x\":890,\"y\":300,\"width\":240,\"height\":240},{\"id\":\"region-4\",\"x\":1170,\"y\":300,\"width\":240,\"height\":240},{\"id\":\"region-5\",\"x\":1450,\"y\":300,\"width\":240,\"height\":240}],\"heroId\":\"region-3\",\"foregroundIds\":[\"region-0\",\"region-5\"]}"},"narration":"在真实素材上突出一个固定主体，背景膨胀形成一次戏剧性强调。"},"acceptance":["真实页面裁切与实测坐标一致，原图解码成功，高清主阅读层不模糊。","主体屏幕矩形保持固定；背景从1放大到2.25，模糊从0增加到3.5。","保持原曲线和动效关系，正反向拖动恢复同一画面；这不是像素完全相同的Remotion渲染。"]}};
 const cues=JSON.parse(String(values.motionCueTimes??"{}"));
 root.querySelector("[data-ipw-variable=title]").textContent=String(values.title);

 const capture=JSON.parse(String(values.captureLayout));
 const source=new Image();source.src=String(values.mediaUrl);await source.decode();
 if(source.naturalWidth!==Math.round(capture.width*capture.pixelRatio)||source.naturalHeight!==Math.round(capture.height*capture.pixelRatio))throw Error('Screenshot dimensions differ from captureLayout');
 const layer=className=>{const element=document.createElement('div');element.className='sc-layer '+className;root.append(element);return element;};
 const page=(parent,width,top,opacity)=>{const image=source.cloneNode();Object.assign(image.style,{position:'absolute',left:'0px',top:Math.max(top,1080-capture.height*width/capture.width)+'px',width:width+'px',opacity:String(opacity)});parent.append(image);};
 const crop=(parent,region,width,x,y,className)=>{const scale=width/region.width,box=document.createElement('div');box.className='sc-crop '+className;box.dataset.captureRegion=region.id;Object.assign(box.style,{left:x+'px',top:y+'px',width:width+'px',height:region.height*scale+'px'});const image=source.cloneNode();Object.assign(image.style,{position:'absolute',width:capture.width*scale+'px',left:-region.x*scale+'px',top:-region.y*scale+'px'});box.append(image);parent.append(box);return box;};
 const region=id=>{const item=capture.regions.find(item=>item.id===id);if(!item)throw Error('Missing capture region '+id);return item;};
 const cubic=(x1,y1,x2,y2,t)=>{const coordinate=(a,b,p)=>3*(1-p)*(1-p)*p*a+3*(1-p)*p*p*b+p*p*p;let low=0,high=1;for(let i=0;i<24;i++){const p=(low+high)/2;if(coordinate(x1,x2,p)<t)low=p;else high=p;}return t<=0?0:t>=1?1:coordinate(y1,y2,(low+high)/2);};
 
 const background=layer('sc-background');background.style.transformOrigin='960px 540px';page(background,1920,-400,.55);
 const xs=[180,1280,240,1220,700,760,60,1500],ys=[140,120,700,720,60,840,420,430];
 capture.regions.filter(item=>item.id!==capture.heroId).slice(0,8).forEach((item,k)=>{const card=crop(background,item,320,xs[k],ys[k],'sc-card');card.style.opacity='.9';});
 const subject=region(capture.heroId),hero=crop(root,subject,520,700,540-subject.height*520/subject.width/2,'sc-hero');

 const ease=t=>cubic(.4,0,.3,1,t);
 
 const state={progress:0},event=recipe.events[0],tl=gsap.timeline({paused:true});apply(0);tl.fromTo(state,{progress:0},{progress:1,duration:event.duration,ease,onUpdate:()=>apply(state.progress)},cues.camera??event.time);tl.to({}, {duration:5.2},0);window.__timelines=window.__timelines||{};window.__timelines[id]=tl;tl.seek(0,false);})();
