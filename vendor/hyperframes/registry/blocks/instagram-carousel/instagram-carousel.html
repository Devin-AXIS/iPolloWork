<!doctype html>
<html lang="en" data-composition-variables='[{"id":"title","label":"Carousel title","type":"string","default":"Four ways to make the story clearer","maxLength":72},{"id":"slides","label":"Slides","description":"Slide and message pairs.","type":"string","default":"01:Lead with one promise,02:Show the before state,03:Make the change visible,04:End with one action","maxLength":520},{"id":"active","label":"Active slide","type":"string","default":"02","maxLength":20},{"id":"cta","label":"Call to action","type":"string","default":"Save this for your next launch","maxLength":56}]'>
<head><meta charset="UTF-8"/><meta name="viewport" content="width=1920,height=1080"/><title>Instagram Carousel</title><style>
*{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:transparent}#root{position:relative;display:flex;width:1920px;height:1080px;padding:72px 110px;overflow:hidden;background:var(--ipw-color-bg,#f4f6f8);color:var(--ipw-color-text,#15171a);font-family:var(--ipw-font-display,Inter,Arial,sans-serif)}#root::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,color-mix(in srgb,var(--ipw-color-border,#d8dde3) 22%,transparent) 1px,transparent 1px),linear-gradient(color-mix(in srgb,var(--ipw-color-border,#d8dde3) 18%,transparent) 1px,transparent 1px);background-size:72px 72px;opacity:.2}#root>*{position:relative;z-index:1}.sm-animate,.sm-pop,.social-list-item{will-change:transform,opacity}
.carousel{width:1580px;margin:auto}.carousel-top{display:flex;align-items:end;justify-content:space-between;margin-bottom:38px}.carousel-title{max-width:980px;margin:0;font-size:64px;line-height:1;letter-spacing:-.05em}.carousel-cta{max-width:420px;color:var(--ipw-color-muted,#68717c);font-size:20px;text-align:right}.carousel-list{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.carousel-list .social-list-item{position:relative;min-height:520px;padding:34px;border:1px solid var(--ipw-color-border,#d8dde3);border-radius:30px;background:var(--ipw-color-surface,#fff);overflow:hidden}.carousel-list .social-list-item::before{content:"";position:absolute;width:220px;height:220px;right:-60px;bottom:-65px;border-radius:50%;background:linear-gradient(135deg,#833ab4,#fd1d1d,#fcb045);opacity:.18}.carousel-list .is-highlight{border:3px solid #d14a76;box-shadow:0 24px 70px rgba(209,74,118,.16)}.carousel-list .social-list-label{font-size:18px;font-weight:900;color:#d14a76}.carousel-list .social-list-value{margin-top:180px;font-size:29px;line-height:1.12;font-weight:780}.carousel-list .is-highlight .social-list-value{font-size:34px}
</style></head>
<body><main id="root" data-composition-id="instagram-carousel" data-width="1920" data-height="1080" data-start="0" data-duration="9" data-defaults='{"title":"Four ways to make the story clearer","slides":"01:Lead with one promise,02:Show the before state,03:Make the change visible,04:End with one action","active":"02","cta":"Save this for your next launch"}'><section class="carousel"><header class="carousel-top"><h1 class="carousel-title sm-animate" data-ipw-variable="title" data-ipw-ai-slot="title"></h1><div class="carousel-cta sm-animate" data-ipw-variable="cta" data-ipw-ai-slot="cta"></div></header><div class="carousel-list" data-ipw-list="slides" data-list-mode="pair" data-highlight-key="active" data-ipw-ai-slot="slides"></div><span hidden data-ipw-ai-slot="active"></span></section></main><script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script><script>
window.__timelines=window.__timelines||{};(function(){
const root=document.getElementById("root"),id="instagram-carousel";
const defaults=JSON.parse(root.dataset.defaults),runtimeValues=window.__hyperframes?.getVariables?.()??window.__hfVariablesByComp?.[id]??{},values={...defaults,...runtimeValues};
root.querySelectorAll("[data-ipw-variable]").forEach(function(el){el.textContent=String(values[el.dataset.ipwVariable]??"")});
function parts(value){return String(value??"").split(/[|,]/).map(function(item){return item.trim()}).filter(Boolean)}
function pair(value){const index=value.indexOf(":");return index<0?[value,""]:[value.slice(0,index).trim(),value.slice(index+1).trim()]}
root.querySelectorAll("[data-ipw-list]").forEach(function(host){
 const key=host.dataset.ipwList,mode=host.dataset.listMode||"plain",highlight=String(values[host.dataset.highlightKey]??""),active=host.dataset.activeKey?Math.max(1,Number(values[host.dataset.activeKey]??0)):0;
 parts(values[key]).slice(0,4).forEach(function(raw,index){
  const split=pair(raw),item=document.createElement("article");item.className="social-list-item sm-animate";
  if((highlight&&split[0]===highlight)||(active===index+1))item.classList.add("is-highlight");
  if(mode==="pair"||mode==="meter"){
   const label=document.createElement("div"),value=document.createElement("div");label.className="social-list-label";value.className="social-list-value";label.textContent=split[0];value.textContent=split[1];item.append(label,value);
   if(mode==="meter"){const meter=document.createElement("div"),fill=document.createElement("span");meter.className="social-meter";fill.style.width=Math.max(0,Math.min(100,Number.parseFloat(split[1])||0))+"%";meter.append(fill);item.append(meter)}
  }else{item.textContent=raw}
  host.append(item);
 });
});
const initial={};
if("slide-left"==="slide-left")Object.assign(initial,{x:-58,opacity:0});
else if("slide-left"==="slide-right")Object.assign(initial,{x:58,opacity:0});
else if("slide-left"==="scale")Object.assign(initial,{scale:.88,opacity:0});
else if("slide-left"==="clip")Object.assign(initial,{y:46,opacity:0,clipPath:"inset(0 0 100% 0)"});
else Object.assign(initial,{y:48,opacity:0});
const tl=gsap.timeline({paused:true});
tl.fromTo(root.querySelectorAll(".sm-animate"),initial,{x:0,y:0,scale:1,opacity:1,clipPath:"inset(0 0 0% 0)",duration:.62,stagger:.085,ease:"power3.out"},.08)
  .fromTo(root.querySelectorAll(".sm-pop"),{scale:.65,opacity:0},{scale:1,opacity:1,duration:.5,stagger:.08,ease:"back.out(1.5)"},.38)
  .fromTo(root.querySelectorAll(".sm-draw"),{scaleX:0,transformOrigin:"left center"},{scaleX:1,duration:.6,ease:"power2.out"},.22);
window.__timelines[id]=tl;tl.seek(0);
})();</script></body></html>
