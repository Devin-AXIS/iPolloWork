<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=1920, height=1080"/><title>光圈脉冲转场</title><style>*{box-sizing:border-box}html,body{width:1920px;height:1080px;margin:0;overflow:hidden;background:transparent}.fx{position:relative;width:100%;height:100%;overflow:hidden;background:transparent}.disc{position:absolute;left:50%;top:50%;width:150px;height:150px;border-radius:50%;transform:translate(-50%,-50%) scale(0);background:var(--ipw-color-primary,#20bbc0)}.ring{position:absolute;left:50%;top:50%;width:220px;height:220px;border:12px solid var(--ipw-color-accent,#7c3aed);border-radius:50%;transform:translate(-50%,-50%) scale(0);opacity:0}.spark{position:absolute;left:50%;top:50%;width:36px;height:36px;border-radius:50%;transform:translate(-50%,-50%) scale(0);background:var(--ipw-color-on-primary,#fff)}</style></head><body><main class="fx" data-composition-id="effect-transition-iris-pulse" data-width="1920" data-height="1080" data-start="0" data-duration="1.1"><div class="disc"></div><div class="ring"></div><div class="spark"></div></main><script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script><script>window.__timelines=window.__timelines||{};var tl=gsap.timeline({paused:true});tl.to('.disc',{scale:18,duration:.48,ease:'power4.in'},0).to('.ring',{scale:7,opacity:1,duration:.42,ease:'power3.in'},.06).to('.spark',{scale:5,duration:.18,ease:'power2.out'},.43).to('.spark',{scale:0,duration:.16,ease:'power2.in'},.61).to('.disc',{scale:0,duration:.42,ease:'power4.out'},.58).to('.ring',{scale:0,opacity:0,duration:.38,ease:'power3.out'},.62);window.__timelines['effect-transition-iris-pulse']=tl;window.addEventListener('hf-seek',e=>tl.seek(Math.max(0,Math.min(e.detail.time,1.1))));tl.seek(0);</script></body></html>
