<script data-ipw-motion-recipe="1">
(async function(){await document.fonts.ready;const root=document.getElementById("shotcraft-multiplane"),id=root.dataset.compositionId;const values={...{"title":"真实页面多层视差","mediaUrl":"assets/evidence.svg","captureLayout":"{\"width\":1920,\"height\":1080,\"pixelRatio\":1,\"regions\":[{\"id\":\"region-0\",\"x\":50,\"y\":300,\"width\":240,\"height\":240},{\"id\":\"region-1\",\"x\":330,\"y\":300,\"width\":240,\"height\":240},{\"id\":\"region-2\",\"x\":610,\"y\":300,\"width\":240,\"height\":240},{\"id\":\"region-3\",\"x\":890,\"y\":300,\"width\":240,\"height\":240},{\"id\":\"region-4\",\"x\":1170,\"y\":300,\"width\":240,\"height\":240},{\"id\":\"region-5\",\"x\":1450,\"y\":300,\"width\":240,\"height\":240}],\"heroId\":\"region-3\",\"foregroundIds\":[\"region-0\",\"region-5\"]}"},...(window.__hyperframes?.getVariables?.()??{}),...(window.__hfVariablesByComp?.[id]??{})};const recipe={"version":1,"pattern":"state-transformation","minHoldSeconds":0.7,"textLimits":{"title":{"maxLines":1,"maxLineLength":12}},"events":[{"id":"camera","target":".sc-layer","time":0.65,"duration":3.8333333333333335,"action":"展示真实页面、图像或空间层次，沿同一方向探索真实内容。"}],"usage":{"useWhen":["展示真实页面、图像或空间层次，沿同一方向探索真实内容。"],"avoidWhen":["不用于必须固定对照的公式、代码或精确数值；前景不可遮挡主阅读对象。"],"inputRules":{"title":"单行最多12字；不遮盖素材中的必要信息。","mediaUrl":"已有项目内真实页面截图；禁止用演示卡片或手绘假界面替代。","captureLayout":"JSON: width/height 是截图的 CSS 页面尺寸，pixelRatio 是像素倍率；regions 是6–8个实测 {id,x,y,width,height} 区域，heroId 与两个 foregroundIds 引用已有区域。图片像素尺寸必须一致。先核对裁切，过密或无适合主体时换配方，不猜坐标。"},"readingOrder":["建立真实页面和层次","展示真实页面、图像或空间层次，沿同一方向探索真实内容。","保留主体和最终可读画面"],"cueBindings":{"camera":"绑定开始探索/强调主体的实测旁白短语；内部时值比例和各层运动关系不变。"},"fallback":{"overflow":"拆镜或选择合适配方，不缩小文字。","missingInput":"先取得真实截图和实测区域；素材不可用则报告缺口。","timingMismatch":"绑定实测短语并整体重排；过长旁白拆镜，不让相机漫无目的持续移动。","inapplicable":"换合适的已验证配方；仅配方模式下禁止自绘替代。"},"example":{"values":{"title":"真实页面多层视差","mediaUrl":"assets/evidence.svg","captureLayout":"{\"width\":1920,\"height\":1080,\"pixelRatio\":1,\"regions\":[{\"id\":\"region-0\",\"x\":50,\"y\":300,\"width\":240,\"height\":240},{\"id\":\"region-1\",\"x\":330,\"y\":300,\"width\":240,\"height\":240},{\"id\":\"region-2\",\"x\":610,\"y\":300,\"width\":240,\"height\":240},{\"id\":\"region-3\",\"x\":890,\"y\":300,\"width\":240,\"height\":240},{\"id\":\"region-4\",\"x\":1170,\"y\":300,\"width\":240,\"height\":240},{\"id\":\"region-5\",\"x\":1450,\"y\":300,\"width\":240,\"height\":240}],\"heroId\":\"region-3\",\"foregroundIds\":[\"region-0\",\"region-5\"]}"},"narration":"展示真实页面、图像或空间层次，沿同一方向探索真实内容。"},"acceptance":["真实页面裁切与实测坐标一致，原图解码成功，高清主阅读层不模糊。","各层沿同一 drive 移动，系数保持0.35/0.7/1.4，中景无模糊。","保持原曲线和动效关系，正反向拖动恢复同一画面；这不是像素完全相同的Remotion渲染。"]}};
 const cues=JSON.parse(String(values.motionCueTimes??"{}"));
 root.querySelector("[data-ipw-variable=title]").textContent=String(values.title);

 const capture=JSON.parse(String(values.captureLayout));
 const source=new Image();source.src=String(values.mediaUrl);await source.decode();
 if(source.naturalWidth!==Math.round(capture.width*capture.pixelRatio)||source.naturalHeight!==Math.round(capture.height*capture.pixelRatio))throw Error('Screenshot dimensions differ from captureLayout');
 const layer=className=>{const element=document.createElement('div');element.className='sc-layer '+className;root.append(element);return element;};
 const page=(parent,width,top,opacity)=>{const image=source.cloneNode();Object.assign(image.style,{position:'absolute',left:'0px',top:Math.max(top,1080-capture.height*width/capture.width)+'px',width:width+'px',opacity:String(opacity)});parent.append(image);};
 const crop=(parent,region,width,x,y,className)=>{const scale=width/region.width,box=document.createElement('div');box.className='sc-crop '+className;box.dataset.captureRegion=region.id;Object.assign(box.style,{left:x+'px',top:y+'px',width:width+'px',height:region.height*scale+'px'});const image=source.cloneNode();Object.assign(image.style,{position:'absolute',width:capture.width*scale+'px',left:-region.x*scale+'px',top:-region.y*scale+'px'});box.append(image);parent.append(box);return box;};
 const region=id=>{const item=capture.regions.find(item=>item.id===id);if(!item)throw Error('Missing capture region '+id);return item;};
 const cubic=(x1,y1,x2,y2,t)=>{const coordinate=(a,b,p)=>3*(1-p)*(1-p)*p*a+3*(1-p)*p*p*b+p*p*p;let low=0,high=1;for(let i=0;i<24;i++){const p=(low+high)/2;if(coordinate(x1,x2,p)<t)low=p;else high=p;}return t<=0?0:t>=1?1:coordinate(y1,y2,(low+high)/2);};
 
 const background=layer('sc-background'),middle=layer('sc-middle'),foreground=layer('sc-foreground');
 background.style.cssText='opacity:.85;filter:blur(2px) saturate(.92)';foreground.style.filter='blur(3px)';page(background,2100,-300,1);
 capture.regions.slice(0,6).forEach((item,k)=>crop(middle,item,420,200+k*480,330+(k%2)*40,'sc-card'));
 crop(foreground,region(capture.foregroundIds[0]),700,900,150,'sc-front');crop(foreground,region(capture.foregroundIds[1]),380,2100,700,'sc-front');
 const apply=progress=>{const drive=progress*1000;background.style.transform='translateX('+(-drive*.35)+'px) scale(1.05)';middle.style.transform='translateX('+(-drive*.7)+'px)';foreground.style.transform='translateX('+(-drive*1.4)+'px)';root.dataset.ipwPageProgress=String(progress);};
 const ease=t=>cubic(.35,0,.25,1,t);
 
 const state={progress:0},event=recipe.events[0],tl=gsap.timeline({paused:true});apply(0);tl.fromTo(state,{progress:0},{progress:1,duration:event.duration,ease,onUpdate:()=>apply(state.progress)},cues.camera??event.time);tl.to({}, {duration:5.2},0);window.__timelines=window.__timelines||{};window.__timelines[id]=tl;tl.seek(0,false);})();
