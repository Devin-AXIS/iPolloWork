<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=1920, height=1080"/><title>主题色带转场</title><style>*{box-sizing:border-box}html,body{width:1920px;height:1080px;margin:0;overflow:hidden;background:transparent}.fx{position:relative;width:100%;height:100%;overflow:hidden;background:transparent}.band{position:absolute;left:-12%;width:124%;height:38%;transform:translateX(-115%) skewX(-10deg)}.a{top:-8%;background:var(--ipw-color-secondary,#0f766e)}.b{top:31%;background:var(--ipw-color-primary,#20bbc0)}.c{top:70%;background:var(--ipw-color-accent,#7c3aed)}.flash{position:absolute;inset:0;background:var(--ipw-color-bg,#fff);opacity:0}</style></head><body><main class="fx" data-composition-id="effect-transition-ribbon-wipe" data-width="1920" data-height="1080" data-start="0" data-duration="1"><div class="band a"></div><div class="band b"></div><div class="band c"></div><div class="flash"></div></main><script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script><script>window.__timelines=window.__timelines||{};var tl=gsap.timeline({paused:true});tl.to('.band',{xPercent:103,stagger:.045,duration:.36,ease:'power3.inOut'},0).to('.flash',{opacity:1,duration:.08,ease:'none'},.38).to('.flash',{opacity:0,duration:.08,ease:'none'},.49).to('.band',{xPercent:210,stagger:.045,duration:.36,ease:'power3.inOut'},.5);window.__timelines['effect-transition-ribbon-wipe']=tl;window.addEventListener('hf-seek',e=>tl.seek(Math.max(0,Math.min(e.detail.time,1))));tl.seek(0);</script></body></html>
