<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=1920, height=1080"/><title>Instagram 关注</title><style>
*{box-sizing:border-box}html,body{width:1920px;height:1080px;margin:0;overflow:hidden;background:transparent;font-family:var(--ipw-font-body,Inter,"PingFang SC",sans-serif)}.fx{position:relative;width:100%;height:100%;overflow:hidden;background:var(--ipw-color-bg,#fffaf7);color:var(--ipw-color-text,#18181b)}.cards{position:absolute;left:260px;top:210px;width:610px;height:650px}.photo{position:absolute;width:370px;height:470px;border:10px solid var(--ipw-color-surface,#fff);border-radius:var(--ipw-card-radius,28px);box-shadow:var(--ipw-card-shadow,0 30px 70px rgba(20,20,30,.16));background:linear-gradient(145deg,var(--ipw-color-primary,#20bbc0),var(--ipw-color-accent,#7c3aed))}.a{left:20px;top:60px;transform:rotate(-9deg)}.b{left:190px;top:100px;transform:rotate(8deg);background:linear-gradient(145deg,var(--ipw-color-secondary,#0f766e),var(--ipw-color-primary,#20bbc0))}.photo:after{content:"";position:absolute;inset:70px;border:2px solid color-mix(in srgb,var(--ipw-color-on-primary,#fff) 70%,transparent);border-radius:50%}.copy{position:absolute;left:1030px;top:300px;width:650px}.mark{width:90px;height:90px;display:grid;place-items:center;border:4px solid var(--ipw-color-primary,#20bbc0);border-radius:28px;font-size:42px;font-weight:900;color:var(--ipw-color-primary,#20bbc0)}h1{margin:36px 0 14px;font-size:72px;letter-spacing:-.055em}.copy p{margin:0;font-size:27px;color:var(--ipw-color-muted,#71717a)}.follow{margin-top:44px;width:260px;height:70px;border:0;border-radius:999px;background:var(--ipw-color-primary,#20bbc0);color:var(--ipw-color-on-primary,#fff);font-size:25px;font-weight:820}.footer{position:absolute;right:96px;bottom:74px;font-size:19px;letter-spacing:.16em;color:var(--ipw-color-muted,#71717a)}
</style></head><body><main class="fx" data-composition-id="effect-ending-instagram-follow" data-width="1920" data-height="1080" data-start="0" data-duration="3.3"><section class="cards"><div class="photo a"></div><div class="photo b"></div></section><section class="copy" data-hf-id="instagram-follow-copy"><div class="mark">◎</div><h1>@ipollowork</h1><p>Follow the process behind every frame.</p><button class="follow">Follow</button></section><div class="footer">INSTAGRAM · STAY IN THE LOOP</div></main><script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script><script>window.__timelines=window.__timelines||{};var tl=gsap.timeline({paused:true});tl.from('.photo.a',{x:-180,y:90,rotation:-28,opacity:0,duration:.78,ease:'power4.out'},0).from('.photo.b',{x:-120,y:-70,rotation:26,opacity:0,duration:.82,ease:'power4.out'},.15).from('.copy>*',{x:62,opacity:0,stagger:.11,duration:.55,ease:'power3.out'},.42).from('.footer',{opacity:0,duration:.45,ease:'none'},.8).to('.follow',{scale:1.08,duration:.2,ease:'power2.out'},1.45).to('.follow',{scale:1,duration:.32,ease:'back.out(2)'},1.65).to('.cards',{y:-18,duration:1.2,ease:'sine.inOut'},1.1);window.__timelines['effect-ending-instagram-follow']=tl;window.addEventListener('hf-seek',e=>tl.seek(Math.max(0,Math.min(e.detail.time,3.3))));tl.seek(0);</script></body></html>
