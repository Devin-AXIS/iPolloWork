<!-- lead-word-zoom-assemble -->
<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    [data-composition-id="LeadWordZoomAssemble"] {
      width: 1920px; height: 1080px; overflow: hidden;
      background: radial-gradient(52% 44% at 18% 22%, rgba(122,90,248,0.20) 0%, rgba(122,90,248,0) 70%),
        radial-gradient(46% 42% at 84% 18%, rgba(255,138,178,0.20) 0%, rgba(255,138,178,0) 70%),
        radial-gradient(58% 50% at 78% 84%, rgba(96,190,255,0.20) 0%, rgba(96,190,255,0) 70%),
        radial-gradient(50% 46% at 24% 88%, rgba(255,196,112,0.20) 0%, rgba(255,196,112,0) 70%),
        linear-gradient(180deg, #f7f6f9 0%, #f2f1f5 100%);
      font-family: -apple-system, "PingFang SC", BlinkMacSystemFont, sans-serif;
    }
  </style>
</head>
<body>
  <div data-composition-id="LeadWordZoomAssemble" data-start="0" data-duration="2.8" data-fps="30" data-width="1920" data-height="1080" id="comp"></div>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    window.__timelines = window.__timelines || {};
    const TEXT='Introducing Lumen Deck', HIGHLIGHT='Lumen', FONT_SIZE=96, INITIAL_SCALE=2.3, INTRO=6, HOLD=12, PUSH=1.06;
    const RECEDE=12, ASSEMBLE=24, WORD_DELAY=6, WORD_STAGGER=4, WORD_DUR=12, WORD_PUSH=0.5, WORD_FADE=2, LIFT=[34,50], LIFT_D=-56;
    const SUBLINE='One shot card, one motion recipe — copy, paste, render.', CRASH_F=12, CRASH_SCALE=0.2, CRASH_BLUR=9, TOTAL=84;
    const INK='#1d1d1f', INK_DIM='#7a7a7a', ACCENT='#7A5AF8';
    const leadRatio=0.14, lineWidth=960, baseline=FONT_SIZE*0.88, slideDistance=lineWidth*(0.5-leadRatio);
    const bez=(t,x1,y1,x2,y2)=>{const u=1-t;return 3*u*u*t*y1+3*u*t*t*y2+t*t*t;};
    const pushEase=t=>bez(t,0.25,1,0.5,1), zoomEase=t=>bez(t,0.5,0,0.05,1), wordEase=t=>bez(t,0.22,0.8,0.36,1);
    const clamp=(f,a,b,va,vb,e)=>{let t=(f-a)/(b-a);t=Math.max(0,Math.min(1,t));if(e==='push')t=pushEase(t);else if(e==='zoom')t=zoomEase(t);else if(e==='word')t=wordEase(t);else if(e==='outCubic')t=1-Math.pow(1-t,3);else if(e==='inQuad')t=t*t;return va+(vb-va)*t;};
    const comp=document.getElementById('comp'); const tl=gsap.timeline({paused:true}); const state={t:0};
    tl.to(state,{t:1,duration:TOTAL/30,ease:'none',onUpdate:()=>{
      const frame=Math.min(TOTAL-1,Math.round(state.t*(TOTAL-1))), words=TEXT.split(' ').filter(Boolean), zoomStart=HOLD;
      const scalePart=clamp(frame,0,HOLD,INITIAL_SCALE,INITIAL_SCALE*PUSH,'push')+clamp(frame,zoomStart,zoomStart+RECEDE,0,1-INITIAL_SCALE*PUSH,'zoom');
      const slide=clamp(frame,zoomStart,zoomStart+ASSEMBLE,slideDistance,0,'zoom');
      const lift=clamp(frame,LIFT[0],LIFT[1],0,1,'outCubic'), crash=clamp(frame,TOTAL-CRASH_F,TOTAL-1,0,1,'inQuad');
      const innerScale=1+crash*CRASH_SCALE, innerBlur=crash*CRASH_BLUR, innerOp=1-crash*0.55;
      const wordSpans=words.map((word,i)=>{const isLead=i===0,pushStart=zoomStart+WORD_DELAY+(i-1)*WORD_STAGGER;
        const op=isLead?clamp(frame,0,INTRO,0,1):clamp(frame,pushStart,pushStart+WORD_FADE,0,1);
        const tx=isLead?'':`${clamp(frame,pushStart,pushStart+WORD_DUR,WORD_PUSH*FONT_SIZE,0,'word')}px`;
        return `<span style="display:inline-block;opacity:${op};color:${word===HIGHLIGHT?ACCENT:INK};translate:${tx}">${word}</span>${i<words.length-1?' ':''}`;}).join('');
      comp.innerHTML=`<div style="transform:scale(${innerScale});filter:${innerBlur>0.01?`blur(${innerBlur}px)`:''};opacity:${innerOp}">
        <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transform:translateY(${lift*LIFT_D}px)">
          <span style="position:relative;display:inline-block;font-size:${FONT_SIZE}px;font-weight:600;color:${INK};letter-spacing:-0.03em;line-height:1.1;white-space:nowrap;transform-origin:${leadRatio*100}% ${baseline}px;scale:${scalePart};translate:${slide}px">${wordSpans}<span style="display:inline-block;width:0;height:0"></span></span></div>
        <div style="position:absolute;left:0;right:0;top:50%;margin-top:62px;text-align:center;font-size:32px;color:${INK_DIM};opacity:${lift};transform:translateY(${(1-lift)*16}px)">${SUBLINE}</div></div>`;
    }},0);
    window.__timelines['LeadWordZoomAssemble']=tl;
  </script>
</body>
</html>
