<!doctype html><html lang="en" data-composition-variables='[{"id":"title","label":"Title","type":"string","default":"A path from intent to impact","maxLength":72,"update":"live"},{"id":"stepOne","label":"Step one","type":"string","default":"Frame the decision","maxLength":40,"update":"live"},{"id":"stepTwo","label":"Step two","type":"string","default":"Build the artifact","maxLength":40,"update":"live"},{"id":"stepThree","label":"Step three","type":"string","default":"Review and move","maxLength":40,"update":"live"},{"id":"motionCueTimes","label":"Semantic cue times","type":"string","default":"{}","maxLength":2048,"update":"reload","description":"JSON event IDs to measured scene-relative seconds. Empty uses authored timings; this is not word alignment."}]'><head><meta charset="UTF-8"/><meta name="viewport" content="width=1920,height=1080"/><title>Milestone Timeline</title><style>*{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:transparent}#milestone-timeline{position:relative;width:1920px;height:1080px;padding:110px 140px;background:var(--ipw-color-bg,#f4f6f8);color:var(--ipw-color-text,#15171a);font-family:var(--ipw-font-display,Inter,sans-serif)}h1{margin:0;font-size:78px;letter-spacing:-.06em}.rail{position:absolute;left:210px;right:210px;top:612px;height:7px;background:color-mix(in srgb,var(--ipw-color-primary,#20bbc0) 24%,transparent)}.steps{position:absolute;left:190px;right:190px;top:430px;display:flex;justify-content:space-between}.step{width:400px}.dot{width:42px;height:42px;border:9px solid var(--ipw-color-surface,#fff);border-radius:50%;background:var(--ipw-color-primary,#20bbc0);box-shadow:0 0 0 7px color-mix(in srgb,var(--ipw-color-primary,#20bbc0) 20%,transparent)}.step b{display:block;margin-top:38px;font-size:37px;line-height:1.05;letter-spacing:-.04em}.step span{display:block;margin-top:17px;color:var(--ipw-color-muted,#68717c);font:700 17px/1 var(--ipw-font-body,Inter,sans-serif);letter-spacing:.12em;text-transform:uppercase}.step b{line-height:1.4}.rail{top:448px}</style></head><body><main id="milestone-timeline" data-composition-id="milestone-timeline" data-width="1920" data-height="1080" data-start="0" data-duration="9"><h1 data-ipw-variable="title"></h1><div class="rail"></div><section class="steps"><article class="step"><div class="dot"></div><b data-ipw-variable="stepOne"></b><span>01 · Define</span></article><article class="step"><div class="dot"></div><b data-ipw-variable="stepTwo"></b><span>02 · Create</span></article><article class="step"><div class="dot"></div><b data-ipw-variable="stepThree"></b><span>03 · Decide</span></article></section></main><script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script><script>window.__timelines=window.__timelines||{};const r=document.getElementById("milestone-timeline"),v={title:"A path from intent to impact",stepOne:"Frame the decision",stepTwo:"Build the artifact",stepThree:"Review and move",...(window.__hyperframes?.getVariables?.()??{})};r.querySelectorAll("[data-ipw-variable]").forEach(e=>e.textContent=v[e.dataset.ipwVariable]??"");</script>
<script data-ipw-motion-recipe="1">
(function(){
const root=document.querySelector("[data-composition-id]"),id=root.dataset.compositionId;
const values=window.__hyperframes?.getVariables?.()??window.__hfVariablesByComp?.[id]??{};
const recipe={"version":1,"pattern":"path-journey","minHoldSeconds":0.7,"events":[{"id":"step-1","target":".step:nth-child(1)","time":1.2,"duration":0.5,"action":"Reveal and focus the next semantic item"},{"id":"step-2","target":".step:nth-child(2)","time":3.85,"duration":0.5,"action":"Reveal and focus the next semantic item"},{"id":"step-3","target":".step:nth-child(3)","time":6.5,"duration":0.5,"action":"Reveal and focus the next semantic item"},{"id":"resolve","target":".step","time":7.6,"duration":0.55,"action":"Restore the complete readable result"}]};
const times=JSON.parse(String(values.motionCueTimes??"{}"));
const cue=event=>times[event.id]??event.time;
window.__timelines[id]?.kill();
const tl=gsap.timeline({paused:true});
tl.set(root.querySelectorAll("*"),{clearProps:"transform,opacity,clipPath"},0);
const items=[...root.querySelectorAll(".step")];
tl.fromTo(root.querySelectorAll("h1,.rail"),{y:24,opacity:0},{y:0,opacity:1,duration:.65,ease:"power3.out"},0);
tl.set(items,{opacity:.18,y:18},0);
items.forEach((item,index)=>{
  const event=recipe.events[index]; if(!event||event.id==="resolve")return;
  const time=cue(event);
  tl.to(item,{opacity:1,y:0,duration:event.duration,ease:"power3.out"},time);
  tl.fromTo(item.querySelector(".dot"),{scale:.65},{scale:1,duration:.5,ease:"back.out(1.3)"},time);
  if(index>0)tl.to(items[index-1],{opacity:.58,duration:.25,ease:"power2.out"},time);
});
const resolved=recipe.events.at(-1);
tl.to(items,{opacity:1,y:0,x:0,duration:resolved.duration,ease:"power2.out"},cue(resolved));

tl.set(root,{visibility:"visible"},9);
window.__timelines[id]=tl;tl.seek(0);
})();
</script>
</body></html>
