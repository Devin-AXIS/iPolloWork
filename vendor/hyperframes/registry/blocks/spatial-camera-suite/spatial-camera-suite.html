<!doctype html>
<html lang="en" data-composition-variables='[{"id":"title","label":"Scene title","type":"string","default":"A clearer view, from every angle.","maxLength":72},{"id":"shotStyle","label":"Spatial shot recipe","type":"enum","default":"depth-layer-moves","options":[{"value":"graze-face-tour","label":"Graze Face Tour · 贴面掠游"},{"value":"depth-layer-moves","label":"Depth Layer Moves · 景深层移"},{"value":"spotlight-hero-card","label":"Spotlight Hero Card · 聚光主卡"},{"value":"runway-ground-skim","label":"Runway Ground Skim · 跑道低掠"},{"value":"steep-tilt-glide","label":"Steep Tilt Glide · 大倾角滑行"}]},{"id":"imageUrl","label":"Optional hero image URL","type":"string","default":"","maxLength":2000},{"id":"items","label":"Cards (label::detail | ...)","type":"string","default":"*Signal::See the pattern|Decision::Choose the next move|Action::Move with confidence","maxLength":300}]'>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920,height=1080" />
  <title>Spatial Camera Suite</title>
  <style>
    *{box-sizing:border-box}[hidden]{display:none!important}html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:transparent}
    #spatial-camera-suite{--bg:var(--ipw-color-bg,#f4f6f8);--ink:var(--ipw-color-text,#172126);--muted:var(--ipw-color-muted,#647078);--primary:var(--ipw-color-primary,#20bbc0);--accent:var(--ipw-color-accent,#fd684c);--surface:var(--ipw-color-surface,#fff);--border:var(--ipw-color-border,#d7dde1);position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--ipw-font-body,Inter,sans-serif);isolation:isolate}
    .sc-glow{position:absolute;inset:-10%;pointer-events:none;background:radial-gradient(ellipse at 50% 48%,color-mix(in srgb,var(--primary) 16%,transparent),transparent 54%)}
    .sc-grid{position:absolute;inset:140px -120px -100px;background-image:linear-gradient(color-mix(in srgb,var(--border) 42%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--border) 42%,transparent) 1px,transparent 1px);background-size:76px 76px;opacity:.32;mask-image:radial-gradient(ellipse at 50% 50%,#000 12%,transparent 73%)}
    .sc-header{position:absolute;z-index:10;left:140px;right:140px;top:70px;display:flex;align-items:end;justify-content:space-between;gap:60px}.sc-copy{max-width:1200px}.sc-eyebrow{font-size:15px;letter-spacing:.2em;text-transform:uppercase;color:var(--primary);font-weight:700}.sc-header h1{margin:17px 0 0;font:650 58px/1.08 var(--ipw-font-display,Inter,sans-serif);letter-spacing:-.05em}.sc-signature{min-width:240px;padding:15px 18px;border:1px solid var(--border);border-radius:999px;color:var(--muted);font-size:14px;letter-spacing:.08em;text-align:center;background:color-mix(in srgb,var(--surface) 78%,transparent)}
    .sc-stage{position:absolute;left:90px;top:230px;width:1740px;height:700px;perspective:1500px;perspective-origin:50% 48%;transform-style:preserve-3d}.sc-camera{position:absolute;inset:0;transform-style:preserve-3d;transform-origin:50% 50%;will-change:transform}.sc-floor{position:absolute;left:70px;right:70px;top:540px;height:420px;transform:translateZ(-600px) rotateX(78deg);transform-origin:center top;border-radius:45px;background:linear-gradient(180deg,color-mix(in srgb,var(--primary) 10%,var(--surface)),transparent 72%);border:1px solid color-mix(in srgb,var(--primary) 22%,var(--border));box-shadow:0 40px 100px color-mix(in srgb,var(--ink) 18%,transparent)}.sc-floor::after{content:"";position:absolute;inset:0;border-radius:inherit;background:repeating-linear-gradient(90deg,transparent 0 118px,color-mix(in srgb,var(--border) 45%,transparent) 119px 121px),repeating-linear-gradient(0deg,transparent 0 88px,color-mix(in srgb,var(--border) 45%,transparent) 89px 91px);mask-image:linear-gradient(180deg,#000,transparent 80%)}
    .sc-world{position:absolute;inset:10px 0 0;transform-style:preserve-3d}.sc-backplane{position:absolute;left:170px;top:70px;width:1400px;height:470px;border-radius:36px;background:linear-gradient(135deg,color-mix(in srgb,var(--surface) 92%,transparent),color-mix(in srgb,var(--primary) 9%,var(--surface)));border:1px solid var(--border);box-shadow:0 40px 110px color-mix(in srgb,var(--ink) 15%,transparent);transform:translateZ(-95px)}
    .sc-backplane::before{content:"";position:absolute;inset:25px;border-radius:26px;background-image:linear-gradient(color-mix(in srgb,var(--border) 40%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--border) 40%,transparent) 1px,transparent 1px);background-size:52px 52px;opacity:.42}
    .sc-page{position:absolute;left:220px;top:104px;width:1300px;height:458px;border:1px solid color-mix(in srgb,var(--border) 88%,transparent);border-radius:30px;background:var(--surface);box-shadow:0 34px 78px color-mix(in srgb,var(--ink) 18%,transparent);transform:translateZ(0);transform-style:preserve-3d}.sc-toolbar{height:54px;padding:0 27px;display:flex;align-items:center;gap:9px;border-bottom:1px solid var(--border);background:color-mix(in srgb,var(--surface) 95%,var(--bg))}.sc-toolbar i{width:9px;height:9px;border-radius:50%;background:var(--border)}.sc-toolbar span{margin-left:auto;font-size:13px;letter-spacing:.1em;color:var(--muted)}.sc-page-body{position:relative;height:calc(100% - 54px);padding:32px 40px}.sc-page-title{font-size:26px;font-weight:650;letter-spacing:-.035em}.sc-page-subtitle{margin-top:8px;font-size:14px;color:var(--muted)}.sc-rail{position:absolute;left:40px;right:40px;top:148px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;transform-style:preserve-3d}
    .sc-card{position:relative;min-height:235px;padding:22px 22px 19px;border:1px solid var(--border);border-radius:22px;background:linear-gradient(150deg,var(--surface),color-mix(in srgb,var(--primary) 5%,var(--surface)));box-shadow:0 17px 35px color-mix(in srgb,var(--ink) 10%,transparent);transform-style:preserve-3d;overflow:hidden}.sc-card::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(130deg,color-mix(in srgb,var(--primary) 8%,transparent),transparent 48%)}.sc-card.is-featured{border-color:color-mix(in srgb,var(--primary) 60%,var(--border));box-shadow:0 24px 50px color-mix(in srgb,var(--primary) 15%,transparent)}.sc-card-index{font-size:11px;letter-spacing:.18em;color:var(--primary);font-weight:750}.sc-card h2{position:relative;z-index:1;margin:22px 0 11px;font-size:25px;letter-spacing:-.04em;font-weight:630}.sc-card p{position:relative;z-index:1;margin:0;max-width:300px;color:var(--muted);font-size:15px;line-height:1.5}.sc-card-art{position:absolute;right:18px;bottom:15px;width:92px;height:75px;border-radius:17px;background:color-mix(in srgb,var(--primary) 12%,var(--surface));overflow:hidden}.sc-card-art::before{content:"";position:absolute;left:15px;right:15px;bottom:12px;height:34px;border-radius:9px 9px 4px 4px;background:linear-gradient(140deg,var(--primary),color-mix(in srgb,var(--primary) 18%,var(--surface)));clip-path:polygon(0 100%,0 48%,27% 10%,53% 56%,73% 25%,100% 60%,100% 100%)}.sc-card-image{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.sc-card-ghost{position:absolute;inset:22px;border:1px solid var(--primary);border-radius:23px;opacity:0;pointer-events:none;transform:translate3d(9px,8px,-14px)}.sc-card-outline{position:absolute;inset:9px;border:1px solid var(--accent);border-radius:26px;opacity:0;pointer-events:none;transform:scale(1.04)}
    .sc-float-tag{position:absolute;z-index:3;padding:11px 15px;border-radius:999px;border:1px solid color-mix(in srgb,var(--primary) 32%,var(--border));background:color-mix(in srgb,var(--surface) 88%,transparent);box-shadow:0 15px 32px color-mix(in srgb,var(--ink) 12%,transparent);color:var(--ink);font-size:13px;letter-spacing:.06em;transform:translateZ(85px)}.sc-float-tag.a{left:265px;top:52px}.sc-float-tag.b{right:255px;top:70px}.sc-float-tag.c{right:330px;bottom:36px}.sc-light{position:absolute;inset:0;z-index:5;pointer-events:none;opacity:0;background:radial-gradient(circle at 32% 51%,transparent 0 125px,color-mix(in srgb,var(--bg) 68%,transparent) 260px);mask-image:radial-gradient(ellipse at center,#000 42%,transparent 72%)}.sc-runway{position:absolute;left:120px;right:120px;top:530px;height:290px;transform:translateZ(-480px) rotateX(80deg);transform-origin:center top;border-top:2px solid color-mix(in srgb,var(--primary) 70%,transparent);background:repeating-linear-gradient(90deg,transparent 0 135px,color-mix(in srgb,var(--primary) 28%,transparent) 136px 140px);opacity:.65}.sc-footer{position:absolute;z-index:10;left:140px;right:140px;bottom:54px;display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:13px;letter-spacing:.1em;text-transform:uppercase}.sc-footer i{display:block;width:140px;height:2px;background:var(--border);position:relative;overflow:hidden}.sc-footer i b{position:absolute;inset:0;background:var(--primary);transform-origin:left;transform:scaleX(.12)}
    #spatial-camera-suite[data-shot-style="graze-face-tour"] .sc-stage{perspective:1280px}#spatial-camera-suite[data-shot-style="graze-face-tour"] .sc-backplane{transform:translateZ(-150px) rotateX(3deg)}#spatial-camera-suite[data-shot-style="graze-face-tour"] .sc-float-tag{transform:translateZ(145px)}
    #spatial-camera-suite[data-shot-style="depth-layer-moves"] .sc-backplane{transform:translateZ(-200px) scale(1.08)}#spatial-camera-suite[data-shot-style="depth-layer-moves"] .sc-card{transform:translateZ(45px)}#spatial-camera-suite[data-shot-style="depth-layer-moves"] .sc-card:nth-child(2){transform:translateZ(92px)}#spatial-camera-suite[data-shot-style="depth-layer-moves"] .sc-card:nth-child(3){transform:translateZ(15px)}
    #spatial-camera-suite[data-shot-style="spotlight-hero-card"] .sc-light{opacity:.92}#spatial-camera-suite[data-shot-style="spotlight-hero-card"] .sc-float-tag{opacity:.55}
    #spatial-camera-suite[data-shot-style="runway-ground-skim"] .sc-stage{perspective:1100px}#spatial-camera-suite[data-shot-style="runway-ground-skim"] .sc-runway{opacity:1}#spatial-camera-suite[data-shot-style="runway-ground-skim"] .sc-card{transform:translateZ(-80px) rotateX(8deg)}
    #spatial-camera-suite[data-shot-style="steep-tilt-glide"] .sc-stage{perspective:1050px}#spatial-camera-suite[data-shot-style="steep-tilt-glide"] .sc-card h2,#spatial-camera-suite[data-shot-style="steep-tilt-glide"] .sc-card p{transform:translateZ(24px)}
  </style>
</head>
<body>
  <main id="spatial-camera-suite" data-composition-id="spatial-camera-suite" data-width="1920" data-height="1080" data-start="0" data-duration="9">
    <div class="sc-glow"></div><div class="sc-grid"></div>
    <header class="sc-header"><div class="sc-copy"><div class="sc-eyebrow">SPATIAL CAMERA / MOTION STUDY</div><h1 data-ipw-variable="title" data-ipw-ai-slot="title"></h1></div><div class="sc-signature">CAMERA · DEPTH · FOCUS</div></header>
    <section class="sc-stage" data-motion-role="viewport"><div class="sc-camera" data-motion-role="camera" data-layout-allow-overflow data-layout-allow-occlusion>
      <div class="sc-world" data-motion-role="world"><div class="sc-floor"></div><div class="sc-backplane" data-motion-role="depth-plane"></div><div class="sc-page" data-motion-role="depth-plane">
        <div class="sc-toolbar"><i></i><i></i><i></i><span>LIVE WORKSPACE / OVERVIEW</span></div>
        <div class="sc-page-body"><div class="sc-page-title">A system in motion</div><div class="sc-page-subtitle">One shared interface · distinct layers · meaningful focus</div><div class="sc-rail" data-ipw-ai-slot="items"></div></div>
      </div>
      <span class="sc-float-tag a">01 / ORIENT</span><span class="sc-float-tag b">02 / EXPLORE</span><span class="sc-float-tag c">03 / LAND</span><div class="sc-runway"></div><div class="sc-light"></div>
    </div></section>
    <footer class="sc-footer"><span data-ipw-variable="shotStyle" data-ipw-ai-slot="shotStyle"></span><i><b></b></i><span>ONE CAMERA · ONE SEEKABLE TIMELINE</span></footer>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <script>
    window.__timelines=window.__timelines||{};
    (function(){
      const root=document.getElementById("spatial-camera-suite"),id=root.dataset.compositionId;
      const defaults={title:"A clearer view, from every angle.",shotStyle:"depth-layer-moves",imageUrl:"",items:"*Signal::See the pattern|Decision::Choose the next move|Action::Move with confidence"};
      const values={...defaults,...(window.__hyperframes?.getVariables?.()??{}),...(window.__hfVariablesByComp?.[id]??{})};
      const styleIds=["graze-face-tour","depth-layer-moves","spotlight-hero-card","runway-ground-skim","steep-tilt-glide"];
      const shotStyle=styleIds.includes(String(values.shotStyle))?String(values.shotStyle):defaults.shotStyle;
      root.dataset.shotStyle=shotStyle;
      root.querySelectorAll("[data-ipw-variable]").forEach(function(element){element.textContent=String(values[element.dataset.ipwVariable]??"")});
      const shotLabels={"graze-face-tour":"GRAZE / FACE TOUR","depth-layer-moves":"DEPTH / LAYER MOVES","spotlight-hero-card":"SPOTLIGHT / HERO CARD","runway-ground-skim":"RUNWAY / GROUND SKIM","steep-tilt-glide":"STEEP TILT / GLIDE"};
      root.querySelector('[data-ipw-variable="shotStyle"]').textContent=shotLabels[shotStyle];
      function safeText(value){return String(value??"").trim()}
      const imageUrl=safeText(values.imageUrl),cards=safeText(values.items).split("|").map(function(item){
        const separator=item.indexOf("::"),rawLabel=(separator<0?item:item.slice(0,separator)).trim(),detail=(separator<0?"":item.slice(separator+2)).trim(),featured=rawLabel.startsWith("*");
        return{label:(featured?rawLabel.slice(1):rawLabel)||"Focus",detail:detail||"A clear next step",featured};
      }).filter(function(item){return item.label}).slice(0,3);
      if(cards.length===0)cards.push({label:"Focus",detail:"A clear next step",featured:true});
      let featuredFound=false;
      cards.forEach(function(card){if(card.featured&&featuredFound)card.featured=false;else if(card.featured)featuredFound=true});
      if(!featuredFound)cards[0].featured=true;
      const rail=root.querySelector(".sc-rail");
      cards.forEach(function(card,index){
        const element=document.createElement("article");element.className="sc-card"+(card.featured?" is-featured":"");element.dataset.depth=String(index+1);element.dataset.featured=String(card.featured);
        const outline=document.createElement("i");outline.className="sc-card-outline";element.append(outline);
        const ghost=document.createElement("i");ghost.className="sc-card-ghost";element.append(ghost);
        const number=document.createElement("div");number.className="sc-card-index";number.textContent="LAYER / 0"+(index+1);element.append(number);
        const heading=document.createElement("h2");heading.textContent=card.label;element.append(heading);
        const copy=document.createElement("p");copy.textContent=card.detail;element.append(copy);
        const art=document.createElement("div");art.className="sc-card-art";
        if(imageUrl&&card.featured){const image=document.createElement("img");image.className="sc-card-image";image.src=imageUrl;image.alt=card.label;art.append(image)}
        element.append(art);rail.append(element);
      });
      const camera=root.querySelector(".sc-camera"),backplane=root.querySelector(".sc-backplane"),stageCards=[...root.querySelectorAll(".sc-card")],featured=stageCards.find(function(card){return card.dataset.featured==="true"})||stageCards[0],tags=[...root.querySelectorAll(".sc-float-tag")],light=root.querySelector(".sc-light"),tl=gsap.timeline({paused:true});
      const focusIndex=stageCards.indexOf(featured),focusX=Math.round((220+40+(focusIndex*414)+196)/1740*100),focusCameraX=Math.max(-250,Math.min(250,(1-focusIndex)*414));
      light.style.background="radial-gradient(circle at "+focusX+"% 51%, transparent 0 125px, color-mix(in srgb, var(--bg) 68%, transparent) 260px)";
      tl.fromTo(root.querySelector(".sc-header"),{y:24,opacity:0},{y:0,opacity:1,duration:.65,ease:"power2.out"},0)
        .fromTo(root.querySelector(".sc-footer"),{y:12,opacity:0},{y:0,opacity:1,duration:.5,ease:"power2.out"},.25)
        .fromTo(root.querySelector(".sc-grid"),{opacity:0},{opacity:.32,duration:.8,ease:"power1.out"},0);
      if(shotStyle==="graze-face-tour"){
        tl.fromTo(camera,{x:-155,y:180,scale:1.22,rotationX:55,rotationZ:-4},{x:120,y:72,scale:1.04,rotationX:34,rotationZ:0,duration:3.35,ease:"power2.inOut"},.48)
          .fromTo(tags,{y:35,opacity:0},{y:0,opacity:1,duration:.7,stagger:.2,ease:"power3.out"},1.4)
          .to(camera,{x:0,y:0,scale:1,rotationX:10,duration:1.05,ease:"power3.out"},5.25);
      }else if(shotStyle==="depth-layer-moves"){
        tl.fromTo(camera,{scale:.9,x:0,y:20,rotationY:-5},{scale:1.12,x:0,y:-2,rotationY:1,duration:2.25,ease:"power3.inOut"},.48)
          .to(backplane,{scale:1.28,x:-52,y:22,duration:2.2,ease:"power2.inOut"},.55)
          .to(stageCards,{x:function(index){return(index-1)*-24},z:function(index){return index===0?105:index===1?34:-55},duration:1.15,stagger:.12,ease:"power2.inOut"},1.15)
          .to(camera,{x:focusCameraX,scale:1.1,rotationY:0,duration:1.1,ease:"power3.inOut"},3.05)
          .to(featured,{x:0,z:138,scale:1.07,duration:1.1,ease:"power3.inOut"},3.05)
          .to(camera,{scale:1.02,x:0,rotationY:0,duration:1.05,ease:"power2.out"},5.6);
      }else if(shotStyle==="spotlight-hero-card"){
        tl.fromTo(camera,{x:-100,y:22,scale:.96,rotationZ:-2},{x:0,y:0,scale:1.05,rotationZ:0,duration:2.5,ease:"power3.inOut"},.48)
          .fromTo(light,{opacity:0},{opacity:.92,duration:.75,ease:"power2.out"},1.15)
          .to(featured,{y:-26,z:115,scale:1.09,duration:.8,ease:"power3.out"},1.35)
          .fromTo(featured.querySelector(".sc-card-outline"),{opacity:0,scale:1.06},{opacity:.85,scale:1.16,duration:.42,ease:"power2.out"},1.7)
          .to(featured.querySelector(".sc-card-outline"),{opacity:0,scale:1.24,duration:.34,ease:"power1.out"},2.12)
          .fromTo(featured.querySelector(".sc-card-ghost"),{opacity:0,scale:1.01},{opacity:.75,scale:1.08,duration:.42,ease:"power2.out"},2.36)
          .to(featured.querySelector(".sc-card-ghost"),{opacity:0,scale:1.16,duration:.36,ease:"power1.out"},2.78)
          .to(camera,{x:46,y:-12,rotationZ:2,duration:1.2,ease:"power2.inOut"},3.1)
          .to([camera,featured,light],{x:0,y:0,rotationZ:0,scale:1,opacity:1,duration:.95,ease:"power2.out"},5.35)
          .to(light,{opacity:.35,duration:.55,ease:"power1.out"},5.35);
      }else if(shotStyle==="runway-ground-skim"){
        tl.fromTo(camera,{y:140,scale:1.05,rotationX:66},{y:28,scale:1,rotationX:35,duration:1.25,ease:"power2.inOut"},.35)
          .fromTo(root.querySelector(".sc-runway"),{opacity:0,scaleY:.7},{opacity:.8,scaleY:1,duration:.6,ease:"power2.out"},.55)
          .fromTo(stageCards,{y:310,z:-250,rotationX:18,opacity:0},{y:0,z:function(index){return 26-index*22},rotationX:0,opacity:1,duration:1.05,stagger:.25,ease:"power3.in"},1.05)
          .to(camera,{rotationX:6,y:-18,duration:1.3,ease:"power3.out"},4.65)
          .to(root.querySelector(".sc-runway"),{opacity:.24,duration:.7,ease:"power1.out"},5.1);
      }else if(shotStyle==="steep-tilt-glide"){
        tl.fromTo(camera,{x:-180,y:84,scale:1.12,rotationX:62,rotationY:-6},{x:180,y:12,scale:1.04,rotationX:53,rotationY:3,duration:3.05,ease:"power2.inOut"},.38)
          .fromTo(stageCards.map(function(card){return card.querySelector("h2")}),{y:-25,opacity:.58},{y:0,opacity:1,duration:.72,stagger:.18,ease:"power3.out"},1.85)
          .fromTo(stageCards.map(function(card){return card.querySelector("p")}),{y:18,opacity:0},{y:0,opacity:1,duration:.7,stagger:.15,ease:"power2.out"},2.25)
          .fromTo(stageCards.map(function(card){return card.querySelector(".sc-card-ghost")}),{x:-34,y:-14,opacity:0},{x:-8,y:-6,opacity:.26,duration:.28,stagger:.04,ease:"power1.out"},.9)
          .to(stageCards.map(function(card){return card.querySelector(".sc-card-ghost")}),{opacity:0,duration:.45,ease:"power1.out"},4.3)
          .to(camera,{x:0,y:0,scale:1,rotationX:24,rotationY:0,duration:1.15,ease:"power3.out"},5.15);
      }else{throw new Error("Unsupported spatial shot recipe: "+shotStyle)}
      tl.fromTo(root.querySelector(".sc-footer i b"),{scaleX:.12},{scaleX:1,duration:9,ease:"none"},0);
      window.__timelines[id]=tl;tl.seek(0);
    })();
  </script>
</body>
</html>
