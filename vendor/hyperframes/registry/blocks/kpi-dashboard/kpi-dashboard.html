<head><meta charset="UTF-8"/><meta name="viewport" content="width=1920,height=1080"/><title>KPI Dashboard</title><style>
*{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:transparent}#kpi-dashboard{position:relative;width:1920px;height:1080px;padding:104px 140px;overflow:hidden;background:var(--ipw-color-bg,#f4f6f8);color:var(--ipw-color-text,#15171a);font-family:var(--ipw-font-display,Inter,sans-serif)}.kd-header{display:flex;justify-content:space-between;align-items:end}.kd-kicker{color:var(--ipw-color-primary,#20bbc0);font:760 16px/1 var(--ipw-font-body,Inter,sans-serif);letter-spacing:.18em}.kd-title{width:1120px;margin:24px 0 0;font-size:72px;line-height:.96;letter-spacing:-.06em}.kd-note{width:360px;color:var(--ipw-color-muted,#68717c);font:600 18px/1.35 var(--ipw-font-body,Inter,sans-serif);text-align:right}.kd-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:70px}.kd-card{position:relative;min-height:520px;padding:40px 34px;overflow:hidden;border:1px solid var(--ipw-color-border,#d8dde3);border-radius:var(--ipw-card-radius,30px);background:var(--ipw-card-bg,var(--ipw-color-surface,#fff));box-shadow:var(--ipw-card-shadow,0 20px 52px rgba(20,30,40,.09));will-change:transform}.kd-card.is-highlight{border-color:var(--ipw-color-primary,#20bbc0);background:color-mix(in srgb,var(--ipw-color-primary,#20bbc0) 9%,var(--ipw-color-surface,#fff))}.kd-index{color:var(--ipw-color-muted,#68717c);font:740 14px/1 var(--ipw-font-body,Inter,sans-serif);letter-spacing:.13em}.kd-label{margin-top:74px;color:var(--ipw-color-muted,#68717c);font:650 19px/1 var(--ipw-font-body,Inter,sans-serif)}.kd-value{margin-top:20px;font-size:88px;font-weight:800;line-height:.9;letter-spacing:-.07em}.kd-value span{color:var(--ipw-color-primary,#20bbc0);font-size:32px}.kd-track{position:absolute;left:34px;right:34px;bottom:48px;height:164px;display:flex;align-items:end;gap:12px}.kd-bar{flex:1;border-radius:8px 8px 3px 3px;background:color-mix(in srgb,var(--ipw-color-primary,#20bbc0) 34%,var(--ipw-color-border,#d8dde3));transform-origin:bottom}.kd-bar:last-child{background:var(--ipw-color-primary,#20bbc0)}

window.__timelines=window.__timelines||{};(function(){const root=document.getElementById("kpi-dashboard"),id=root.dataset.compositionId,values={title:"The operating picture at a glance",metrics:"Activation:78,Retention:64,Velocity:91,Quality:86",highlight:"Velocity",note:"Current period versus operating target",...(window.__hyperframes?.getVariables?.()??window.__hfVariablesByComp?.[id]??{})};root.querySelectorAll("[data-ipw-variable]").forEach(el=>{el.textContent=String(values[el.dataset.ipwVariable]??"")});const rows=String(values.metrics).split(/[,|]/).map(part=>{const split=part.lastIndexOf(":");return split>0?{label:part.slice(0,split).trim(),value:Math.max(0,Math.min(100,Number(part.slice(split+1).trim())))}:null}).filter(row=>row&&Number.isFinite(row.value)).slice(0,4),grid=root.querySelector(".kd-grid");rows.forEach((row,index)=>{const card=document.createElement("article");card.className="kd-card"+(row.label===String(values.highlight)?" is-highlight":"");card.innerHTML=`<div class="kd-index">METRIC / 0${index+1}</div><div class="kd-label"></div><div class="kd-value"><b></b><span>%</span></div><div class="kd-track"></div>`;card.querySelector(".kd-label").textContent=row.label;card.querySelector(".kd-value b").textContent=String(Math.round(row.value));const track=card.querySelector(".kd-track");[.52,.68,.81,1].forEach((factor,barIndex)=>{const bar=document.createElement("i");bar.className="kd-bar";bar.style.height=`${Math.max(8,row.value*factor)}%`;bar.dataset.delay=String(barIndex);track.append(bar)});grid.append(card)});const tl=gsap.timeline({paused:true});tl.fromTo(root.querySelectorAll(".kd-header>*"),{y:34,opacity:0},{y:0,opacity:1,duration:.52,stagger:.1,ease:"power3.out"},.08).fromTo(root.querySelectorAll(".kd-card"),{y:40,scale:.96,opacity:0},{y:0,scale:1,opacity:1,duration:.52,stagger:.09,ease:"power3.out"},.34).fromTo(root.querySelectorAll(".kd-bar"),{scaleY:0},{scaleY:1,duration:.66,stagger:.025,ease:"power3.out"},.6);window.__timelines[id]=tl;tl.seek(0)})();
