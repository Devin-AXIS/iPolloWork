window.__timelines=window.__timelines||{};(function(){const root=document.getElementById("comparison-matrix"),id=root.dataset.compositionId,values={title:"Choose for the work ahead",options:"Managed flow|Manual flow",rows:"Setup|Guided|Manual;Handoffs|Visible|Scattered;Review|In context|Separate;Scale|Repeatable|Fragile",winner:"left",...(window.__hyperframes?.getVariables?.()??window.__hfVariablesByComp?.[id]??{})};root.querySelectorAll("[data-ipw-variable]").forEach(el=>{el.textContent=String(values[el.dataset.ipwVariable]??"")});const options=String(values.options).split("|").map(v=>v.trim()),rows=String(values.rows).split(";").map(row=>row.split("|").map(v=>v.trim())).filter(row=>row.length>=3).slice(0,6),winner=values.winner==="left"?1:values.winner==="right"?2:-1,table=root.querySelector(".cm-table");const head=document.createElement("div");head.className="cm-row cm-head";["CRITERIA",options[0]||"Option A",options[1]||"Option B"].forEach((text,index)=>{const cell=document.createElement("div");cell.className="cm-cell"+(index===winner?" is-winner":"");cell.textContent=text;head.append(cell)});table.append(head);rows.forEach(row=>{const line=document.createElement("div");line.className="cm-row";row.slice(0,3).forEach((text,index)=>{const cell=document.createElement("div");cell.className="cm-cell"+(index===winner?" is-winner":"");if(index===winner){const dot=document.createElement("i");dot.className="cm-dot";cell.append(dot)}cell.append(document.createTextNode(text));line.append(cell)});table.append(line)});const tl=gsap.timeline({paused:true});tl.fromTo(root.querySelectorAll(".cm-kicker,.cm-title"),{y:38,opacity:0},{y:0,opacity:1,duration:.54,stagger:.1,ease:"power4.out"},.08).fromTo(table,{scale:.96,y:30,opacity:0},{scale:1,y:0,opacity:1,duration:.65,ease:"power3.out"},.32).fromTo(root.querySelectorAll(".cm-row"),{x:-28,opacity:0},{x:0,opacity:1,duration:.42,stagger:.08,ease:"power3.out"},.48).fromTo(root.querySelectorAll(".cm-dot"),{scale:0},{scale:1,duration:.35,stagger:.06,ease:"power3.out"},.9);window.__timelines[id]=tl;tl.seek(0)})();
