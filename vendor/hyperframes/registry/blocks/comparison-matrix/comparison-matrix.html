<!doctype html>
<html lang="en" data-composition-variables='[{"id":"title","label":"Title","type":"string","default":"Choose for the work ahead","maxLength":72,"update":"live"},{"id":"options","label":"Options","description":"Left | Right","type":"string","default":"Managed flow|Manual flow","maxLength":96,"update":"live"},{"id":"rows","label":"Comparison rows","description":"Criterion|Left|Right; Criterion|Left|Right","type":"string","default":"Setup|Guided|Manual;Handoffs|Visible|Scattered;Review|In context|Separate;Scale|Repeatable|Fragile","maxLength":700,"update":"live"},{"id":"winner","label":"Featured option","type":"enum","default":"left","options":[{"value":"left","label":"Left"},{"value":"right","label":"Right"},{"value":"none","label":"None"}],"update":"live"},{"id":"motionCueTimes","label":"Semantic cue times","type":"string","default":"{}","maxLength":2048,"update":"reload","description":"JSON event IDs to measured scene-relative seconds. Empty uses authored timings; this is not word alignment."}]'>
<head><meta charset="UTF-8"/><meta name="viewport" content="width=1920,height=1080"/><title>Comparison Matrix</title><style>
*{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:transparent}#comparison-matrix{position:relative;width:1920px;height:1080px;padding:96px 134px;overflow:hidden;background:var(--ipw-color-bg,#f4f6f8);color:var(--ipw-color-text,#15171a);font-family:var(--ipw-font-display,Inter,sans-serif)}.cm-kicker{color:var(--ipw-color-primary,#20bbc0);font:760 16px/1 var(--ipw-font-body,Inter,sans-serif);letter-spacing:.18em}.cm-title{margin:24px 0 48px;font-size:68px;line-height:.96;letter-spacing:-.06em}.cm-table{overflow:hidden;border:1px solid var(--ipw-color-border,#d8dde3);border-radius:var(--ipw-card-radius,32px);background:var(--ipw-color-surface,#fff);box-shadow:var(--ipw-card-shadow,0 22px 58px rgba(20,30,40,.1))}.cm-row{display:grid;grid-template-columns:360px 1fr 1fr;min-height:112px;border-bottom:1px solid var(--ipw-color-border,#d8dde3)}.cm-row:last-child{border-bottom:0}.cm-cell{display:flex;align-items:center;padding:0 34px;border-left:1px solid var(--ipw-color-border,#d8dde3);font:620 25px/1.15 var(--ipw-font-body,Inter,sans-serif)}.cm-cell:first-child{border-left:0;color:var(--ipw-color-muted,#68717c);font-size:18px;letter-spacing:.07em;text-transform:uppercase}.cm-head{min-height:126px;background:color-mix(in srgb,var(--ipw-color-bg,#f4f6f8) 74%,var(--ipw-color-surface,#fff))}.cm-head .cm-cell{font-size:31px;font-weight:780;letter-spacing:-.03em;text-transform:none;color:var(--ipw-color-text,#15171a)}.cm-head .cm-cell:first-child{font-size:15px;letter-spacing:.14em}.cm-cell.is-winner{position:relative;background:color-mix(in srgb,var(--ipw-color-primary,#20bbc0) 11%,var(--ipw-color-surface,#fff));color:var(--ipw-color-text,#15171a)}.cm-head .is-winner:after{content:"FEATURED";position:absolute;right:24px;top:18px;color:var(--ipw-color-primary,#20bbc0);font:760 11px/1 var(--ipw-font-body,Inter,sans-serif);letter-spacing:.12em}.cm-dot{display:inline-block;width:12px;height:12px;margin-right:16px;border-radius:50%;background:var(--ipw-color-primary,#20bbc0)}
[data-composition-id] .cm-title{line-height:1.4}</style></head><body><main id="comparison-matrix" data-composition-id="comparison-matrix" data-width="1920" data-height="1080" data-start="0" data-duration="10" data-ipw-ai-slot="winner"><div class="cm-kicker">DECISION MATRIX</div><h1 class="cm-title" data-ipw-variable="title" data-ipw-ai-slot="title"></h1><section class="cm-table" data-ipw-ai-slot="rows"></section><span hidden data-ipw-ai-slot="options"></span></main><script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script><script>
window.__timelines=window.__timelines||{};(function(){const root=document.getElementById("comparison-matrix"),id=root.dataset.compositionId,values={title:"Choose for the work ahead",options:"Managed flow|Manual flow",rows:"Setup|Guided|Manual;Handoffs|Visible|Scattered;Review|In context|Separate;Scale|Repeatable|Fragile",winner:"left",...(window.__hyperframes?.getVariables?.()??window.__hfVariablesByComp?.[id]??{})};root.querySelectorAll("[data-ipw-variable]").forEach(el=>{el.textContent=String(values[el.dataset.ipwVariable]??"")});const options=String(values.options).split("|").map(v=>v.trim()),rows=String(values.rows).split(";").map(row=>row.split("|").map(v=>v.trim())).filter(row=>row.length>=3).slice(0,6),winner=values.winner==="left"?1:values.winner==="right"?2:-1,table=root.querySelector(".cm-table");const head=document.createElement("div");head.className="cm-row cm-head";["CRITERIA",options[0]||"Option A",options[1]||"Option B"].forEach((text,index)=>{const cell=document.createElement("div");cell.className="cm-cell"+(index===winner?" is-winner":"");cell.textContent=text;head.append(cell)});table.append(head);rows.forEach(row=>{const line=document.createElement("div");line.className="cm-row";row.slice(0,3).forEach((text,index)=>{const cell=document.createElement("div");cell.className="cm-cell"+(index===winner?" is-winner":"");if(index===winner){const dot=document.createElement("i");dot.className="cm-dot";cell.append(dot)}cell.append(document.createTextNode(text));line.append(cell)});table.append(line)});})();
</script>
<script data-ipw-motion-recipe="1">
(function(){
const root=document.querySelector("[data-composition-id]"),id=root.dataset.compositionId;
const values=window.__hyperframes?.getVariables?.()??window.__hfVariablesByComp?.[id]??{};
const recipe={"version":1,"pattern":"compare","minHoldSeconds":0.7,"capacity":{"variable":"rows","separator":";","maxItems":4},"events":[{"id":"step-1","target":".cm-row:not(.cm-head):nth-child(2)","time":1.2,"duration":0.5,"action":"Reveal and focus the next semantic item"},{"id":"step-2","target":".cm-row:not(.cm-head):nth-child(3)","time":3.3,"duration":0.5,"action":"Reveal and focus the next semantic item"},{"id":"step-3","target":".cm-row:not(.cm-head):nth-child(4)","time":5.4,"duration":0.5,"action":"Reveal and focus the next semantic item"},{"id":"step-4","target":".cm-row:not(.cm-head):nth-child(5)","time":7.5,"duration":0.5,"action":"Reveal and focus the next semantic item"},{"id":"resolve","target":".cm-row:not(.cm-head)","time":8.6,"duration":0.55,"action":"Restore the complete readable result"}]};
const times=JSON.parse(String(values.motionCueTimes??"{}"));
const cue=event=>times[event.id]??event.time;
window.__timelines[id]?.kill();
const tl=gsap.timeline({paused:true});
tl.set(root.querySelectorAll("*"),{clearProps:"transform,opacity,clipPath"},0);
const items=[...root.querySelectorAll(".cm-row:not(.cm-head)")];
tl.fromTo(root.querySelectorAll(".cm-kicker,.cm-title,.cm-head"),{y:24,opacity:0},{y:0,opacity:1,duration:.65,ease:"power3.out"},0);
tl.set(items,{opacity:.18,y:18},0);
items.forEach((item,index)=>{
  const event=recipe.events[index]; if(!event||event.id==="resolve")return;
  const time=cue(event);
  tl.to(item,{opacity:1,y:0,duration:event.duration,ease:"power3.out"},time);
  tl.fromTo(item,{x:12},{x:0,duration:event.duration,ease:"power2.out"},time);
  if(index>0)tl.to(items[index-1],{opacity:.58,duration:.25,ease:"power2.out"},time);
});
const resolved=recipe.events.at(-1);
tl.to(items,{opacity:1,y:0,x:0,duration:resolved.duration,ease:"power2.out"},cue(resolved));
const conclusion=items.at(-1),primary=getComputedStyle(root).getPropertyValue("--ipw-color-primary").trim()||"#20bbc0";
if(conclusion)tl.fromTo(conclusion,{boxShadow:`inset 0 0 0 0px ${primary}`},{boxShadow:`inset 0 0 0 8px ${primary}`,duration:resolved.duration,ease:"power2.out"},cue(resolved));

tl.set(root,{visibility:"visible"},10);
window.__timelines[id]=tl;tl.seek(0);
})();
</script>
</body></html>
