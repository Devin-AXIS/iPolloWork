<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=1920, height=1080"/><title>马赛克翻页转场</title><style>*{box-sizing:border-box}html,body{width:1920px;height:1080px;margin:0;overflow:hidden;background:transparent;perspective:1400px}.fx{position:relative;width:100%;height:100%;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);overflow:hidden;background:transparent}.tile{background:var(--ipw-color-primary,#20bbc0);transform:rotateY(90deg) scale(.86);opacity:0;backface-visibility:hidden}.tile:nth-child(3n+2){background:var(--ipw-color-secondary,#0f766e)}.tile:nth-child(3n){background:var(--ipw-color-accent,#7c3aed)}</style></head><body><main class="fx" data-composition-id="effect-transition-mosaic-flip" data-width="1920" data-height="1080" data-start="0" data-duration="1.2"><i class="tile"></i><i class="tile"></i><i class="tile"></i><i class="tile"></i><i class="tile"></i><i class="tile"></i><i class="tile"></i><i class="tile"></i><i class="tile"></i><i class="tile"></i><i class="tile"></i><i class="tile"></i></main><script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script><script>window.__timelines=window.__timelines||{};var tl=gsap.timeline({paused:true});tl.to('.tile',{rotationY:0,scale:1,opacity:1,stagger:{each:.035,from:'edges'},duration:.32,ease:'power3.out'},0).to('.tile',{rotationY:-90,scale:.86,opacity:0,stagger:{each:.035,from:'center'},duration:.34,ease:'power3.in'},.68);window.__timelines['effect-transition-mosaic-flip']=tl;window.addEventListener('hf-seek',e=>tl.seek(Math.max(0,Math.min(e.detail.time,1.2))));tl.seek(0);</script></body></html>
