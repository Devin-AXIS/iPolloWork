<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"title","label":"清单标题","type":"string","default":"高效拍摄前的 4 项检查","maxLength":64},{"id":"items","label":"清单项目","type":"string","default":"光线:主光方向是否稳定,画面:主体与背景是否分离,声音:环境噪声是否可控,节奏:前三秒是否足够清楚","maxLength":300},{"id":"active","label":"重点项目","type":"string","default":"节奏","maxLength":28},{"id":"footer","label":"底部文案","type":"string","default":"保存这张清单，下次拍摄前快速过一遍。","maxLength":80}]'>
<head><meta charset="UTF-8"/><meta name="viewport" content="width=1920,height=1080"/><title>Xiaohongshu Checklist</title><style>
*{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:transparent}#root{position:relative;display:flex;width:1920px;height:1080px;padding:72px 110px;overflow:hidden;background:var(--ipw-color-bg,#f4f6f8);color:var(--ipw-color-text,#15171a);font-family:var(--ipw-font-display,Inter,Arial,sans-serif)}#root::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,color-mix(in srgb,var(--ipw-color-border,#d8dde3) 22%,transparent) 1px,transparent 1px),linear-gradient(color-mix(in srgb,var(--ipw-color-border,#d8dde3) 18%,transparent) 1px,transparent 1px);background-size:72px 72px;opacity:.2}#root>*{position:relative;z-index:1}.sm-animate,.sm-pop,.social-list-item{will-change:transform,opacity}
.check{width:1370px;margin:auto;padding:62px 68px;border:1px solid var(--ipw-color-border,#d8dde3);border-radius:40px;background:var(--ipw-color-surface,#fff);box-shadow:var(--ipw-card-shadow,0 30px 90px rgba(20,30,40,.14))}.check-head{display:flex;align-items:flex-start;gap:26px}.check-index{display:grid;place-items:center;width:72px;height:72px;border-radius:22px;background:#ff2442;color:#fff;font-size:26px;font-weight:950}.check-title{max-width:980px;margin:3px 0 0;font-size:49px;line-height:1.12;letter-spacing:-.04em}.check-list{display:grid;gap:14px;margin:42px 0}.social-list-item{display:grid;grid-template-columns:200px 1fr;gap:28px;padding:22px 26px;border:1px solid var(--ipw-color-border,#d8dde3);border-radius:20px}.social-list-item.is-highlight{border-color:#ff2442;background:color-mix(in srgb,#ff2442 8%,var(--ipw-color-surface,#fff));box-shadow:inset 7px 0 0 #ff2442}.social-list-label{font-size:21px;font-weight:900}.social-list-label::before{content:"✓";display:inline-grid;place-items:center;width:28px;height:28px;margin-right:12px;border-radius:50%;background:#111;color:#fff;font-size:15px}.social-list-value{color:var(--ipw-color-muted,#68717c);font-size:21px}.check-footer{color:var(--ipw-color-muted,#68717c);font-size:19px}
</style></head>
<body><main id="root" data-composition-id="xiaohongshu-checklist" data-width="1920" data-height="1080" data-start="0" data-duration="8" data-defaults='{"title":"高效拍摄前的 4 项检查","items":"光线:主光方向是否稳定,画面:主体与背景是否分离,声音:环境噪声是否可控,节奏:前三秒是否足够清楚","active":"节奏","footer":"保存这张清单，下次拍摄前快速过一遍。"}'><section class="check sm-animate"><header class="check-head"><div class="check-index sm-pop">01</div><h1 class="check-title" data-ipw-variable="title" data-ipw-ai-slot="title"></h1></header><div class="check-list" data-ipw-list="items" data-list-mode="pair" data-highlight-key="active" data-ipw-ai-slot="items"></div><span hidden data-ipw-variable="active" data-ipw-ai-slot="active"></span><footer class="check-footer" data-ipw-variable="footer" data-ipw-ai-slot="footer"></footer></section></main><script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script><script>window.__timelines=window.__timelines||{};(function(){
const root=document.getElementById("root"),id="xiaohongshu-checklist";
const defaults=JSON.parse(root.dataset.defaults),runtimeValues=window.__hyperframes?.getVariables?.()??window.__hfVariablesByComp?.[id]??{},values={...defaults,...runtimeValues};
root.querySelectorAll("[data-ipw-variable]").forEach(function(el){el.textContent=String(values[el.dataset.ipwVariable]??"")});
function parts(value){return String(value??"").split(/[|,]/).map(function(item){return item.trim()}).filter(Boolean)}
function pair(value){const index=value.indexOf(":");return index<0?[value,""]:[value.slice(0,index).trim(),value.slice(index+1).trim()]}
root.querySelectorAll("[data-ipw-list]").forEach(function(host){
 const key=host.dataset.ipwList,mode=host.dataset.listMode||"plain",highlight=String(values[host.dataset.highlightKey]??""),active=host.dataset.activeKey?Math.max(1,Number(values[host.dataset.activeKey]??0)):0;
 parts(values[key]).slice(0,4).forEach(function(raw,index){
  const split=pair(raw),item=document.createElement("article");item.className="social-list-item sm-animate";
  if((highlight&&split[0]===highlight)||(active===index+1))item.classList.add("is-highlight");
  if(mode==="pair"||mode==="meter"){
   const label=document.createElement("div"),value=document.createElement("div");label.className="social-list-label";value.className="social-list-value";label.textContent=split[0];value.textContent=split[1];item.append(label,value);
   if(mode==="meter"){const meter=document.createElement("div"),fill=document.createElement("span");meter.className="social-meter";fill.style.width=Math.max(0,Math.min(100,Number.parseFloat(split[1])||0))+"%";meter.append(fill);item.append(meter)}
  }else{item.textContent=raw}
  host.append(item);
 });
});
const initial={};
if("clip"==="slide-left")Object.assign(initial,{x:-58,opacity:0});else if("clip"==="slide-right")Object.assign(initial,{x:58,opacity:0});else if("clip"==="scale")Object.assign(initial,{scale:.88,opacity:0});else if("clip"==="clip")Object.assign(initial,{y:46,opacity:0,clipPath:"inset(0 0 100% 0)"});else Object.assign(initial,{y:48,opacity:0});
const tl=gsap.timeline({paused:true});
tl.fromTo(root.querySelectorAll(".sm-animate"),initial,{x:0,y:0,scale:1,opacity:1,clipPath:"inset(0 0 0% 0)",duration:.62,stagger:.085,ease:"power3.out"},.08).fromTo(root.querySelectorAll(".sm-pop"),{scale:.65,opacity:0},{scale:1,opacity:1,duration:.5,stagger:.08,ease:"back.out(1.5)"},.38).fromTo(root.querySelectorAll(".sm-draw"),{scaleX:0,transformOrigin:"left center"},{scaleX:1,duration:.6,ease:"power2.out"},.22);
window.__timelines[id]=tl;tl.seek(0);
})();</script></body></html>
