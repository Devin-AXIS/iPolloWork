<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=1920, height=1080"/><title>品牌轨道</title>
<style>
*{box-sizing:border-box}html,body{width:1920px;height:1080px;margin:0;overflow:hidden;background:transparent;font-family:var(--ipw-font-body,Inter,"PingFang SC",sans-serif)}.fx{position:relative;width:100%;height:100%;overflow:hidden;background:var(--ipw-color-surface,var(--ipw-color-bg,#101214));color:var(--ipw-color-text,#f7f7f5)}
.halo{position:absolute;left:960px;top:540px;border:2px solid var(--ipw-color-border,rgba(255,255,255,.18));border-radius:50%;transform:translate(-50%,-50%)}.h1{width:760px;height:760px}.h2{width:520px;height:520px;border-style:dashed}.h3{width:290px;height:290px;background:color-mix(in srgb,var(--ipw-color-primary,#20bbc0) 16%,transparent)}.core{position:absolute;left:960px;top:540px;width:150px;height:150px;display:grid;place-items:center;border-radius:38px;background:var(--ipw-color-primary,#20bbc0);color:var(--ipw-color-on-primary,#071516);font-size:54px;font-weight:900;transform:translate(-50%,-50%)}
.planet{position:absolute;width:28px;height:28px;border-radius:50%;background:var(--ipw-color-accent,var(--ipw-color-primary,#20bbc0));box-shadow:0 0 42px color-mix(in srgb,var(--ipw-color-accent,var(--ipw-color-primary,#20bbc0)) 65%,transparent)}.p1{left:572px;top:522px}.p2{left:1248px;top:315px;width:18px;height:18px}.label{position:absolute;left:96px;top:88px;font-size:20px;font-weight:800;letter-spacing:.2em}.copy{position:absolute;left:96px;bottom:92px}.copy strong{display:block;font-size:72px;letter-spacing:-.045em}.copy span{display:block;margin-top:14px;font-size:24px;color:var(--ipw-color-muted,#92979d)}.index{position:absolute;right:96px;bottom:92px;font-size:20px;letter-spacing:.18em;color:var(--ipw-color-muted,#92979d)}
</style></head><body><main class="fx" data-composition-id="effect-opening-orbit-lockup" data-width="1920" data-height="1080" data-start="0" data-duration="3.4"><div class="label">IPOLLO / SIGNAL 01</div><div class="halo h1"></div><div class="halo h2"></div><div class="halo h3"></div><div class="planet p1"></div><div class="planet p2"></div><div class="core" data-hf-id="opening-orbit-core">IP</div><div class="copy"><strong>Ideas find their orbit.</strong><span>主题感知的品牌开头片段</span></div><div class="index">SYSTEM ONLINE · 08/10</div></main>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script><script>window.__timelines=window.__timelines||{};var tl=gsap.timeline({paused:true});tl.from('.halo',{scale:.2,opacity:0,stagger:.12,duration:.9,ease:'expo.out'},0).from('.core',{scale:0,rotation:-28,duration:.75,ease:'back.out(1.8)'},.38).from('.planet',{scale:0,stagger:.14,duration:.42,ease:'back.out(2)'},.72).to('.h2',{rotation:68,duration:2.4,ease:'none'},0).to('.h1',{rotation:-26,duration:2.8,ease:'none'},0).from('.label,.index',{opacity:0,duration:.5,ease:'none'},.3).from('.copy',{opacity:0,y:28,duration:.7,ease:'power3.out'},1.05);window.__timelines['effect-opening-orbit-lockup']=tl;window.addEventListener('hf-seek',e=>tl.seek(Math.max(0,Math.min(e.detail.time,3.4))));tl.seek(0);</script></body></html>
