<!-- word-relay-geometry -->
<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    [data-composition-id="WordRelayGeometry"] { background: #07080c; overflow: hidden; }
    .design-stage { position:absolute;left:0;top:0;width:480px;height:270px;overflow:hidden;transform:scale(4);transform-origin:top left; }
    #root { position:absolute;inset:0; }
  </style>
</head>
<body>
  <div data-composition-id="WordRelayGeometry" data-start="0" data-duration="6" data-fps="30" data-width="1920" data-height="1080">
    <div class="design-stage"><div id="root"></div></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    window.__timelines = window.__timelines || {};
    const E={outCubic:t=>1-Math.pow(1-t,3),inQuad:t=>t*t,inOutCubic:t=>t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,outQuad:t=>t*(2-t)};
    const lerp=(t,a,b)=>a+(b-a)*t; const seg=(t,t0,t1,e=t=>t)=>e(Math.min(1,Math.max(0,(t-t0)/(t1-t0))));
    const rand=s=>{const x=Math.sin(s*127.1+311.7)*43758.5453;return x-Math.floor(x);};
    const CIRC_R=78, PARTS=Array.from({length:20},(_,i)=>({size:1+rand(i*3)*1.4,x:rand(i)*100,ph:rand(i+40),sp:0.5+rand(i+80)*0.8}));
    const SLOTS=[{label:'Faster',geom:[{x:0,r:CIRC_R+22,dash:true}],t0:0,t1:0.36},{label:'Better',geom:[{x:-110,r:62,d:0},{x:0,r:62,d:0.06},{x:110,r:62,d:0.12}],t0:0.32,t1:0.68},{label:'Stronger',geom:[],t0:0.64,t1:1}];
    const root=document.getElementById('root'); const tl=gsap.timeline({paused:true}); const state={t:0};
    tl.to(state,{t:1,duration:6,ease:'none',onUpdate:()=>{
      const t=state.t;
      const parts=PARTS.map((p,i)=>{const y=(1-((t*p.sp+p.ph)%1))*110-5,op=0.12+0.18*Math.sin((t*3+p.ph)*Math.PI*2)**2;
        return `<div style="position:absolute;width:${p.size}px;height:${p.size}px;border-radius:50%;background:#fff;left:${p.x}%;top:${y}%;opacity:${op}"></div>`;}).join('');
      const slots=SLOTS.map(({label,geom,t0,t1},i)=>{const isLast=i===SLOTS.length-1,tin=seg(t,t0,t0+0.07,E.outCubic),tout=isLast?0:seg(t,t1-0.05,t1,E.inQuad),alive=tin>0&&tout<1;
        if(!alive) return ''; const fillp=seg(t,t0+0.06,t0+0.18,E.inOutCubic),sh=seg(t,t0+0.05,t0+0.2,E.outQuad),sweep=seg(t,t0+0.08,t0+0.26,E.inOutCubic),white=seg(t,t0+0.27,t0+0.34,E.outQuad);
        let svg=''; geom.forEach((g,k)=>{if(g.dash){const grow=seg(t,t0+0.01,t0+0.14,E.outCubic);
          svg+=`<circle cx="${g.x}" cy="0" r="${g.r}" fill="none" stroke="#565e78" stroke-width="1.1" stroke-dasharray="5 7" opacity="${grow*(1-tout)}" transform="rotate(${-90+t*30}) scale(${lerp(grow,0.4,1)})"/>`;}
          else{const trim=seg(t,t0+0.02+(g.d||0),t0+0.14+(g.d||0),E.outCubic)-seg(t,t1-0.06,t1,E.inQuad)*(isLast?0:1);
          svg+=`<circle cx="${g.x}" cy="0" r="${g.r}" fill="none" stroke="#565e78" stroke-width="1.1" pathLength="1" stroke-dasharray="1" stroke-dashoffset="${1-Math.max(0,trim)}" transform="rotate(-90)"/>`;}});
        const word=isLast?`<div style="color:transparent;-webkit-text-stroke:1px #6a7186;opacity:${1-sh}">${label}</div>
          <div style="position:absolute;inset:0;color:#fff;opacity:${white};text-shadow:0 0 ${white*18}px rgba(255,255,255,.3)">${label}</div>
          <div style="position:absolute;inset:0;color:transparent;background-image:linear-gradient(100deg,#585f72 0%,#8d95aa 38%,#ffffff 50%,#8d95aa 62%,#585f72 100%);background-size:280% 100%;-webkit-background-clip:text;background-clip:text;opacity:${sh*(1-white)};background-position:${lerp(sweep,100,0)}% 0">${label}</div>`
          :`<div style="color:transparent;-webkit-text-stroke:1px #6a7186;opacity:${1-fillp*0.75}">${label}</div><div style="position:absolute;inset:0;color:#fff;clip-path:inset(-20% ${(1-fillp)*100}% -20% 0)">${label}</div>`;
        return `<div style="position:absolute;inset:0;opacity:${tin*(1-tout)}"><svg viewBox="-240 -135 480 270" style="position:absolute;inset:0;width:100%;height:100%">${svg}</svg>
          <div style="position:absolute;left:50%;top:50%;transform:translate(-50%,-52%) scale(${lerp(tout,1,0.86)});font-family:-apple-system,'Helvetica Neue',sans-serif;font-size:56px;font-weight:800;line-height:1;position:relative">${word}</div></div>`;}).join('');
      root.innerHTML=parts+slots;
    }},0);
    window.__timelines['WordRelayGeometry']=tl;
  </script>
</body>
</html>
