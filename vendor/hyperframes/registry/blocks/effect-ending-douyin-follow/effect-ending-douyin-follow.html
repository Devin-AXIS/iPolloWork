<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=1920, height=1080"/><title>抖音关注提示</title><style>
*{box-sizing:border-box}html,body{width:1920px;height:1080px;margin:0;overflow:hidden;background:transparent;font-family:var(--ipw-font-body,Inter,"PingFang SC",sans-serif)}.fx{position:relative;width:100%;height:100%;display:grid;place-items:center;overflow:hidden;background:var(--ipw-color-bg,#0c0d0f);color:var(--ipw-color-text,#f7f7f7)}.grain{position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,color-mix(in srgb,var(--ipw-color-primary,#20bbc0) 22%,transparent),transparent 38%)}.card{position:relative;width:810px;height:300px;display:flex;align-items:center;gap:42px;padding:46px 54px;border:1px solid var(--ipw-color-border,rgba(255,255,255,.16));border-radius:var(--ipw-card-radius,28px);background:var(--ipw-card-bg,var(--ipw-color-surface,#17191d));box-shadow:var(--ipw-card-shadow,0 30px 90px rgba(0,0,0,.24))}.avatar{position:relative;width:164px;height:164px;flex:none;display:grid;place-items:center;border-radius:50%;background:var(--ipw-color-primary,#20bbc0);color:var(--ipw-color-on-primary,#fff);font-size:62px;font-weight:900}.ring{position:absolute;inset:-20px;border:3px solid var(--ipw-color-accent,var(--ipw-color-primary,#20bbc0));border-radius:50%}.copy{min-width:0;flex:1}.copy strong{display:block;font-size:46px;letter-spacing:-.035em}.copy span{display:block;margin-top:14px;font-size:25px;color:var(--ipw-color-muted,#9ca3af)}.follow{margin-top:30px;width:245px;height:64px;border:0;border-radius:999px;background:var(--ipw-color-primary,#20bbc0);color:var(--ipw-color-on-primary,#fff);font-size:26px;font-weight:800}.note{position:absolute;left:74px;top:66px;font-size:20px;font-weight:800;letter-spacing:.18em}.thanks{position:absolute;right:74px;bottom:58px;font-size:22px;color:var(--ipw-color-muted,#9ca3af)}
</style></head><body><main class="fx" data-composition-id="effect-ending-douyin-follow" data-width="1920" data-height="1080" data-start="0" data-duration="3.2"><div class="grain"></div><div class="note">DOUYIN · FOLLOW</div><section class="card" data-hf-id="douyin-follow-card"><div class="avatar">IP<div class="ring"></div></div><div class="copy"><strong>@iPolloWork</strong><span>每天分享一个好创意</span><button class="follow">＋ 关注</button></div></section><div class="thanks">感谢观看 · 下期见</div></main><script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script><script>window.__timelines=window.__timelines||{};var tl=gsap.timeline({paused:true});tl.from('.card',{y:90,scale:.88,opacity:0,duration:.72,ease:'back.out(1.5)'},0).from('.avatar',{rotation:-18,scale:0,duration:.58,ease:'back.out(2)'},.22).from('.copy>*',{x:34,opacity:0,stagger:.1,duration:.45,ease:'power3.out'},.4).from('.note,.thanks',{opacity:0,duration:.45,ease:'none'},.55).fromTo('.ring',{scale:.7,opacity:0},{scale:1.35,opacity:1,duration:.8,ease:'power2.out'},.7).to('.ring',{opacity:0,duration:.35,ease:'none'},1.3).to('.follow',{scale:1.08,duration:.18,ease:'power2.out'},1.45).to('.follow',{scale:1,duration:.28,ease:'back.out(2)'},1.63);window.__timelines['effect-ending-douyin-follow']=tl;window.addEventListener('hf-seek',e=>tl.seek(Math.max(0,Math.min(e.detail.time,3.2))));tl.seek(0);</script></body></html>
