     easeOutCubic——y/blur/opacity 三通道同缓动同步收敛的"专业文字 reveal"；
     副标题随后同法跟进。设计坐标 480×270 等比放大。 -->

<html>
<head><script type="application/json" data-composition-variables="[{&quot;id&quot;:&quot;title&quot;,&quot;label&quot;:&quot;title&quot;,&quot;type&quot;:&quot;string&quot;,&quot;default&quot;:&quot;先 观察 再 判断&quot;,&quot;maxLength&quot;:10,&quot;update&quot;:&quot;reload&quot;},{&quot;id&quot;:&quot;subtitle&quot;,&quot;label&quot;:&quot;subtitle&quot;,&quot;type&quot;:&quot;string&quot;,&quot;default&quot;:&quot;理解 机制 才能 选择&quot;,&quot;maxLength&quot;:20,&quot;update&quot;:&quot;reload&quot;},{&quot;id&quot;:&quot;motionCueTimes&quot;,&quot;label&quot;:&quot;Measured phase cue times&quot;,&quot;type&quot;:&quot;string&quot;,&quot;default&quot;:&quot;{}&quot;,&quot;maxLength&quot;:2048}]"></script>
  <meta charset="UTF-8">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    [data-composition-id="shotcraft-blur-slide"] {
      background: #0a0b10;
      overflow: hidden;
    }

    .design-stage {
      position: absolute;
      left: 0;
      top: 0;
      width: 480px;
      height: 270px;
      overflow: hidden;
      transform: scale(4);
      transform-origin: top left;
    }

    .content {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      overflow: hidden;
    }

    .line {
      display: flex;
      gap: 0.32em;
    }

    .word {
      opacity: 0;
      transform: translateY(40px);
      filter: blur(10px);
    }

    .h1-line {
      font-weight: 800;
      font-size: 34px;
      line-height: 1.4;
      font-family: -apple-system, sans-serif;
      color: #eef1fa;
      letter-spacing: -0.5px;
    }

    .h2-line {
      font-weight: 400;
      font-size: 14px;
      line-height: 1.4;
      font-family: -apple-system, sans-serif;
      color: #7d86a3;
    }

    .h2-line .word {
      transform: translateY(26px);
    }
  [data-composition-id="shotcraft-blur-slide"]{position:relative;width:1920px;height:1080px;background:var(--ipw-color-bg,#0a0b10)}.sc-content{position:absolute;inset:0;display:flex;flex-direction:column;align-items:inherit;justify-content:inherit;padding:inherit;gap:inherit}.sc-content #root,.sc-content #comp{background:var(--ipw-color-bg,#0a0b10)}.sc-caption{position:absolute;left:120px;bottom:72px;color:var(--ipw-color-text,#fff);font:32px/1.4 sans-serif}</style>
</head>
<body>
  <div
    data-composition-id="shotcraft-blur-slide"
    data-start="0"
    data-duration="5.3"
    data-fps="30"
    data-width="1920"
    data-height="1080"
  ><div class="sc-content">
    <div class="design-stage">
      <div class="content">
        <div class="line h1-line" id="h1"></div>
        <div class="line h2-line" id="h2"></div>
      </div>
    </div>
  </div></div><script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>(function(){const host=document.querySelector('[data-composition-id="shotcraft-blur-slide"]');const id=host.dataset.compositionId;const values={...{"title":"先 观察 再 判断","subtitle":"理解 机制 才能 选择"},...(window.__hyperframes?.getVariables?.()??{}),...(window.__hfVariablesByComp?.[id]??{})};const escape=value=>String(value).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');

    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    const DUR = 3.8; // 114 frames @30fps

    const H1_WORDS = String(values.title).split(" ");
    const H2_WORDS = String(values.subtitle).split(" ");

    // Build word spans
    function buildLine(container, words, cls) {
      words.forEach((w, i) => {
        const span = document.createElement("span");
        span.className = "word";
        span.textContent = w;
        span.id = `${cls}-w${i}`;
        container.appendChild(span);
      });
    }

    buildLine(document.getElementById("h1"), H1_WORDS, "h1");
    buildLine(document.getElementById("h2"), H2_WORDS, "h2");

    // H1: words enter from 0.06–0.62 of total duration, stagger gap 0.055
    const h1Start = 0.06 * DUR;
    const h1End = 0.62 * DUR;
    const h1Window = h1End - h1Start;
    H1_WORDS.forEach((w, i) => {
      const wordStart = h1Start + (i * 0.055 * h1Window);
      const wordDur = 0.32 * h1Window;
      tl.to(`#h1-w${i}`, {
        opacity: 1,
        y: 0,
        filter: "blur(0px)",
        duration: wordDur,
        ease: "power2.out"
      }, wordStart);
    });

    // H2: words enter from 0.34–0.90, stagger gap 0.04
    const h2Start = 0.34 * DUR;
    const h2End = 0.90 * DUR;
    const h2Window = h2End - h2Start;
    H2_WORDS.forEach((w, i) => {
      const wordStart = h2Start + (i * 0.04 * h2Window);
      const wordDur = 0.32 * h2Window;
      tl.to(`#h2-w${i}`, {
        opacity: 1,
        y: 0,
        filter: "blur(0px)",
        duration: wordDur,
        ease: "power2.out"
      }, wordStart);
    });

    window.__timelines[id]=tl;host.__sourceTimeline=tl;})();
  </script>
