<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=1920,height=1080"/>
<title>Star Rating Fill</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:transparent}#star-rating-fill{width:1920px;height:1080px;display:grid;place-items:center;padding:120px;background:var(--ipw-color-bg,#f4f6f8);color:var(--ipw-color-text,#15171a);font-family:var(--ipw-font-display,Inter,sans-serif);text-align:center}.title{color:var(--ipw-color-muted,#68717c);font:800 20px/1 var(--ipw-font-body,Inter,sans-serif);letter-spacing:.16em;text-transform:uppercase}.stage{margin:52px 0 42px;display:flex;align-items:center;gap:46px}.stars{position:relative;display:flex;gap:18px;font-size:150px;line-height:1}.base{color:color-mix(in srgb,var(--ipw-color-muted,#68717c) 24%,transparent)}.fill{position:absolute;inset:0;width:var(--fill);overflow:hidden;white-space:nowrap;color:var(--ipw-color-primary,#20bbc0)}.value{font-size:126px;font-weight:820;letter-spacing:-.08em}.note{color:var(--ipw-color-muted,#68717c);font:720 26px/1 var(--ipw-font-body,Inter,sans-serif)}</style>
</head>
<body>
<main id="star-rating-fill" data-composition-id="star-rating-fill" data-width="1920" data-height="1080" data-start="0" data-duration="7">
<section>
<div class="title" data-ipw-variable="title" data-ipw-ai-slot="title">
</div>
<div class="stage">
<div class="stars" data-layout-allow-overlap data-layout-allow-overflow>
<div class="base">
</div>
<div class="fill">
</div>
</div>
<div class="value">0.0</div>
</div>
<div class="note" data-ipw-variable="note" data-ipw-ai-slot="note">
</div>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js">
</script>
<script>window.__timelines=window.__timelines||{};(function(){const root=document.getElementById("star-rating-fill"),values={title:"Customer rating",rating:4.8,count:5,note:"Based on 12,408 verified reviews",...(window.__hyperframes?.getVariables?.()??{})},count=Math.max(1,Math.min(10,Math.round(Number(values.count)||5))),rating=Math.max(0,Math.min(count,Number(values.rating)||0)),stars="★".repeat(count),base=root.querySelector(".base"),fill=root.querySelector(".fill"),value=root.querySelector(".value"),state={rating:0};root.querySelectorAll("[data-ipw-variable]").forEach(el=>el.textContent=String(values[el.dataset.ipwVariable]??""));base.textContent=stars;fill.textContent=stars;fill.style.setProperty("--fill","0%");const tl=gsap.timeline({paused:true});tl.from(root.querySelectorAll(".title,.note"),{y:18,opacity:0,stagger:.12,duration:.45,ease:"power3.out"}).from(root.querySelector(".stage"),{scale:.92,opacity:0,duration:.5,ease:"back.out(1.35)"},.08).to(state,{rating,duration:1.15,ease:"power2.out",onUpdate:()=>{fill.style.setProperty("--fill",`${state.rating/count*100}%`);value.textContent=state.rating.toFixed(1)}},.18);window.__timelines["star-rating-fill"]=tl;tl.seek(0)})();</script>
</body>
</html>
