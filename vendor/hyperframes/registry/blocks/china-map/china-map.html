    <title>China Map</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
      #cm-root {
        position: relative; width: 1920px; height: 1080px; overflow: hidden; padding: 86px 118px 72px;
        background: var(--ipw-color-bg, #f4f6f8); color: var(--ipw-color-text, #15171a);
        font-family: var(--ipw-font-display, Inter, sans-serif);
      }
      .cm-orb {
        position: absolute; left: -180px; bottom: -280px; width: 700px; height: 700px; border-radius: 50%;
        background: color-mix(in srgb, var(--ipw-color-primary, #20bbc0) 11%, transparent);
      }
      .cm-head { position: relative; z-index: 2; display: flex; align-items: end; justify-content: space-between; }
      .cm-kicker {
        display: flex; align-items: center; gap: 10px; margin-bottom: 17px; color: var(--ipw-color-text, #15171a);
        font: 760 15px/1 var(--ipw-font-body, Inter, sans-serif); letter-spacing: .18em; text-transform: uppercase;
      }
      .cm-kicker::before { content: ""; width: 28px; height: 5px; border-radius: 99px; background: var(--ipw-color-primary, #20bbc0); }
      .cm-title { max-width: 1100px; margin: 0; font-size: 72px; line-height: .96; letter-spacing: -.045em; }
      .cm-source {
        padding-bottom: 5px; color: var(--ipw-color-muted, #68717c);
        font: 650 16px/1.2 var(--ipw-font-body, Inter, sans-serif);
      }
      .cm-card {
        position: absolute; left: 118px; right: 118px; top: 268px; bottom: 72px;
        display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 30px; padding: 28px;
        border: 1px solid var(--ipw-color-border, #d8dde3); border-radius: var(--ipw-card-radius, 32px);
        background: var(--ipw-color-surface, #fff); box-shadow: var(--ipw-card-shadow, 0 26px 70px rgba(20, 30, 40, .11));
      }
      .cm-map-wrap {
        position: relative; min-width: 0; overflow: hidden; border-radius: calc(var(--ipw-card-radius, 32px) - 10px);
        background: radial-gradient(circle at 58% 46%, color-mix(in srgb, var(--ipw-color-primary, #20bbc0) 9%, transparent), transparent 58%),
          color-mix(in srgb, var(--ipw-color-bg, #f4f6f8) 68%, var(--ipw-color-surface, #fff));
      }
      .cm-map { width: 100%; height: 100%; display: block; }
      .cm-grid { fill: none; stroke: var(--ipw-color-border, #d8dde3); stroke-width: 1.25; stroke-dasharray: 5 11; opacity: .56; }
      .cm-region {
        fill: color-mix(in srgb, var(--ipw-color-primary, #20bbc0) 10%, var(--ipw-color-surface, #fff));
        fill-rule: evenodd; stroke: var(--ipw-color-border, #d8dde3); stroke-width: 1.15; stroke-linejoin: round;
        transform-box: fill-box; transform-origin: center;
      }
      .cm-region.is-highlight {
        fill: color-mix(in srgb, var(--ipw-color-primary, #20bbc0) 32%, var(--ipw-color-surface, #fff));
        stroke: var(--ipw-color-primary, #20bbc0); stroke-width: 2.4;
      }
      .cm-south-sea-inset rect {
        fill: color-mix(in srgb, var(--ipw-color-surface, #fff) 88%, transparent);
        stroke: var(--ipw-color-border, #d8dde3); stroke-width: 1.2;
      }
      .cm-inset-line { fill: none; stroke: var(--ipw-color-muted, #68717c); stroke-width: 2; stroke-dasharray: 7 8; }
      .cm-inset-label { fill: var(--ipw-color-muted, #68717c); font: 650 12px/1 var(--ipw-font-body, Inter, sans-serif); letter-spacing: .12em; }
      .cm-point { transform-box: fill-box; transform-origin: center; }
      .cm-ring {
        fill: color-mix(in srgb, var(--ipw-color-primary, #20bbc0) 9%, transparent);
        stroke: var(--ipw-color-primary, #20bbc0); stroke-width: 2; opacity: .54;
      }
      .cm-dot { fill: var(--ipw-color-primary, #20bbc0); }
      .cm-point text {
        fill: var(--ipw-color-text, #15171a); font: 720 15px/1 var(--ipw-font-body, Inter, sans-serif);
        paint-order: stroke; stroke: var(--ipw-color-surface, #fff); stroke-width: 7px; stroke-linejoin: round;
      }
      .cm-point.is-highlight .cm-ring {
        fill: color-mix(in srgb, var(--ipw-color-primary, #20bbc0) 28%, transparent); stroke-width: 4;
      }
      .cm-point.is-highlight text { fill: var(--ipw-color-text, #15171a); font-weight: 820; }
      .cm-panel { display: flex; flex-direction: column; min-width: 0; padding: 18px 14px 12px 12px; }
      .cm-panel-label {
        color: var(--ipw-color-muted, #68717c); font: 720 13px/1 var(--ipw-font-body, Inter, sans-serif);
        letter-spacing: .14em; text-transform: uppercase;
      }
      .cm-focus {
        margin: 20px 0 30px; padding: 24px; border-radius: calc(var(--ipw-card-radius, 32px) - 12px);
        background: var(--ipw-color-primary, #20bbc0); color: var(--ipw-color-on-primary, #102f31);
      }
      .cm-focus-name { font: 760 20px/1.15 var(--ipw-font-body, Inter, sans-serif); }
      .cm-focus-value { margin-top: 10px; font-size: 66px; font-weight: 800; line-height: .9; letter-spacing: -.06em; }
      .cm-ranking { display: grid; gap: 13px; }
      .cm-rank {
        display: grid; grid-template-columns: 1fr 45px; gap: 12px; align-items: center;
        color: var(--ipw-color-muted, #68717c); font: 680 14px/1 var(--ipw-font-body, Inter, sans-serif);
      }
      .cm-rank-value { text-align: right; color: var(--ipw-color-text, #15171a); }
      .cm-bar {
        grid-column: 1 / -1; height: 5px; border-radius: 99px; overflow: hidden;
        background: color-mix(in srgb, var(--ipw-color-border, #d8dde3) 65%, transparent);
      }
      .cm-bar > i {
        display: block; width: var(--cm-value); height: 100%; border-radius: inherit;
        background: var(--ipw-color-primary, #20bbc0); transform-origin: left;
      }
    </style>
