<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Editorial Snap</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; margin: 0; overflow: hidden; }
      body { background: #f4d849; color: #161616; font-family: Arial, sans-serif; }
      .composition { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f4d849; }
      .type { position: absolute; left: 80px; top: 54px; font-size: 18px; font-weight: 900; letter-spacing: .28em; }
      .poster { position: absolute; left: 50%; top: 43%; width: 850px; height: 560px; margin: -280px -425px; background: #e94230; transform: rotate(-5deg); box-shadow: 32px 32px 0 #1a1a1a; }
      .poster::before { content: "A"; position: absolute; inset: 0; display: grid; place-items: center; color: #f4d849; font-size: 420px; font-weight: 900; line-height: 1; }
      .caption-stage { position: absolute; left: 120px; right: 120px; bottom: 92px; display: flex; justify-content: center; }
      .caption-content { padding: 24px 36px; background: #161616; color: #fff; border: 3px solid #fff; box-shadow: 14px 14px 0 #e94230; font-size: 58px; font-weight: 850; letter-spacing: -.04em; transform: rotate(-1deg); }
      .accent { color: #f4d849; }
    </style>
  </head>
  <body>
    <main class="composition" data-composition-id="caption-editorial-snap" data-width="1920" data-height="1080" data-start="0" data-duration="4.1">
      <div class="type">CAPTION SYSTEM / EDITORIAL SNAP</div><div class="poster" data-layout-ignore></div>
      <div id="ces-caption" class="caption-stage" data-hf-id="ces-caption" data-ipw-caption="true">
        <div id="ces-content" class="caption-content" data-hf-id="ces-content" data-ipw-caption-content="true">Say it with <span class="accent">confidence.</span></div>
      </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      var timeline = gsap.timeline({ paused: true });
      timeline
        .from(".poster", { opacity: 0, scale: .72, rotation: -18, duration: .95, ease: "back.out(1.5)" }, 0)
        .from("#ces-content", { opacity: 0, y: 54, rotation: -6, scale: .86, duration: .72, ease: "back.out(1.7)" }, .42)
        .from(".accent", { color: "#ffffff", duration: .45, ease: "none" }, .92)
        .to("#ces-content", { rotation: .8, duration: .22, yoyo: true, repeat: 1, ease: "power2.inOut" }, 2.45);
      window.__timelines["caption-editorial-snap"] = timeline;
      window.addEventListener("hf-seek", function (event) { timeline.seek(Math.max(0, Math.min(event.detail.time, 4.1))); });
      timeline.seek(0);
    </script>
  </body>
</html>
