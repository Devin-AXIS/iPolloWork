<!doctype html><html lang="en" data-composition-variables='[{"id":"title","label":"Claim","type":"string","default":"The proof behind the promise","maxLength":72,"update":"live"},{"id":"stat","label":"Evidence metric","type":"string","default":"3.2×","maxLength":18,"update":"live"},{"id":"evidence","label":"Evidence summary","type":"string","default":"More reviewed ideas reached a decision","maxLength":84,"update":"live"},{"id":"source","label":"Source","type":"string","default":"Internal study · Q3","maxLength":56,"update":"live"},{"id":"motionCueTimes","label":"Semantic cue times","type":"string","default":"{}","maxLength":2048,"update":"reload","description":"JSON event IDs to measured scene-relative seconds. Empty uses authored timings; this is not word alignment."}]'><head><meta charset="UTF-8"/><meta name="viewport" content="width=1920,height=1080"/><title>Evidence Stack</title><style>*{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:transparent}#evidence-stack{position:relative;width:1920px;height:1080px;padding:118px 145px;background:var(--ipw-color-bg,#f4f6f8);color:var(--ipw-color-text,#15171a);font-family:var(--ipw-font-display,Inter,sans-serif)}h1{max-width:850px;margin:0;font-size:82px;line-height:.96;letter-spacing:-.07em}.stack{position:absolute;right:165px;top:210px;width:720px}.card{padding:32px 38px;border:1px solid var(--ipw-color-border,#d8dde3);border-radius:30px;background:var(--ipw-color-surface,#fff);box-shadow:var(--ipw-card-shadow,0 24px 58px rgba(20,30,40,.12))}.stat{margin-bottom:20px;font-size:144px;font-weight:800;letter-spacing:-.09em;color:var(--ipw-color-primary,#20bbc0)}.evidence{font-size:36px;font-weight:740;line-height:1.04;letter-spacing:-.04em}.source{margin-top:24px;color:var(--ipw-color-muted,#68717c);font:700 17px/1 var(--ipw-font-body,Inter,sans-serif);letter-spacing:.1em;text-transform:uppercase}.back{position:absolute;z-index:-1;inset:32px -26px -32px 26px;opacity:.45;backgro
