<!doctype html>
<html lang="en" data-composition-variables='[{"id":"leftTitle","label":"Left title","type":"string","default":"What the market says","maxLength":56},{"id":"rightTitle","label":"Right title","type":"string","default":"What people actually do","maxLength":56},{"id":"labels","label":"Panel labels","description":"Left | Right","type":"string","default":"SIGNAL|BEHAVIOR","maxLength":56},{"id":"mediaUrls","label":"Image URLs","description":"Left URL | Right URL; leave blank for themed placeholders","type":"string","default":"|","maxLength":4096}]'>
<head><meta charset="UTF-8"/><meta name="viewport" content="width=1920,height=1080"/><title>Split Screen</title><style>
*{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:transparent}#split-screen{position:relative;width:1920px;height:1080px;overflow:hidden;padding:72px;background:var(--ipw-color-bg,#f4f6f8);color:var(--ipw-color-text,#15171a);font-family:var(--ipw-font-display,Inter,sans-serif);perspective:1800px}.ss-stage{display:grid;grid-template-columns:1fr 1fr;gap:34px;height:100%;transform-style:preserve-3d}.ss-card{position:relative;overflow:hidden;border:1px solid var(--ipw-color-border,#d8dde3);border-radius:var(--ipw-card-radius,38px);background:var(--ipw-color-surface,#fff);box-shadow:var(--ipw-card-shadow,0 28px 64px rgba(20,30,40,.12));transform-style:preserve-3d;will-change:transform}.ss-media{position:absolute;inset:0;background:linear-gradient(150deg,color-mix(in srgb,var(--ipw-color-primary,#20bbc0) 78%,#15171a),color-mix(in srgb,var(--ipw-color-surface,#fff) 16%,#15171a))}.ss-card:nth-child(2) .ss-media{background:linear-gradient(210deg,color-mix(in srgb,var(--ipw-color-secondary,#ff6b4a) 72%,#15171a),color-mix(in srgb,var(--ipw-color-surface,#fff) 12%,#15171a))}.ss-image{position:absolute;inset:0;display:none;background-position:center;background-size:cover}.has-image .ss-image{display:block}.ss-overlay{position:absolute;inset:0;background:linear-gradient(0deg,rgba(8,12,16,.82),rgba(8,12,16,.04) 68%)}.ss-copy{position:absolute;left:56px;right:56px;bottom:60px;color:#fff}.ss-label{font:760 16px/1 var(--ipw-font-body,Inter,sans-serif);letter-spacing:.18em}.ss-title{max-width:690px;margin:24px 0 0;font-size:68px;line-height:.96;letter-spacing:-.06em}.ss-center{position:absolute;left:50%;top:50%;z-index:5;display:grid;place-items:center;width:94px;height:94px;border-radius:50%;transform:translate(-50%,-50%);background:var(--ipw-color-bg,#f4f6f8);color:var(--ipw-color-primary,#20bbc0);font:820 20px/1 var(--ipw-font-body,Inter,sans-serif);box-shadow:0 14px 30px rgba(20,30,40,.16)}
</style></head><body><main id="split-screen" data-composition-id="split-screen" data-width="1920" data-height="1080" data-start="0" data-duration="10"><section class="ss-stage"><article id="ss-left" class="ss-card"><div class="ss-media" data-ipw-ai-slot="mediaUrls"><div class="ss-image"></div><div class="ss-overlay"></div></div><div class="ss-copy"><div class="ss-label"></div><h1 class="ss-title" data-ipw-variable="leftTitle" data-ipw-ai-slot="leftTitle"></h1></div></article><article id="ss-right" class="ss-card"><div class="ss-media"><div class="ss-image"></div><div class="ss-overlay"></div></div><div class="ss-copy"><div class="ss-label"></div><h1 class="ss-title" data-ipw-variable="rightTitle" data-ipw-ai-slot="rightTitle"></h1></div></article></section><div class="ss-center">VS</div></main><script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script><script>
window.__timelines=window.__timelines||{};(function(){const root=document.getElementById("split-screen"),id=root.dataset.compositionId,values={leftTitle:"What the market says",rightTitle:"What people actually do",labels:"SIGNAL|BEHAVIOR",mediaUrls:"|",...(window.__hyperframes?.getVariables?.()??window.__hfVariablesByComp?.[id]??{})};root.querySelectorAll("[data-ipw-variable]").forEach(el=>{el.textContent=String(values[el.dataset.ipwVariable]??"")});const cards=[root.querySelector("#ss-left"),root.querySelector("#ss-right")],labels=String(values.labels).split("|");root.querySelectorAll(".ss-label").forEach((el,index)=>{el.textContent=(labels[index]||["SIGNAL","BEHAVIOR"][index]).trim()});const urls=String(values.mediaUrls).split("|");cards.forEach((card,index)=>{const url=(urls[index]||"").trim();if(url){card.querySelector(".ss-image").style.backgroundImage=`url(${JSON.stringify(url)})`;card.querySelector(".ss-media").classList.add("has-image")}});const tl=gsap.timeline({paused:true});tl.fromTo(root.querySelector("#ss-left"),{x:-260,rotateY:19,opacity:0},{x:0,rotateY:8,opacity:1,duration:.86,ease:"power3.out"},.08).fromTo(root.querySelector("#ss-right"),{x:260,rotateY:-19,opacity:0},{x:0,rotateY:-8,opacity:1,duration:.86,ease:"power3.out"},.18).fromTo(root.querySelectorAll(".ss-copy"),{y:42,opacity:0},{y:0,opacity:1,duration:.52,stagger:.1,ease:"power3.out"},.5).fromTo(root.querySelector(".ss-center"),{scale:0,opacity:0},{scale:1,opacity:1,duration:.52,ease:"power3.out"},.76).to(root.querySelector("#ss-left"),{y:-7,duration:1.3,ease:"sine.inOut",yoyo:true,repeat:1},1.25).to(root.querySelector("#ss-right"),{y:7,duration:1.3,ease:"sine.inOut",yoyo:true,repeat:1},1.25);window.__timelines[id]=tl;tl.seek(0)})();
</script></body></html>
