<!-- glitch-cycle — Glitch Cycle 乱码轮播（motion-lab 定稿转原生 HyperFrames）
     同一位置循环轮播状态短语，每条短语头尾乱码、中段偶发轻微抖动
     （glitch 概率关键帧 [1,0,0,0.1,0,0,1]，最后一条结尾收为 0），
     切换瞬间伴随 RGB 分离与位移抖动；底部细进度条随 t 匀速填满。
     设计坐标 480×270 等比放大。 -->
<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    [data-composition-id="GlitchCycle"] {
      background: #0a0b10;
      overflow: hidden;
    }

    .design-stage {
      position: absolute;
      left: 0; top: 0;
      width: 480px; height: 270px;
      overflow: hidden;
      transform: scale(4);
      transform-origin: top left;
    }

    .glitch-center {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0b10;
    }

    .glitch-row {
      display: flex;
      font-family: "SF Mono", Menlo, monospace;
      font-size: 26px;
      letter-spacing: 3px;
      color: #dfe6f5;
    }

    .glitch-char {
      min-width: 0.66em;
      text-align: center;
    }

    .progress-track {
      position: absolute;
      left: 50%; top: 63%;
      width: 120px; height: 2px;
      margin-left: -60px;
      background: #232840;
      border-radius: 1px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: #6c8cff;
    }
  </style>
</head>
<body>
  <div
    data-composition-id="GlitchCycle"
    data-start="0"
    data-duration="5.6"
    data-fps="30"
    data-width="1920"
    data-height="1080"
  >
    <div class="design-stage">
      <div class="glitch-center">
        <div class="glitch-row" id="glitch-row"></div>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    const DUR = 5.6;
    const FPS = 30;
    const TOTAL_FRAMES = 168;

    const PHRASES = ["INITIALIZING", "LOADING ASSETS", "COMPILING SHADERS", "READY TO SHIP"];
    const POOL = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#$%&<>/\\";
    const KF = [1, 0, 0, 0.1, 0, 0, 1];
    const KF_LAST = [1, 0, 0, 0.1, 0, 0, 0];
    const MAXCH = Math.max(...PHRASES.map(p => p.length));

    const rand = (seed) => {
      const x = Math.sin(seed * 127.1 + 311.7) * 43758.5453;
      return x - Math.floor(x);
    };

    const lerp = (t, a, b) => a + (b - a) * t;

    const glitchAt = (kf, p) => {
      const segs = kf.length - 1;
      const x = Math.min(segs - 1e-6, Math.max(0, p * segs));
      const i = Math.floor(x);
      return lerp(x - i, kf[i], kf[i + 1]);
    };

    // Build character spans
    const row = document.getElementById("glitch-row");
    for (let i = 0; i < MAXCH; i++) {
      const span = document.createElement("span");
      span.className = "glitch-char";
      span.id = `gc-${i}`;
      span.textContent = " ";
      row.appendChild(span);
    }

    const progressFill = document.getElementById("progress-fill");
    const chars = Array.from({ length: MAXCH }, (_, i) => document.getElementById(`gc-${i}`));

    // Animate with onUpdate for frame-accurate glitch
    const state = { t: 0 };
    tl.to(state, {
      t: 1,
      duration: DUR,
      ease: "none",
      onUpdate: () => {
        const t = state.t;
        const N = PHRASES.length;
        const slot = Math.min(N - 1, Math.floor(t * N));
        const p = t * N - slot;
        const text = PHRASES[slot];
        const g = glitchAt(slot === N - 1 ? KF_LAST : KF, p);
        const frame = Math.floor(t * TOTAL_FRAMES);
        const bucket = Math.floor(frame / 2);

        const jx = (rand(bucket * 5 + slot) - 0.5) * g * 10;
        const jy = (rand(bucket * 9 + slot + 40) - 0.5) * g * 4;

        row.style.transform = `translate(${jx}px,${jy}px)`;
        row.style.textShadow = g > 0.04
          ? `${g * 3}px 0 rgba(255,60,90,${g * 0.8}), ${-g * 3}px 0 rgba(60,220,255,${g * 0.8})`
          : "none";

        for (let i = 0; i < MAXCH; i++) {
          const ch = i < text.length ? text[i] : " ";
          const el = chars[i];
          if (ch === " ") {
            el.textContent = " ";
            el.style.color = "";
          } else {
            const hit = rand(i * 31 + bucket * 17 + slot * 97) < g;
            if (hit) {
              el.textContent = POOL[Math.floor(rand(i * 131 + bucket * 7 + slot * 13) * POOL.length)];
              el.style.color = rand(i + bucket) > 0.5 ? "#6c8cff" : "#4a5270";
            } else {
              el.textContent = ch;
              el.style.color = "#dfe6f5";
            }
          }
        }

        progressFill.style.width = `${t * 100}%`;
      }
    }, 0);

    window.__timelines["GlitchCycle"] = tl;
  </script>
</body>
</html>
