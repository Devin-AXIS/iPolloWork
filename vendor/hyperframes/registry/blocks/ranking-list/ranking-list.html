<!doctype html>

window.__timelines=window.__timelines||{};(function(){const root=document.getElementById("ranking-list"),id=root.dataset.compositionId,values={title:"Signals ranked by impact",rankingData:"Clarity:94,Speed:88,Trust:82,Reach:73,Cost:61",highlight:"Clarity",source:"Internal benchmark / Q3",...(window.__hyperframes?.getVariables?.()??window.__hfVariablesByComp?.[id]??{})};root.querySelectorAll("[data-ipw-variable]").forEach(el=>{el.textContent=String(values[el.dataset.ipwVariable]??"")});const rows=String(values.rankingData).split(/[,|]/).map(part=>{const split=part.lastIndexOf(":");return split>0?{label:part.slice(0,split).trim(),value:Number(part.slice(split+1).trim())}:null}).filter(row=>row&&Number.isFinite(row.value)).sort((a,b)=>b.value-a.value).slice(0,8),max=Math.max(...rows.map(row=>row.value),1),list=root.querySelector(".rl-list");rows.forEach((row,index)=>{const item=document.createElement("article");item.className="rl-row"+(row.label===String(values.highlight)?" is-highlight":"");item.innerHTML=`<span class="rl-rank">0${index+1}</span><strong class="rl-name"></strong><div class="rl-track"><i class="rl-fill"></i></div><b class="rl-value"></b>`;item.querySelector(".rl-name").textContent=row.label;item.querySelector(".rl-value").textContent=String(row.value);const fill=item.querySelector(".rl-fill"),scale=Math.max(.04,row.value/max);fill.dataset.scale=String(scale);fill.style.transform=`scaleX(${scale})`;list.append(item)});const tl=gsap.timeline({paused:true});tl.fromTo(root.querySelectorAll(".rl-header>*"),{y:34,opacity:0},{y:0,opacity:1,duration:.52,stagger:.1,ease:"power3.out"},.08).fromTo(root.querySelectorAll(".rl-row"),{y:44,opacity:0},{y:0,opacity:1,duration:.46,stagger:.09,ease:"power4.out"},.32).fromTo(root.querySelectorAll(".rl-fill"),{scaleX:0},{scaleX:(index,target)=>Number(target.dataset.scale||1),duration:.72,stagger:.07,ease:"power3.out"},.48);window.__timelines[id]=tl;tl.seek(0)})();
