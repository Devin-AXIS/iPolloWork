<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=1920,height=1080"/>
<title>Number Wheel</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:transparent}#number-wheel{width:1920px;height:1080px;display:grid;place-items:center;padding:120px;background:var(--ipw-color-bg,#f4f6f8);color:var(--ipw-color-text,#15171a);font-family:var(--ipw-font-display,Inter,sans-serif);text-align:center}.title{color:var(--ipw-color-muted,#68717c);font:800 20px/1 var(--ipw-font-body,Inter,sans-serif);letter-spacing:.16em;text-transform:uppercase}.metric{margin:44px 0 34px;display:flex;align-items:baseline;justify-content:center;color:var(--ipw-color-primary,#20bbc0);font-size:270px;font-weight:840;line-height:.78;letter-spacing:-.09em}.digits{display:inline-flex}.digit{height:.86em;overflow:hidden}.strip{display:grid;line-height:.86em}.suffix{font-size:.42em;margin-left:.08em}.note{color:var(--ipw-color-muted,#68717c);font:720 26px/1 var(--ipw-font-body,Inter,sans-serif)}</style>
</head>
<body>
<main id="number-wheel" data-composition-id="number-wheel" data-width="1920" data-height="1080" data-start="0" data-duration="7">
<section data-layout-allow-overlap>
<div class="title" data-ipw-variable="title" data-ipw-ai-slot="title">
</div>
<div class="metric">
<div class="digits" data-layout-allow-overflow>
</div>
<div class="suffix" data-ipw-variable="suffix" data-ipw-ai-slot="suffix">
</div>
</div>
<div class="note" data-ipw-variable="note" data-ipw-ai-slot="note">
</div>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js">
</script>
<script>window.__timelines=window.__timelines||{};(function(){const root=document.getElementById("number-wheel"),values={title:"Active creators",value:"30222",suffix:"+",note:"Measured across the last 30 days",...(window.__hyperframes?.getVariables?.()??{})},digits=root.querySelector(".digits");root.querySelectorAll("[data-ipw-variable]").forEach(el=>el.textContent=String(values[el.dataset.ipwVariable]??""));for(const char of String(values.value)){if(!/\d/.test(char)){digits.append(document.createTextNode(char));continue}const frame=document.createElement("span"),strip=document.createElement("span"),target=Number(char);frame.className="digit";strip.className="strip";for(let i=0;i<=10+target;i+=1){const step=document.createElement("span");step.textContent=String(i%10);strip.append(step)}strip.dataset.target=String(-(10+target)*.86);frame.append(strip);digits.append(frame)}const tl=gsap.timeline({paused:true});tl.from(root.querySelectorAll(".title,.note"),{y:18,opacity:0,stagger:.12,duration:.45,ease:"power3.out"}).from(root.querySelector(".metric"),{scale:.9,opacity:0,duration:.5,ease:"back.out(1.4)"},.08).to(root.querySelectorAll(".strip"),{y:(_,el)=>`${el.dataset.target}em`,stagger:.06,duration:1.15,ease:"power3.out"},.18);window.__timelines["number-wheel"]=tl;tl.seek(0)})();</script>
</body>
</html>
