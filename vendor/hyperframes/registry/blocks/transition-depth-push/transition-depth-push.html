<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Depth Push</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; margin: 0; overflow: hidden; }
      body { background: #101014; font-family: Arial, sans-serif; }
      .composition { position: relative; width: 100%; height: 100%; overflow: hidden; perspective: 1200px; }
      .scene { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; overflow: hidden; }
      .outgoing { background: radial-gradient(circle at 25% 25%, #ffc95c, #eb5f47 54%, #8f2436); color: #28110e; }
      .incoming { background: radial-gradient(circle at 72% 28%, #8fe9dc, #315b86 54%, #141832); color: #f4fbff; }
      .grid { position: absolute; inset: 0; opacity: .18; background-image: linear-gradient(currentColor 1px, transparent 1px), linear-gradient(90deg, currentColor 1px, transparent 1px); background-size: 96px 96px; }
      .kicker { font-size: 19px; font-weight: 800; letter-spacing: .32em; }
      h1 { margin: 28px 0 0; font-size: 152px; line-height: .86; letter-spacing: -.075em; }
      .index { position: absolute; left: 86px; top: 68px; font-size: 18px; font-weight: 900; letter-spacing: .2em; }
    </style>
  </head>
  <body>
    <main class="composition" data-composition-id="transition-depth-push" data-width="1920" data-height="1080" data-start="0" data-duration="1.3">
      <section class="scene outgoing" data-hf-id="tdp-outgoing" data-layout-allow-overlap data-layout-allow-occlusion data-layout-allow-overflow><div class="grid" data-layout-ignore></div><div class="index">01 / BEFORE</div><div><div class="kicker">THE QUESTION</div><h1>Move closer.</h1></div></section>
      <section class="scene incoming" data-hf-id="tdp-incoming" data-layout-allow-overlap data-layout-allow-occlusion><div class="grid" data-layout-ignore></div><div class="index">02 / AFTER</div><div><div class="kicker">THE ANSWER</div><h1>See deeper.</h1></div></section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      var timeline = gsap.timeline({ paused: true });
      timeline
        .set(".incoming", { opacity: 0, scale: .76, filter: "blur(22px)" }, 0)
        .to(".outgoing", { scale: 1.35, opacity: 0, filter: "blur(18px)", duration: 1.05, ease: "power3.inOut" }, 0)
        .to(".incoming", { scale: 1, opacity: 1, filter: "blur(0px)", duration: 1.05, ease: "power3.inOut" }, .12)
        .from(".incoming h1", { y: 58, opacity: 0, duration: .68, ease: "power3.out" }, .45);
      window.__timelines["transition-depth-push"] = timeline;
      window.addEventListener("hf-seek", function (event) { timeline.seek(Math.max(0, Math.min(event.detail.time, 1.3))); });
      timeline.seek(0);
    </script>
  </body>
</html>
