<!-- pill-chip-slot-cycle-handled -->
<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    [data-composition-id="PillChipSlotCycleHandled"] { background: #fbfbfd; overflow: hidden; }
    .design-stage { position:absolute;left:0;top:0;width:480px;height:270px;overflow:hidden;transform:scale(4);transform-origin:top left; }
    #root { position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:-apple-system,system-ui,sans-serif; }
  </style>
</head>
<body>
  <div data-composition-id="PillChipSlotCycleHandled" data-start="0" data-duration="5" data-fps="30" data-width="1920" data-height="1080">
    <div class="design-stage"><div id="root"></div></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    window.__timelines = window.__timelines || {};
    const E={inOutCubic:t=>t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2}; const lerp=(t,a,b)=>a+(b-a)*t;
    const seg=(t,t0,t1,e=t=>t)=>e(Math.min(1,Math.max(0,(t-t0)/(t1-t0))));
    const WORDS=[{w:'Sales',e:'⚡'},{w:'Workflow',e:'📈'},{w:'Admin',e:'⚙️'},{w:'Reports',e:'📄'}];
    const widths=[139,178,145,171]; const FONT='700 22px -apple-system,system-ui,sans-serif';
    const root=document.getElementById('root'); const tl=gsap.timeline({paused:true}); const state={t:0};
    tl.to(state,{t:1,duration:5,ease:'none',onUpdate:()=>{
      const t=state.t; let pos=0; for(const s0 of [0.25,0.47,0.69]) pos+=seg(t,s0,s0+0.12,E.inOutCubic);
      const ci=Math.min(WORDS.length-1,Math.floor(pos)), frac=pos-ci, chipW=lerp(frac,widths[ci],widths[Math.min(ci+1,WORDS.length-1)]);
      const near=Math.round(pos), roll=(pos-near)*48*0.5, settle=1-Math.min(1,Math.abs(pos-near)*3);
      const ghost=(top,label)=>`<div style="position:absolute;left:50%;top:${top}px;font:${FONT};color:#15171d;white-space:nowrap;transform:translateX(-50%) translateY(${-roll}px);opacity:${0.13*(0.4+settle*0.6)}">${label}</div>`;
      const rows=WORDS.map(({w,e})=>`<div style="height:48px;display:flex;align-items:center;gap:9px;padding-left:18px;white-space:nowrap"><span style="font-size:18px">${e}</span><span style="font:${FONT};color:#fff">${w}</span></div>`).join('');
      root.innerHTML=`<div style="color:#15171d;font-weight:800;font-size:30px;letter-spacing:-0.5px;flex:none">Your</div>
        <div style="position:relative;flex:none;margin:0 14px">${ghost(-38,near>0?WORDS[near-1].w:'')}${ghost(58,near<WORDS.length-1?WORDS[near+1].w:'')}
          <div style="position:relative;height:48px;width:${chipW}px;border-radius:99px;background:#1a1c24;box-shadow:0 8px 24px rgba(20,22,40,.22);overflow:hidden">
            <div style="position:absolute;left:0;right:0;top:0;transform:translateY(${-pos*48}px)">${rows}</div></div></div>
        <div style="color:#15171d;font-weight:800;font-size:30px;letter-spacing:-0.5px;flex:none">Handled</div>`;
      root.style.display='flex'; root.style.alignItems='center';
    }},0);
    window.__timelines['PillChipSlotCycleHandled']=tl;
  </script>
</body>
</html>
