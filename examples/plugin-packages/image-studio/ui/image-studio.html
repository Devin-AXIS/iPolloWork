<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>图片工作台</title>
  <style>
    :root {
      color-scheme: light dark;
      font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --bg: #f4f4f2;
      --surface: rgba(255, 255, 255, .78);
      --surface-solid: #fff;
      --surface-muted: rgba(255, 255, 255, .55);
      --text: #18181b;
      --muted: #71717a;
      --line: rgba(24, 24, 27, .1);
      --line-strong: rgba(24, 24, 27, .18);
      --accent: #18181b;
      --accent-text: #fff;
      --selection: #6366f1;
      --selection-soft: rgba(99, 102, 241, .28);
      --success: #059669;
      --danger: #dc2626;
      --shadow: 0 18px 50px rgba(24, 24, 27, .08);
      --radius: 14px;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .48; }
    .app { display: grid; grid-template-rows: 52px minmax(0, 1fr); height: 100vh; }
    .topbar {
      display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 12px; padding: 0 14px;
      border-bottom: 1px solid var(--line); background: var(--surface);
      backdrop-filter: blur(22px) saturate(1.2); -webkit-backdrop-filter: blur(22px) saturate(1.2);
    }
    .document-title { min-width: 0; overflow: hidden; font-size: 13px; font-weight: 600; letter-spacing: -.01em; text-overflow: ellipsis; white-space: nowrap; }
    .mode-switch { display: flex; height: 36px; gap: 2px; padding: 2px; border-radius: 9px; background: rgba(127,127,127,.09); }
    .mode-switch button { flex: 0 0 auto; height: 32px; border: 0; border-radius: 7px; background: transparent; padding: 0 12px; color: var(--muted); font-size: 12px; white-space: nowrap; }
    .mode-switch button.active { background: #fff; color: #171717; box-shadow: none; }
    .top-actions { grid-column: 3; display: flex; min-width: 0; align-items: center; justify-content: flex-end; gap: 8px; }
    .provider { display: flex; min-width: 0; max-width: 190px; align-items: center; gap: 7px; color: var(--muted); font-size: 12px; white-space: nowrap; }
    .provider { position: relative; height: 32px; padding: 0 10px; border-radius: 8px; background: #f0f0f2; color: #18181b; }
    .provider:hover { background: #e6e6e9; }
    .provider #modelMenu { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
    .provider:focus-within { outline: 2px solid var(--selection); outline-offset: 3px; border-radius: 8px; }
    .provider #modelMenu:disabled { cursor: wait; }
    .provider-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    .provider-status { flex: 0 0 auto; }
    .provider-dot { flex: 0 0 7px; width: 7px; height: 7px; border-radius: 999px; background: #a1a1aa; }
    .provider.ready .provider-dot { background: var(--success); box-shadow: 0 0 0 3px rgba(5,150,105,.12); }
    .shell { position: relative; min-height: 0; }
    .workspace { position: absolute; inset: 0; min-width: 0; min-height: 0; overflow: hidden; }
    .stage {
      position: absolute; inset: 0; display: grid; place-items: center; overflow: auto;
      background-color: var(--bg);
      background-image: radial-gradient(circle at 1px 1px, rgba(113,113,122,.13) 1px, transparent 0);
      background-size: 20px 20px;
    }
    html.generating, html.generating body, html.generating .stage { background: transparent; }
    .stage.panning { cursor: grabbing; user-select: none; }
    .generation-gallery { align-self: stretch; justify-self: stretch; min-height: 0; display: flex; flex-direction: column; width: min(100%, 808px); margin: 0 auto; padding: 20px 24px 12px; gap: 12px; }
    .gallery-sections { display: grid; grid-template-columns: 1fr; gap: 12px; overflow: auto; min-height: 0; flex: 1; align-content: start; }
    .gallery-section { min-width: 0; }
    .gallery-heading { margin: 0 0 12px; font-size: 14px; font-weight: 600; height: 36px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .gallery-heading .gallery-title { margin: 0; font-size: 14px; font-weight: 600; line-height: 20px; }
    .gallery-heading .button { min-height: 28px; padding: 4px 8px; font-size: 12px; }
    .gallery-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; overflow: auto; min-height: 0; padding: 0; align-content: start; grid-auto-rows: max-content; flex: 1; }
    .image-card { min-width: 0; height: 190px; position: relative; border: 0; border-radius: 16px; background: #fff; color: #18181b; box-shadow: none; overflow: hidden; }
    .generation-pending { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 16px; text-align: center; font-size: 12px; line-height: 1.5; }
    .generation-progress { appearance: none; width: 100%; max-width: 140px; height: 4px; border: 0; border-radius: 999px; overflow: hidden; background: #eeeeef; }
    .generation-progress::-webkit-progress-bar { background: #eeeeef; border-radius: 999px; }
    .generation-progress::-webkit-progress-value { background: #18181b; border-radius: 999px; transition: width 1s linear; }
    .generation-progress::-moz-progress-bar { background: #18181b; border-radius: 999px; }
    @media (prefers-reduced-motion: reduce) { .generation-progress::-webkit-progress-value { transition: none; } }
    .image-card.selected::after { content: "✓"; position: absolute; top: 8px; right: 8px; width: 22px; height: 22px; display: grid; place-items: center; border-radius: 8px; background: #18181b; color: #fff; pointer-events: none; }
    .image-card > button:first-child { width: 100%; height: 146px; border: 0; background: transparent; padding: 8px; display: grid; place-items: center; }
    .image-card img { max-width: 100%; width: 100%; height: 130px; object-fit: contain; border-radius: 8px; }
    .card-actions { display: flex; justify-content: space-between; gap: 4px; height: 44px; padding: 8px; border-top: 0; }
    .card-actions button { background: transparent; border: 0; padding: 6px; border-radius: 6px; font-size: 12px; }
    .card-actions button:hover { background: var(--surface-muted); }
    .reference-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; flex: 0 0 auto; }
    @media (min-width: 481px) and (max-width: 640px) {
      .gallery-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 480px) {
      .card-actions { height: 42px; padding: 7px; }
      .gallery-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .image-card { height: 142px; }
      .image-card > button:first-child { height: 100px; }
      .image-card img { height: 84px; }
    }
    .empty { display: grid; justify-items: center; width: min(520px, calc(100% - 40px)); text-align: center; }
    .empty-orb { display: grid; place-items: center; width: 48px; height: 48px; border-radius: 8px; background: #fff; }
    .empty-orb img { display: block; width: 32px; height: 32px; object-fit: contain; }
    .empty h2 { margin: 14px 0 0; font-size: 16px; font-weight: 600; line-height: 1.4; letter-spacing: -.015em; }
    .empty p { margin: 6px 0 0; max-width: 390px; color: var(--muted); font-size: 13px; line-height: 1.55; }
    .empty-actions { display: flex; gap: 8px; margin-top: 18px; }
    .canvas-wrap { position: relative; display: none; margin: 72px; border-radius: 8px; background: #d4d4d8; box-shadow: 0 24px 72px rgba(0,0,0,.18); touch-action: none; }
    .canvas-wrap.visible { display: block; }
    .canvas-wrap canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; border-radius: inherit; }
    .annotation-marker {
      position: absolute; z-index: 2; width: 20px; height: 20px; transform: translate(-50%, -50%);
      border: 2px solid #fff; border-radius: 50%; background: var(--selection); box-shadow: 0 1px 5px rgba(0,0,0,.3);
      pointer-events: none;
    }
    .annotation-marker::after { content: ""; position: absolute; inset: 5px; border-radius: 50%; background: #fff; }
    #imageCanvas { position: relative; z-index: 0; }
    #selectionDisplayCanvas { z-index: 1; pointer-events: none; }
    #selectionCanvas { z-index: 2; opacity: 0; cursor: crosshair; }
    #selectionCanvas[data-tool="smart"] { cursor: cell; }
    #selectionCanvas[data-tool="hand"] { cursor: grab; }
    #selectionCanvas[data-tool="hand"].dragging { cursor: grabbing; }
    #selectionCanvas[data-annotation="true"] { cursor: crosshair; }
    .selection-actions {
      position: absolute; z-index: 4; display: flex; height: 36px; align-items: center; gap: 2px; padding: 3px;
      transform: translate(-50%, 8px); border: 1px solid var(--line); border-radius: 9px;
      background: var(--surface-solid); box-shadow: 0 6px 18px rgba(24,24,27,.12);
    }
    .selection-action { display: flex; height: 28px; align-items: center; justify-content: center; gap: 5px; border: 0; border-radius: 6px; background: transparent; padding: 0 8px; color: var(--text); font-size: 12px; white-space: nowrap; }
    .selection-action:hover { background: rgba(127,127,127,.09); }
    .selection-action:disabled, .expand-run:disabled { cursor: not-allowed; opacity: .45; }
    .selection-action .tool-icon { width: 14px; height: 14px; stroke-width: 1.7; }
    .toolbar {
      position: absolute; z-index: 5; top: 14px; left: 50%; transform: translateX(-50%);
      display: none; align-items: center; gap: 3px; max-width: calc(100% - 28px); padding: 5px; overflow-x: auto;
      border: 1px solid var(--line); border-radius: 12px; background: var(--surface);
      box-shadow: 0 10px 30px rgba(0,0,0,.09); backdrop-filter: blur(20px);
      scrollbar-width: none;
    }
    .toolbar::-webkit-scrollbar { display: none; }
    .toolbar.visible { display: flex; }
    .toolbar-row { display: contents; }
    .tool { display: flex; align-items: center; gap: 6px; border: 0; border-radius: 8px; background: transparent; padding: 7px 9px; color: var(--muted); }
    .tool.compact { justify-content: center; width: 32px; height: 32px; padding: 0; flex: 0 0 auto; }
    .tool:hover { color: var(--text); background: rgba(127,127,127,.08); }
    .tool.active { color: var(--accent-text); background: var(--accent); }
    .tool-icon { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.8; }
    .separator { width: 1px; height: 22px; margin: 0 2px; background: var(--line); }
    .operation-switch { display: flex; gap: 2px; padding: 2px; border: 1px solid var(--line); border-radius: 9px; background: rgba(127,127,127,.06); }
    .operation-switch .tool { width: 32px; height: 32px; border-radius: 7px; }
    .capability-switch { display: contents; }
    .zoom-controls {
      position: fixed; z-index: 5; bottom: 16px; left: 16px; display: none; align-items: center; gap: 3px;
      border: 0; background: transparent;
    }
    .zoom-controls.visible { display: flex; }
    .zoom-pill { min-width: 44px; color: var(--muted); text-align: center; font-size: 12px; font-variant-numeric: tabular-nums; }
    .button { display: inline-flex; height: 32px; flex: 0 0 auto; align-items: center; justify-content: center; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-solid); padding: 0 12px; font-size: 12px; font-weight: 500; white-space: nowrap; }
    .button:hover { border-color: var(--line-strong); background: rgba(127,127,127,.06); }
    .button.primary { border-color: var(--accent); background: var(--accent); color: var(--accent-text); }
    .button.primary:hover { opacity: .86; }
    .button.ghost { border-color: transparent; background: transparent; color: var(--muted); }
    .button.ghost:hover { border-color: transparent; background: rgba(127,127,127,.06); color: var(--text); }
    .top-action { display: inline-flex; height: 32px; align-items: center; gap: 6px; flex-shrink: 0; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-solid); padding: 0 10px; color: var(--text); font-size: 12px; }
    #fileInfo{position:absolute;right:16px;bottom:16px;z-index:7;width:32px;height:32px;border:1px solid var(--line);border-radius:8px;background:var(--surface-solid);display:grid;place-items:center} #fileInfo[hidden]{display:none}
    .top-action:hover { background: rgba(127,127,127,.08); }
    .top-action .tool-icon { width: 18px; height: 18px; stroke-width: 2; }
    .button.full { width: 100%; }
    .tool-options-popover {
      position: fixed; z-index: 6; display: grid; width: 236px; gap: 8px; padding: 10px 12px;
      border: 1px solid var(--line); border-radius: 12px; background: var(--surface-solid);
      box-shadow: 0 10px 28px rgba(24,24,27,.1);
    }
    .tool-range { display: grid; grid-template-columns: 34px minmax(0, 1fr) 28px; align-items: center; gap: 8px; color: var(--muted); font-size: 11px; white-space: nowrap; }
    input[type="range"] { width: 100%; height: 16px; margin: 0; appearance: none; background: transparent; }
    input[type="range"]::-webkit-slider-runnable-track { height: 4px; border-radius: 999px; background: rgba(127,127,127,.2); }
    input[type="range"]::-webkit-slider-thumb { width: 8px; height: 16px; margin-top: -6px; appearance: none; border: 0; border-radius: 3px; background: var(--text); }
    .range-value { color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
    .parameter-options { max-height: calc(100vh - 16px); overflow-y: auto; }
    .parameter-options .range-value { width: 28px; padding: 3px 0; border: 1px solid var(--line); border-radius: 5px; background: transparent; text-align: center; appearance: textfield; }
    .parameter-options .range-value::-webkit-inner-spin-button { appearance: none; }
    .parameter-options input:focus-visible, .popover-grip:focus-visible { outline: 2px solid var(--selection); outline-offset: 2px; }
    .popover-grip { grid-column: 1 / -1; display: grid; place-items: center; width: 100%; height: 16px; border: 0; border-radius: 4px; padding: 0; background: transparent; cursor: grab; touch-action: none; }
    .popover-grip::after { content: ""; width: 20px; height: 4px; border-radius: 4px; background: var(--line-strong); }
    .popover-grip:active { cursor: grabbing; }
    .expand-controls { width: 248px; }
    .expand-row { display: grid; grid-template-columns: 42px minmax(0, 1fr); align-items: center; gap: 8px; color: var(--muted); font-size: 11px; }
    .expand-choices { display: flex; gap: 3px; }
    .expand-choices button { flex: 1; height: 28px; border: 0; border-radius: 6px; background: rgba(127,127,127,.07); color: var(--muted); font-size: 11px; }
    .expand-choices button:hover { color: var(--text); background: rgba(127,127,127,.12); }
    .expand-choices button.active { color: var(--accent-text); background: var(--accent); }
    .expand-run { height: 30px; border: 0; border-radius: 7px; background: var(--accent); color: var(--accent-text); font-size: 12px; }
    .instant-tooltip {
      position: fixed; z-index: 30; max-width: 220px; transform: translateX(-50%); border-radius: 6px;
      background: rgba(24,24,27,.94); padding: 4px 7px; color: #fff; font-size: 11px; line-height: 1.35;
      pointer-events: none; white-space: nowrap;
    }
    .annotation-hint {
      position: fixed; z-index: 6; transform: translateX(-50%); border: 1px solid var(--line); border-radius: 8px;
      background: var(--surface-solid); box-shadow: 0 6px 18px rgba(24,24,27,.1); padding: 6px 9px;
      color: var(--muted); font-size: 11px; line-height: 1.35; pointer-events: none; white-space: nowrap;
    }
    .busy-layer { position: absolute; z-index: 8; inset: 0; display: none; place-items: center; background: rgba(244,244,242,.65); backdrop-filter: blur(9px); }
    .busy-layer.visible { display: grid; }
    .save-review { position: absolute; z-index: 6; bottom: 16px; left: 16px; right: 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-solid); box-shadow: var(--shadow); }
    .save-review p { flex: 1 1 180px; min-width: 0; margin: 0; color: var(--muted); overflow-wrap: anywhere; }
    .save-review button:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
    .busy-card { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-solid); box-shadow: var(--shadow); }
    .spinner { width: 16px; height: 16px; border: 2px solid var(--line-strong); border-top-color: var(--text); border-radius: 50%; animation: spin .8s linear infinite; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 760px) {
      .provider { position: relative; height: 32px; padding: 0 10px; border-radius: 8px; background: #f0f0f2; color: #18181b; }
    .provider #modelMenu { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
    .provider:focus-within { outline: 2px solid var(--selection); outline-offset: 3px; border-radius: 8px; }
    .provider #modelMenu:disabled { cursor: wait; }
    .provider-name { display: block; }
      .provider-status { display: none; }
      .top-action { width: 32px; justify-content: center; padding: 0; }
      .top-action span { display: none; }
      .toolbar { top: 14px; left: 14px; max-height: calc(100% - 28px); transform: none; overflow-x: hidden; overflow-y: auto; }
      .toolbar.visible, .toolbar-row { display: flex; width: auto; flex-direction: column; align-items: center; gap: 3px; }
      .toolbar .separator { width: 22px; height: 1px; margin: 2px 0; }
      .operation-switch { flex-direction: column; }
      .tool-options-popover, .expand-controls { width: min(236px, calc(100vw - 92px)); }
      .toolbar-row::-webkit-scrollbar { display: none; }
      .parameter-options { gap: 8px; padding: 6px; }
      #brushOptions { width: 92px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
      #smartOptions { width: 52px; }
      .parameter-options .tool-range { display: flex; min-width: 0; flex-direction: column; gap: 10px; }
      .parameter-options input[type="range"] { writing-mode: vertical-lr; direction: rtl; width: 32px; height: clamp(80px, 24vh, 160px); flex-shrink: 0; cursor: ns-resize; touch-action: none; }
      .parameter-options input[type="range"]::-webkit-slider-runnable-track { width: 4px; height: 100%; }
      .parameter-options input[type="range"]::-webkit-slider-thumb { width: 16px; height: 8px; margin-top: 0; margin-left: -6px; }
      .parameter-options .range-value { width: 36px; }
    }
    @media (max-width: 420px) {
      .topbar { gap: 6px; padding: 0 8px; }
      .mode-switch button { padding-inline: 9px; }
      .button, .top-action { padding-inline: 8px; }
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #151515; --surface: rgba(27,27,28,.82); --surface-solid: #232325; --surface-muted: rgba(35,35,37,.58);
        --text: #f4f4f5; --muted: #a1a1aa; --line: rgba(255,255,255,.1); --line-strong: rgba(255,255,255,.2);
        --accent: #f4f4f5; --accent-text: #18181b; --shadow: 0 20px 60px rgba(0,0,0,.35);
      }
      .busy-layer { background: rgba(21,21,21,.64); }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div id="documentTitle" class="document-title">新图片</div>
      <div id="modeSwitch" class="mode-switch" role="tablist" aria-label="工作模式" hidden>
        <button id="editMode" type="button" role="tab" aria-selected="false" data-i18n="edit">编辑</button>
        <button id="generateMode" class="active" type="button" role="tab" aria-selected="true" data-i18n="generate">生成</button>
      </div>
      <div class="top-actions">
        <button id="topImport" class="top-action" type="button" hidden>
          <svg class="tool-icon" data-lucide="image-plus" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 5h6"/><path d="M19 2v6"/><path d="M21 11.5V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7.5"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/><circle cx="9" cy="9" r="2"/></svg>
          <span data-i18n="replaceImage">替换图片</span>
        </button>
        <button id="downloadImage" class="top-action" type="button" data-tooltip-key="downloadImage" aria-label="下载" hidden>
          <svg class="tool-icon" data-lucide="download" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
          <span data-i18n="downloadImage">下载</span>
        </button>
        <div id="provider" class="provider"><span class="provider-dot"></span><span id="providerName" class="provider-name" data-i18n="model">图片模型</span><span id="providerStatus" class="provider-status" data-i18n="checking">检查中…</span><svg data-lucide="chevron-down" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: 0 0 16px" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg><button id="modelMenu" type="button" aria-label="切换图片模型" aria-haspopup="menu"></button></div>
      </div>
    </header>

    <div class="shell">
      <main class="workspace">
        <div id="stage" class="stage">
          <section id="generationGallery" class="generation-gallery" hidden aria-label="生成图片历史">
            <div class="gallery-sections">
              <section class="gallery-section"><div class="gallery-heading"><h2 class="gallery-title">从产出文件添加</h2><button id="loadOutputImages" class="button ghost" type="button" aria-label="刷新产出图片">刷新</button></div><div id="galleryGrid" class="gallery-grid"></div></section>
            </div>
            <div class="reference-bar">
              <span id="galleryStatus" role="status"></span>
            </div>
          </section>

    async function callService(name, args = {}) {

      if (response?.isError) throw new Error(response.content?.map((item) => item.text || "").join("\n") || tr("failed"));

    function imageProgressPercent() {

      const percent = imageProgressPercent();

    function selectedModel() {

          { name: "set_prompt", description: "Set Image Studio parameters. Style, camera and lighting are prompt guidance. Read the current inspector options for model-specific size/quality; unsupported values are rejected. ChatGPT login only supports prompt-based aspect intent, not native size/quality controls.", inputSchema: { type: "object", properties: { prompt: { type: "string" }, model: { type: "string" }, mode: { type: "string", enum: ["generate", "edit"] }, aiMode: { type: "string", enum: ["inpaint", "expand", "erase"] }, style: { type: "string" }, camera: { type: "string" }, lighting: { type: "string" }, size: { type: "string" }, quality: { type: "string" }, selectionBlend: { type: "string", enum: ["natural", "strict"] } } } },
          { name: "import_reference", description: "Upload a reference image for generation.", inputSchema: { type: "object", properties: { dataUrl: { type: "string" }, filename: { type: "string" } }, required: ["dataUrl", "filename"] } },
          { name: "preview_reference", description: "Read the selected reference thumbnail.", inputSchema: { type: "object", properties: { path: { type: "string" } }, required: ["path"] } },
          { name: "open_image", description: "Open a workspace-relative image in Image Studio.", inputSchema: { type: "object", properties: { sourcePath: { type: "string" } }, required: ["sourcePath"] } },
          { name: "generate_or_edit", description: "Run the current generation or edit after the user has reviewed the prompt and selection.", inputSchema: { type: "object", properties: {} } },
          { name: "clear_selection", description: "Clear the active mask so the next edit applies to the whole image.", inputSchema: { type: "object", properties: {} } },
          { name: "capture_selection", description: "Freeze the exact selected image region for the current conversation without generating an image.", inputSchema: { type: "object", properties: { revision: { type: "number" } } } },
        ] }); return;
      }
      if (message.method === "tools/call") {
        const args = message.params?.arguments || {};
        if (message.params?.name === "capture_selection") {
          void captureSelection(args.revision).then((result) => respond(message.id, { content: [], structuredContent: result }))
            .catch((error) => respond(message.id, { isError: true, content: [{ type: "text", text: error.message }] }));
          return;
        }
        if (message.params?.name === "set_prompt") {
          try { updateParameters(args); respond(message.id, toolResult("Image Studio parameters updated.")); }
          catch (error) { respond(message.id, { isError: true, content: [{ type: "text", text: error.message }] }); }
          return;
        }
        if (message.params?.name === "preview_reference") {
          const entry = state.gallery.find(entry => entry.path === args.path);
          if (!entry) { respond(message.id, { isError: true, content: [{ type: "text", text: "参考图已不可用，请重新选择" }] }); return; }
          const data = entry.thumbnail.split(",")[1];
          const size = atob(data).length;
          respond(message.id, { content: [], structuredContent: { mime: entry.thumbnail.slice(5, entry.thumbnail.indexOf(";")), data, size, nextOffset: size } }); return;
        }
        if (message.params?.name === "import_reference") {
          if (state.busy) { respond(message.id, { isError: true, content: [{ type: "text", text: tr("processing") }] }); return; }
          setBusy(true, tr("importing")); setStatus("");
          void (async () => {
            try { const payload = await callService("import-image", { dataUrl: args.dataUrl, filename: args.filename }); await rememberGalleryImage(payload); state.referencePath = payload.path; respond(message.id, toolResult("Reference image uploaded.")); }
            catch (error) { respond(message.id, { isError: true, content: [{ type: "text", text: error.message }] }); }
            finally { setBusy(false); }
          })(); return;
        }
        if (message.params?.name === "open_image") {
          void loadWorkspaceImage(String(args.sourcePath || "")).then(() => respond(message.id, toolResult("Image opened."))).catch((error) => respond(message.id, { isError: true, content: [{ type: "text", text: error.message }] })); return;
        }
        if (message.params?.name === "generate_or_edit") {
          void run().then((result) => respond(message.id, result.ok
            ? { content: [{ type: "text", text: `Image saved: ${result.path}` }], structuredContent: { path: result.path } }
            : { isError: true, content: [{ type: "text", text: result.message || "Image action failed." }] })); return;
        }
        if (message.params?.name === "clear_selection") { clearSelection(false); respond(message.id, toolResult("Selection cleared.")); return; }
        respond(message.id, { isError: true, content: [{ type: "text", text: "Unknown Image Studio tool." }] }); return;
      }
      if (message.method === "ui/resource-teardown") respond(message.id, {});
      if (message.method === "ui/notifications/host-context-changed") {
        const params = message.params || {};
        const host = params[HOST_CONTEXT_KEY] || params.hostContext?.[HOST_CONTEXT_KEY] || params;
        if (params.theme) document.documentElement.style.colorScheme = params.theme;
        void applyHostContext(host);
      }
    });

    selectionCanvas.addEventListener("pointerdown", (event) => {
      if (state.busy || state.mode !== "edit") return;
      if (state.annotationMode) {
        const point = pointForEvent(event);
        state.annotationPoint = {
          x: Math.max(0, Math.min(1, point.x / selectionCanvas.width)),
          y: Math.max(0, Math.min(1, point.y / selectionCanvas.height)),
        };
        setAnnotationMode(false);
        renderAnnotationMarker();
        emitAiReference(imageReference("point", { point: state.annotationPoint }));
        return;
      }
      if (state.tool === "hand") {
        state.pan = { pointerId: event.pointerId, x: event.clientX, y: event.clientY, left: $("#stage").scrollLeft, top: $("#stage").scrollTop };
        $("#stage").classList.add("panning"); selectionCanvas.classList.add("dragging");
        selectionCanvas.setPointerCapture(event.pointerId);
        return;
      }
      state.annotationPoint = null; renderAnnotationMarker();
      const point = pointForEvent(event);
      state.activeSubtract = state.operation === "subtract" || event.altKey;
      if (state.tool === "smart") {
        snapshotSelection(); smartSelect(point, state.activeSubtract); setStatus(tr("smartSelected"));
        renderSelectionState(); publishContext();
        return;
      }
      $("#selectionActions").hidden = true;
      state.drawing = true; state.moved = false; state.start = state.last = point; state.gestureBase = snapshotSelection();
      selectionCanvas.setPointerCapture(event.pointerId);
      if (state.tool === "brush") { dab(state.start, state.activeSubtract); renderSelectionVisual(); }
    });
    selectionCanvas.addEventListener("pointermove", (event) => {
      if (state.pan?.pointerId === event.pointerId) {
        $("#stage").scrollLeft = state.pan.left - (event.clientX - state.pan.x);
        $("#stage").scrollTop = state.pan.top - (event.clientY - state.pan.y);
        return;
      }
      if (!state.drawing || !state.last) return;
      const point = pointForEvent(event); state.moved = true;
      if (state.tool === "brush") { strokeBetween(state.last, point, state.activeSubtract); renderSelectionVisual(); }
      if ((state.tool === "rectangle" || state.tool === "ellipse") && state.start && state.gestureBase) {
        selectionContext.putImageData(state.gestureBase, 0, 0);
        drawShape(state.start, point, state.tool, state.activeSubtract);
        renderSelectionVisual();
      }
      state.last = point;
    });
    selectionCanvas.addEventListener("pointerup", (event) => {
      if (state.pan?.pointerId === event.pointerId) {
        state.pan = null; $("#stage").classList.remove("panning"); selectionCanvas.classList.remove("dragging");
        return;
      }
      if (!state.drawing) return;
      const point = pointForEvent(event);
      if ((state.tool === "rectangle" || state.tool === "ellipse") && state.start && state.gestureBase) {
        selectionContext.putImageData(state.gestureBase, 0, 0);
        drawShape(state.start, point, state.tool, state.activeSubtract);
      }
      state.drawing = false; state.start = state.last = state.gestureBase = null; renderSelectionState(); publishContext();
    });
    selectionCanvas.addEventListener("pointercancel", () => {
      if (state.pan) { state.pan = null; $("#stage").classList.remove("panning"); selectionCanvas.classList.remove("dragging"); }
      if (state.drawing && state.gestureBase) {
        selectionContext.putImageData(state.gestureBase, 0, 0);
        state.selectionHistory.pop();
      }
      state.drawing = false; state.start = state.last = state.gestureBase = null; renderSelectionState();
    });
    document.querySelectorAll("button[data-tool]").forEach((button) => button.addEventListener("click", () => {
      state.temporaryTool = "";
      selectTool(button.dataset.tool === "hand" && state.tool === "hand" ? state.selectionTool : button.dataset.tool);
    }));
    document.querySelectorAll("[data-ai-mode]").forEach((button) => button.addEventListener("click", () => selectAiMode(button.dataset.aiMode)));
    document.querySelectorAll("[data-operation]").forEach((button) => button.addEventListener("click", () => selectOperation(button.dataset.operation)));
    document.querySelectorAll("[data-expand-direction]").forEach((button) => button.addEventListener("click", () => {
      state.expandDirection = button.dataset.expandDirection;
      document.querySelectorAll("[data-expand-direction]").forEach((candidate) => candidate.classList.toggle("active", candidate === button));
      publishContext();
    }));
    document.querySelectorAll("[data-expand-scale]").forEach((button) => button.addEventListener("click", () => {
      state.expandScale = Number(button.dataset.expandScale);
      document.querySelectorAll("[data-expand-scale]").forEach((candidate) => candidate.classList.toggle("active", candidate === button));
      publishContext();
    }));
    document.querySelectorAll(".popover-grip").forEach((handle) => {
      const popover = handle.parentElement;
      let drag = null;
      const rememberPosition = () => {
        const rect = popover.getBoundingClientRect();
        toolOptionPositions.set(toolOptionsKey(popover), { left: rect.left, top: rect.top });
      };
      handle.addEventListener("pointerdown", (event) => {
        if (event.button !== 0) return;
        const rect = popover.getBoundingClientRect();
        drag = { id: event.pointerId, x: event.clientX - rect.left, y: event.clientY - rect.top };
        handle.setPointerCapture(event.pointerId);
        event.preventDefault();
      });
      handle.addEventListener("pointermove", (event) => {
        if (!drag || drag.id !== event.pointerId) return;
        placeToolOptions(popover, event.clientX - drag.x, event.clientY - drag.y);
        rememberPosition();
      });
      for (const eventName of ["pointerup", "pointercancel", "lostpointercapture"]) {
        handle.addEventListener(eventName, () => { drag = null; });
      }
      handle.addEventListener("keydown", (event) => {
        const delta = { ArrowLeft: [-10, 0], ArrowRight: [10, 0], ArrowUp: [0, -10], ArrowDown: [0, 10] }[event.key];
        if (!delta) return;
        event.preventDefault(); event.stopPropagation();
        const rect = popover.getBoundingClientRect();
        placeToolOptions(popover, rect.left + delta[0], rect.top + delta[1]);
        rememberPosition();
      });
    });
    for (const id of ["brushSize", "hardness"]) {
      const slider = $(`#${id}`);
      const number = $(`#${id}Value`);
      slider.addEventListener("input", () => { number.value = slider.value; });
      number.addEventListener("change", () => {
        if (number.value !== "" && Number.isFinite(number.valueAsNumber)) slider.value = number.value;
        number.value = slider.value;
      });
    }
    $("#tolerance").addEventListener("input", () => { $("#toleranceValue").textContent = $("#tolerance").value; });
    $("#undo").addEventListener("click", undoSelection);
    $("#redo").addEventListener("click", redoSelection);
    $("#selectionClear").addEventListener("click", (event) => { event.stopPropagation(); clearSelection(true); });
    $("#selectionAskAi").addEventListener("click", (event) => { event.stopPropagation(); requestAiAnnotation(); });
    $("#selectionErase").addEventListener("click", (event) => { event.stopPropagation(); void run(); });
    $("#expandRun").addEventListener("click", () => void run());
    $("#askAi").addEventListener("click", requestAiAnnotation);
    $("#zoomIn").addEventListener("click", () => setZoom(currentZoom() + .1));
    $("#zoomOut").addEventListener("click", () => setZoom(currentZoom() - .1));
    document.querySelectorAll("[data-zoom]").forEach((button) => button.addEventListener("click", () => {
      setZoom(fitZoom(), "fit");
    }));
    document.querySelectorAll("[data-tooltip-key]").forEach((button) => {
      button.addEventListener("pointerenter", () => showTooltip(button));
      button.addEventListener("pointerleave", hideTooltip);
      button.addEventListener("focus", () => showTooltip(button));
      button.addEventListener("blur", hideTooltip);
    });
    $("#stage").addEventListener("wheel", (event) => {
      if (!state.imageWidth || (!event.metaKey && !event.ctrlKey)) return;
      event.preventDefault();
      setZoom(currentZoom() + (event.deltaY < 0 ? .1 : -.1));
    }, { passive: false });
    addEventListener("keydown", (event) => {
      const target = event.target;
      const editingText = target instanceof HTMLInputElement || target instanceof HTMLTextAreaElement || target instanceof HTMLSelectElement;
      if (editingText) return;
      const command = event.metaKey || event.ctrlKey;
      if (command && event.key.toLowerCase() === "z") { event.preventDefault(); event.shiftKey ? redoSelection() : undoSelection(); return; }
      if (command && event.key.toLowerCase() === "y") { event.preventDefault(); redoSelection(); return; }
      if (event.code === "Space") {
        event.preventDefault();
        if (!event.repeat && state.tool !== "hand") { state.temporaryTool = state.tool; selectTool("hand"); }
        return;
      }
      if (event.key === "Escape") { hideTooltip(); setAnnotationMode(false); if (state.tool === "hand") { state.temporaryTool = ""; selectTool(state.selectionTool); } return; }
      if (event.key === "0") { setZoom(fitZoom(), "fit"); return; }
      const shortcut = { w: "smart", b: "brush", r: "rectangle", o: "ellipse", h: "hand" }[event.key.toLowerCase()];
      if (shortcut) selectTool(shortcut);
    });
    addEventListener("blur", () => {
      if (!state.temporaryTool) return;
      const tool = state.temporaryTool; state.temporaryTool = ""; selectTool(tool);
    });
    addEventListener("keyup", (event) => {
      if (event.code !== "Space" || !state.temporaryTool) return;
      const tool = state.temporaryTool; state.temporaryTool = ""; selectTool(tool);
    });
    $("#modelMenu").addEventListener("click", () => {
      if (state.busy) return;
      const rect = $("#modelMenu").getBoundingClientRect();
      post({ type: "ipollowork:image-studio:model-menu", value: state.model,
        options: state.models.map(entry => ({ id: entry.id, label: entry.label + (entry.configured ? "" : state.locale === "en" ? " · Not connected" : " · 未连接"), disabled: !entry.available })),
        left: rect.left, top: rect.top, width: rect.width, height: rect.height,
        manageLabel: state.locale === "en" ? "Manage connections…" : "管理连接…" });
    });
    addEventListener("message", event => {
      if (event.source !== parent) return;
      if (event.data?.type === "ipollowork:image-studio:model-menu-closed") { $("#modelMenu").focus(); return; }
      if (event.data?.type !== "ipollowork:image-studio:select-model" || state.busy || typeof event.data.value !== "string") return;
      const previousSize = state.size, previousQuality = state.quality;
      try {
        updateParameters({ model: event.data.value });
        if (previousSize !== state.size || previousQuality !== state.quality) {
          setStatus(state.locale === "en" ? "Output settings adjusted to this model." : "已按所选模型调整画幅或质量设置。");
          state.statusTone = "success";
        }
      } catch (error) { setStatus(error.message, true); }
      $("#modelMenu").focus();
    });
    $("#editMode").addEventListener("click", () => setMode("edit"));
    $("#generateMode").addEventListener("click", () => { setMode("generate"); requestInspector(); });
    $("#overwriteEdit").addEventListener("click", () => void saveEditedResult("overwrite"));
    $("#saveCopy").addEventListener("click", () => void saveEditedResult("copy"));
    $("#cancelOverwrite").addEventListener("click", () => { state.confirmOverwrite = false; renderSaveReview(); });
    $("#emptyGenerate").addEventListener("click", () => { setMode("generate"); requestInspector(); });
    $("#emptyBack").addEventListener("click", () => setMode("start"));
    for (const id of ["emptyImport", "topImport"]) $("#" + id).addEventListener("click", () => $("#fileInput").click());
    $('#fileInfo').onclick=()=>{const m=state.sourceMetadata||{},g=m.generation;const gcd=(a,b)=>b?gcd(b,a%b):a;const divisor=gcd(state.imageWidth,state.imageHeight);post({type:'ipollowork:image-studio:file-info',rows:[{label:'名称',value:state.sourceName},{label:'格式',value:m.mimeType||'图片'},{label:'文件大小',value:typeof m.bytes==='number'?`${(m.bytes/1024/1024).toFixed(2)} MB`:'未知'},{label:'尺寸',value:`${state.imageWidth} × ${state.imageHeight} px`},{label:'比例',value:`${state.imageWidth/divisor}:${state.imageHeight/divisor}`},{label:'生成模型',value:g?.model||'无生成记录'},{label:'生成时间',value:g?.createdAt||'无生成记录'}],prompt:g?.prompt||''});};
    $("#downloadImage").addEventListener("click", downloadCurrentImage);
    $("#fileInput").addEventListener("change", () => void importImage($("#fileInput").files?.[0]));
    addEventListener("resize", () => { applyZoom(); positionToolOptions(); positionAnnotationHint(); });

    selectTool(state.tool);
    selectAiMode(state.aiMode);
    selectOperation(state.operation);

    request("ui/initialize", {
      protocolVersion: "2025-11-21",
      appInfo: { name: "iPolloWork Image Studio", version: "0.1.54" },
      appCapabilities: { tools: {}, availableDisplayModes: ["inline", "fullscreen"] },
    }).then(async (host) => {
      post({ jsonrpc: "2.0", method: "ui/notifications/initialized", params: {} });
      state.locale = String(host.hostContext?.locale || "zh").toLowerCase().startsWith("en") ? "en" : "zh";
      document.documentElement.style.colorScheme = host.hostContext?.theme || "light dark";
      localize(); setStatus("");
      const pluginContext = host.hostContext?.[HOST_CONTEXT_KEY];
      await applyHostContext(pluginContext);
      try {
        const provider = await callService("status", {});
        applyProviderModels(provider);
      } catch { applyProviderModels({ models: [] }); }
      renderProvider();
      post({type:"ipollowork:image-studio:list-images"});
      publishContext();
    }).catch((error) => { setStatus(error.message || tr("failed"), true); });
  </script>
</body>
</html>
