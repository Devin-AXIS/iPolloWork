<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>零工汇</title>
  <style>
    :root { color-scheme: light dark; font: 14px/1.5 system-ui, sans-serif; }
    html, body { height: 100%; margin: 0; }
    body { background: light-dark(#fff, #18181b); color: light-dark(#27272a, #fafafa); }
    iframe { display: block; width: 100%; height: 100%; border: 0; }
    #status { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; padding: 24px; }
    #message { max-width: 360px; }
    button { justify-self: center; padding: 8px 16px; font: inherit; cursor: pointer; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div id="status" role="status"><p id="message">正在打开零工汇…</p><button id="retry" hidden>重试</button></div>
  <iframe id="gig-link" title="零工汇任务列表" referrerpolicy="origin" hidden></iframe>
  <script>
    const TASK_ORIGIN = 'https://giglink.koocoding.com';
    const ACCESS_KEY = 'YUlLTYGV4ICFbcr2';
    const USER_ID = '2ArO9AlHgkZDKr7b';
    const pending = new Map();
    const frame = document.querySelector('#gig-link');
    const status = document.querySelector('#status');
    const message = document.querySelector('#message');
    const retry = document.querySelector('#retry');
    let sequence = 0, disposed = false, opening = false, loadTimer;
    function post(value) { parent.postMessage({ jsonrpc: '2.0', ...value }, '*'); }
    function request(method, params) {
      const id = ++sequence;
      return new Promise((resolve, reject) => {
        const timer = setTimeout(() => { pending.delete(id); reject(new Error('零工汇启动超时，请重试。')); }, 30000);
        pending.set(id, { resolve, reject, timer });
        post({ id, method, params });
      });
    }
    function failed() {
      if (disposed) return;
      clearTimeout(loadTimer);
      frame.hidden = true;
      status.hidden = false;
      message.textContent = '零工汇暂时无法打开，请检查网络后重试。';
      retry.hidden = false;
    }
    function embeddingOrigin() {
      if (window.location.origin !== 'null') return window.location.origin;
      try { return new URL(document.referrer).origin; } catch { return ''; }
    }
    async function open() {
      if (disposed || opening) return;
      opening = true;
      retry.hidden = true;
      status.hidden = false;
      message.textContent = '正在打开零工汇…';
      const url = new URL('/tasks', TASK_ORIGIN);
      url.searchParams.set('parentOrigin', embeddingOrigin());
      clearTimeout(loadTimer);
      loadTimer = setTimeout(failed, 30000);
      frame.src = url.href;
      opening = false;
    }
    frame.addEventListener('load', () => {
      if (disposed || !frame.getAttribute('src')) return;
      clearTimeout(loadTimer);
      frame.hidden = false;
      status.hidden = true;
    });
    frame.addEventListener('error', failed);
    retry.addEventListener('click', open);
    addEventListener('message', (event) => {
      if (event.origin === TASK_ORIGIN && event.source === frame.contentWindow) {
        if (event.data?.type === 'gig-link:ready') {
          frame.contentWindow.postMessage({
            type: 'gig-link:authorize',
            accessKey: ACCESS_KEY,
            userId: USER_ID,
          }, TASK_ORIGIN);
        }
        return;
      }
      if (event.source !== parent || event.data?.jsonrpc !== '2.0') return;
      const data = event.data;
      if (data.id !== undefined && !data.method) {
        const handler = pending.get(data.id);
        if (!handler) return;
        clearTimeout(handler.timer);
        pending.delete(data.id);
        data.error ? handler.reject(new Error('工作台连接失败')) : handler.resolve(data.result);
      } else if (data.method === 'ui/notifications/host-context-changed') {
        if (data.params?.theme) document.documentElement.style.colorScheme = data.params.theme;
      } else if (data.method === 'ui/resource-teardown') {
        disposed = true;
        clearTimeout(loadTimer);
        frame.removeAttribute('src');
        for (const handler of pending.values()) { clearTimeout(handler.timer); handler.reject(new Error('工作台已关闭')); }
        pending.clear();
        post({ id: data.id, result: {} });
      }
    });
    request('ui/initialize', {
      protocolVersion: '2025-11-21', appInfo: { name: 'Gig Link', version: '0.4.19' },
      appCapabilities: { availableDisplayModes: ['inline', 'fullscreen'] },
    }).then((host) => {
      if (disposed) return;
      document.documentElement.style.colorScheme = host.hostContext?.theme || 'light dark';
      post({ method: 'ui/notifications/initialized', params: {} });
      return open();
    }).catch(failed);
  </script>
</body>
</html>
