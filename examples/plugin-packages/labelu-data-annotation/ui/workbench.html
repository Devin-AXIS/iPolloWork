<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>数据标注</title>
  <style>
    :root { color-scheme: light dark; font: 14px/1.5 system-ui, sans-serif; }
    html, body { height: 100%; margin: 0; }
    body { background: light-dark(#fff, #18181b); color: light-dark(#27272a, #fafafa); }
    iframe { display: block; width: 100%; height: 100%; border: 0; }
    #status { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; padding: 24px; }
    button { justify-self: center; padding: 8px 16px; font: inherit; cursor: pointer; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div id="status" role="status"><p id="message">正在打开数据标注…</p><button id="retry" hidden>重试</button></div>
  <iframe id="workbench" title="数据标注平台" referrerpolicy="no-referrer" hidden></iframe>
  <script>
    const pending = new Map();
    const frame = document.querySelector('#workbench');
    const status = document.querySelector('#status');
    const message = document.querySelector('#message');
    const retry = document.querySelector('#retry');
    let sequence = 0, disposed = false, opening = false, loadTimer;
    function post(value) { parent.postMessage({ jsonrpc: '2.0', ...value }, '*'); }
    function request(method, params) {
      const id = ++sequence;
      return new Promise((resolve, reject) => {
        const timer = setTimeout(() => { pending.delete(id); reject(new Error('数据标注启动超时，请重试。')); }, 30000);
        pending.set(id, { resolve, reject, timer });
        post({ id, method, params });
      });
    }
    function failed() {
      if (disposed) return;
      clearTimeout(loadTimer);
      frame.hidden = true;
      status.hidden = false;
      message.textContent = '数据标注暂时无法打开，请重试。';
      retry.hidden = false;
    }
    async function open() {
      if (disposed || opening) return;
      opening = true;
      retry.hidden = true;
      status.hidden = false;
      message.textContent = '正在打开数据标注…';
      try {
        const result = await request('tools/call', { name: 'open-workbench', arguments: {} });
        if (disposed) return;
        if (result.isError || typeof result.structuredContent?.url !== 'string') throw new Error('启动失败');
        const url = new URL(result.structuredContent.url);
        if (url.protocol !== 'http:' || url.hostname !== '127.0.0.1' || url.username || url.password) throw new Error('无效的本地地址');
        clearTimeout(loadTimer);
        loadTimer = setTimeout(failed, 30000);
        frame.src = url.href;
      } catch { failed(); }
      finally { opening = false; }
    }
    frame.addEventListener('load', () => {
      if (disposed || !frame.getAttribute('src')) return;
      clearTimeout(loadTimer);
      frame.hidden = false;
      status.hidden = true;
    });
    frame.addEventListener('error', failed);
    retry.addEventListener('click', open);
    addEventListener('message', (event) => {
      if (event.source !== parent || event.data?.jsonrpc !== '2.0') return;
      const data = event.data;
      if (data.id !== undefined && !data.method) {
        const handler = pending.get(data.id);
        if (!handler) return;
        clearTimeout(handler.timer);
        pending.delete(data.id);
        data.error ? handler.reject(new Error('工作台连接失败')) : handler.resolve(data.result);
      } else if (data.method === 'ui/notifications/host-context-changed') {
        if (data.params?.theme) document.documentElement.style.colorScheme = data.params.theme;
      } else if (data.method === 'ui/resource-teardown') {
        disposed = true;
        clearTimeout(loadTimer);
        frame.removeAttribute('src');
        for (const handler of pending.values()) { clearTimeout(handler.timer); handler.reject(new Error('工作台已关闭')); }
        pending.clear();
        post({ id: data.id, result: {} });
      }
    });
    request('ui/initialize', {
      protocolVersion: '2025-11-21', appInfo: { name: 'Data Annotation', version: '0.3.1' },
      appCapabilities: { availableDisplayModes: ['inline', 'fullscreen'] },
    }).then((host) => {
      if (disposed) return;
      document.documentElement.style.colorScheme = host.hostContext?.theme || 'light dark';
      post({ method: 'ui/notifications/initialized', params: {} });
      return open();
    }).catch(failed);
  </script>
</body>
</html>
