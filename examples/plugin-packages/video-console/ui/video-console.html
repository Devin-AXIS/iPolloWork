    #generationProgress::-webkit-progress-value { background:var(--accent); border-radius:4px; transition:width 1s linear; }

    .toolbar { top:calc(14px + var(--workbench-hint-space, 0px)); }
    .workbench-back { display:inline-flex; align-items:center; gap:6px; height:28px; padding:0 8px; flex-shrink:0; border:0; border-radius:8px; background:transparent; color:var(--text); font-size:12px; }
    .workbench-back svg { width:16px; height:16px; flex-shrink:0; }
    .workbench-hint { position:absolute; z-index:12; top:12px; left:50%; transform:translateX(-50%); width:max-content; max-width:calc(100% - 32px); padding:7px 12px; border:1px solid var(--line); border-radius:10px; background:var(--surface); color:var(--muted); font-size:12px; line-height:1.5; text-align:center; pointer-events:none; }
    .workbench-hint[data-error="true"] { color:var(--danger); }
    html.mac:lang(zh) .workbench-back { font-weight:500; }
    @media(max-width:560px) { .workbench-back span { display:none; } }

    main { position:relative; }
  </style>

    function applyPreview(){if(!state.edit)return;const e=state.edit,p=$('#player'),v=$('#viewport'),b=$('#videoBox'),w=p.videoWidth||state.metadata.width,h=p.videoHeight||state.metadata.height;const cw=w*e.crop.width,ch=h*e.crop.height,turn=e.rotation%180!==0,ow=turn?ch:cw,oh=turn?cw:ch,scale=Math.min(v.clientWidth/ow,v.clientHeight/oh),r=e.rotation*Math.PI/180;let dx=w*(e.crop.x+e.crop.width/2-.5),dy=h*(e.crop.y+e.crop.height/2-.5),rx=(dx*Math.cos(r)-dy*Math.sin(r))*(e.flip?-1:1),ry=dx*Math.sin(r)+dy*Math.cos(r);Object.assign(b.style,{width:`${ow*scale}px`,height:`${oh*scale}px`});Object.assign(p.style,{width:`${w*scale}px`,height:`${h*scale}px`,left:`${ow*scale/2-rx*scale-w*scale/2}px`,top:`${oh*scale/2-ry*scale-h*scale/2}px`,transform:`scaleX(${e.flip?-1:1}) rotate(${e.rotation}deg)`});p.playbackRate=e.speed;p.volume=e.volume;p.muted=e.volume===0;if(p.currentTime<e.start||p.currentTime>e.end)p.currentTime=e.start;updateTime();}

    $('#play').onclick=()=>{const p=$('#player');if(p.paused){if(state.edit&&p.currentTime>=state.edit.end-.05)p.currentTime=state.edit.start;void p.play().catch(e=>tell(e.message,true));}else p.pause();};$('#seek').oninput=e=>{$('#player').currentTime=Number(e.target.value);};
    const resizeObserver=new ResizeObserver(applyPreview);resizeObserver.observe($('#viewport'));
    addEventListener('keydown',e=>{if(e.key==='Escape'){state.tool='';renderEditor();}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&!/INPUT|TEXTAREA/.test(e.target.tagName)){e.preventDefault();tool(e.shiftKey?'redo':'undo');}});
    function canOverwrite(){const launch=state.host.launch;return launch?.intent==='edit-video'&&launch.source?.path===state.previewPath;}

    $('#fileInfo').onclick=()=>{const m=state.metadata;if(!m)return;const g=state.jobs.find(job=>job.path===state.previewPath);const gcd=(a,b)=>b?gcd(b,a%b):a;const divisor=gcd(m.width,m.height);post({type:'ipollowork:video-console:file-info',rows:[{label:'名称',value:state.previewPath.split(/[\\/]/).pop()},{label:'格式',value:state.previewPath.split('.').pop().toUpperCase()},{label:'文件大小',value:typeof m.bytes==='number'?`${(m.bytes/1024/1024).toFixed(2)} MB`:'未知'},{label:'尺寸',value:`${m.width} × ${m.height} px`},{label:'比例',value:`${m.width/divisor}:${m.height/divisor}`},{label:'时长',value:`${m.duration.toFixed(2)} 秒`},{label:'音轨',value:m.hasAudio?'有':'无'},{label:'生成模型',value:g?.model||'无生成记录'},{label:'生成时间',value:g?new Date(g.createdAt).toLocaleString():'无生成记录'}],prompt:g?.prompt||''});};

    async function downloadMedia(kind){
      if(state.busy||!state.edit||!['video','first','last'].includes(kind))return;
      state.busy=true;$('#player').pause();render();tell('正在准备下载…');

        let path=state.previewPath;

          const result=await call('local-edit',{requestId:crypto.randomUUID(),path,revision:state.metadata.revision,mode:'copy',...state.edit});path=result.path;
        }

        let name=stem+(blob.type==='video/quicktime'?'.mov':'.mp4');

          url=URL.createObjectURL(blob);

    }

    $('#openVideo').onclick=$('#importVideo').onclick=()=>{if(!state.busy)$('#videoFile').click();};$('#videoFile').onchange=async()=>{const file=$('#videoFile').files?.[0];$('#videoFile').value='';if(!file)return;if(!/\.(mp4|mov)$/i.test(file.name)||file.size>20*1024*1024){tell('导入支持 20 MB 以内的 MP4 / MOV；工作区已有视频可从素材入口打开。',true);return;}state.busy=true;render();try{const dataUrl=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(new Error(tr("读取失败")));reader.readAsDataURL(file);});const result=await call('import',{filename:file.name,dataUrl});await preview(result.path);}catch(error){tell(error.message,true);}finally{state.busy=false;render();}};
    $('#start').onclick=()=>{mode('generate');openSettings();};
    const toolDefinitions=[{name:"get_parameters",description:"Read selected model, supported operations and current video parameters before editing.",inputSchema:{type:"object",properties:{}}},{name:"get_job_status",description:"Read actual video jobs and output paths; use job id and status to verify submission and completion.",inputSchema:{type:"object",properties:{}}},{name:"set_parameters",description:"Update video parameters and prompt preferences.",inputSchema:{type:"object",properties:{...Object.fromEntries(params.map(key=>[key,{type:"string"}])),...Object.fromEntries(Object.entries(creativeOptions).map(([key,option])=>[key,{type:"string",enum:option.values}]))}}},{name:"generate_or_edit",description:"Generate video directly using the current prompt, references and selected settings.",inputSchema:{type:"object",properties:{}}},{name:"open_video",description:"Preview a workspace video.",inputSchema:{type:"object",properties:{path:{type:"string"}},required:["path"]}}];
    toolDefinitions.push({name:"import_media",description:"Import a user-selected file into the matching video parameter.",inputSchema:{type:"object",properties:{fieldId:{type:"string",enum:["firstFrame","lastFrame","imageRefs","videoRefs","audioRefs"]},filename:{type:"string"},dataUrl:{type:"string"}},required:["fieldId","filename","dataUrl"]}},{name:"read_media",description:"Read a selected frame image for preview.",inputSchema:{type:"object",properties:{path:{type:"string"},offset:{type:"number"}},required:["path"]}});
