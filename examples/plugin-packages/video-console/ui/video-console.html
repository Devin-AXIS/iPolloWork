<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>视频工作台</title>
  <style>
    :root { color-scheme:light dark; --bg:light-dark(#f4f4f2,#171819); --surface:light-dark(#fff,#202224); --text:light-dark(#202225,#f4f4f4); --muted:light-dark(#71717a,#a1a1aa); --line:light-dark(#e4e4e7,#37383b); --accent:light-dark(#1c2023,#ededee); --on-accent:light-dark(#fff,#171819); --danger:light-dark(#be2542,#ff8598); font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif; }
    * { box-sizing:border-box; } body { margin:0; color:var(--text); background:var(--bg); } button,input,select { font:inherit; } button { cursor:pointer; color:var(--text); border:1px solid var(--line); border-radius:9px; background:var(--surface); padding:7px 12px; } button:disabled { cursor:not-allowed; opacity:.45; } button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible { outline:2px solid #6290cf; outline-offset:3px; } button:hover:not(:disabled) { filter:brightness(.96); } .primary { background:var(--accent); color:var(--on-accent); border-color:var(--accent); }
    header { position:sticky; top:0; z-index:1; display:flex; gap:12px; align-items:center; justify-content:space-between; padding:12px 16px; background:var(--surface); border-bottom:1px solid var(--line); } nav { display:flex; gap:3px; padding:3px; border:1px solid var(--line); border-radius:11px; background:var(--bg); } nav button { border-color:transparent; background:transparent; padding:4px 14px; } nav button[aria-pressed="true"] { background:var(--surface); border-color:var(--line); } .tools { display:flex; align-items:center; gap:8px; } main { margin:0; } .preview { display:grid;place-items:center; }  .empty { text-align:center; max-width:420px; padding:26px; } .empty svg { width:40px; height:40px; stroke:var(--muted); margin-bottom:12px; } h1 { font-size:20px; margin:0 0 8px; letter-spacing:-.4px; } h2 { font-size:13px; margin:0; } p { margin:0; } .muted { color:var(--muted); }
    .row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; } input,select { min-width:0; color:var(--text); background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:8px 10px; } input { flex:1; } #message { margin:0; font-size:12px; white-space:pre-wrap; } #activity{display:flex;align-items:center;gap:12px;padding:8px 16px;border-top:1px solid var(--line);background:var(--surface)} #activity[hidden]{display:none} #activity span{flex:1} #recover{flex-shrink:0} dialog::backdrop{background:#0005} #message.error { color:var(--danger); } [hidden] { display:none !important; }
    @media(prefers-reduced-motion:reduce) { * { scroll-behavior:auto !important; } }
    body {height:100vh;overflow:hidden;background:var(--surface)} header{height:58px;position:relative;z-index:5} .brand{font-weight:650;white-space:nowrap} main{height:calc(100vh - 58px);max-width:none;padding:0;position:relative;display:flex;flex-direction:column}
    .preview{flex:1;min-height:0;height:auto;border:0;border-radius:0;position:relative;background:radial-gradient(var(--line) .8px,transparent .8px) 0 0/20px 20px;overflow:hidden}.preview video{background:transparent;max-width:none}.viewport{position:absolute;inset:80px 28px 30px;display:grid;place-items:center;overflow:hidden} .video-box{position:relative;overflow:hidden;box-shadow:0 4px 20px #0002;background:#101113}.video-box video{position:absolute;object-fit:fill;transform-origin:center}
    .toolbar{position:absolute;z-index:3;top:18px;left:50%;transform:translateX(-50%);display:flex;gap:4px;max-width:calc(100% - 24px);padding:6px;border:1px solid var(--line);border-radius:12px;background:var(--surface);box-shadow:0 3px 15px #0001}.tool{display:grid;place-items:center;padding:7px;width:32px;height:32px;border:0;background:transparent;flex-shrink:0}.tool svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.tool[aria-pressed=true]{background:var(--accent);color:var(--on-accent)}.separator{border-left:1px solid var(--line);margin:4px}
    .popover{position:absolute;z-index:4;top:74px;left:50%;transform:translateX(-50%);padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);box-shadow:0 6px 24px #0002;width:min(340px,calc(100% - 24px))}.popover h2{margin-bottom:10px}.popover label{display:flex;align-items:center;gap:10px;margin:8px 0}.popover label input{width:70px}.popover input[type=range]{padding:0}.popover select{flex:1}.popover p{font-size:11px;color:var(--muted)}
    .timeline{padding:12px 20px;border-top:1px solid var(--line);background:var(--surface)}.timeline .row{flex-wrap:nowrap}.timeline input[type=range]{padding:0;accent-color:var(--accent)}.time{font-size:11px;min-width:95px;font-variant-numeric:tabular-nums}.savebar{display:flex;align-items:center;gap:8px;justify-content:flex-end}.savebar .muted{margin-right:auto;font-size:11px}#tooltip{position:fixed;z-index:20;padding:6px 9px;border-radius:6px;background:var(--accent);color:var(--on-accent);font-size:11px;pointer-events:none;white-space:nowrap} .empty{z-index:1} .empty button{margin:18px 4px 0}
    @media(max-width:560px){header{padding:8px;gap:6px}.brand{font-size:12px}.tools{gap:4px}.toolbar{gap:1px;padding:4px}.tool{width:28px}.viewport{inset:75px 12px 20px}.timeline{padding:10px}.savebar .muted{display:none}nav button{padding:4px 9px}.popover{top:65px}}
  </style>
</head>
<body>
  <header>
    <span class="brand">视频工作台</span><nav aria-label="视频操作"><button id="editMode" aria-pressed="true">编辑</button><button id="generateMode" aria-pressed="false">生成</button></nav>
    <div class="tools"><button id="openVideo">打开视频</button><button id="settings">AI 参数</button></div>
  </header>
  <main>
    <section class="preview" aria-label="视频预览">
      <div class="viewport" id="viewport" hidden><div class="video-box" id="videoBox"><video id="player" playsinline preload="metadata"></video></div></div>
      <div id="toolbar" class="toolbar" role="toolbar" aria-label="视频编辑工具栏" hidden></div>
      <section id="toolPanel" class="popover" aria-label="工具参数" hidden></section>
      <div id="empty" class="empty">
        <svg viewBox="0 0 40 40" fill="none" stroke-width="1.5" aria-hidden="true"><rect x="4" y="8" width="23" height="24" rx="6"/><path d="m27 16 9-5v18l-9-5M13 15l8 5-8 5z"/></svg>
        <h1>打开视频，开始编辑</h1><p class="muted">用工具栏剪辑、裁切、旋转、变速和调整音量；需要改变内容时再使用 AI。</p>
        <button id="importVideo" class="primary">导入视频</button><button id="start">AI 生成视频</button>
      </div>
    </section>
    <div id="activity" hidden><span id="message" role="status" aria-live="polite"></span><button id="recover" hidden>恢复查询</button></div>
    <section id="timeline" class="timeline" aria-label="视频时间轴" hidden>
      <div class="row"><button id="play" aria-label="播放 / 暂停">播放</button><input id="seek" type="range" min="0" max="1" step="0.01" value="0" aria-label="播放位置"><output id="time" class="time"></output></div>
      <div class="savebar"><span id="editHint" class="muted">原视频不会随预览变化，保存后才会应用。</span><button id="overwrite">覆盖原视频</button><button id="saveCopy" class="primary">另存为</button><button id="useVersion" hidden>使用此版本</button></div>
    </section>
    <input id="videoFile" type="file" accept=".mp4,.mov" hidden aria-label="导入视频"><div id="tooltip" role="tooltip" hidden></div>
    <dialog id="confirmOverwrite" style="max-width:360px;border:1px solid var(--line);border-radius:14px;padding:22px;background:var(--surface);color:var(--text)"><h2>覆盖原视频？</h2><p style="margin:12px 0">保存成功后，引用当前文件的 Design / Video Studio 素材也会更新。此操作不能通过剪辑撤销恢复。</p><div class="row"><button id="cancelOverwrite">取消</button><button id="confirmSave" class="primary">确认覆盖</button></div></dialog>
    <dialog id="recoverDialog"><form method="dialog"><h2>查询已提交的 AI 任务</h2><p>不会再次提交生成。若提交时连接中断，请填写服务商后台的任务 ID。</p><label>任务 ID <input id="upstreamId" required maxlength="200"></label><div class="row"><button value="cancel" formnovalidate>取消</button><button value="recover" class="primary">恢复查询</button></div></form></dialog>
  </main>
  <script>
    const $ = selector => document.querySelector(selector);
    const HOST = "ai.ipollo/workspace", INSPECTOR = "ai.ipollo/inspector";
    const pending = new Map(); let requestId = 0, pollTimer, disposed = false, previewUrl = "", previewEpoch = 0;
    const state = { mode:"edit", ai:false, model:"", operation:"text", prompt:"", resolution:"", duration:"5", ratio:"adaptive", firstFrame:"", lastFrame:"", imageRefs:"", videoRefs:"", audioRefs:"", generateAudio:"true", watermark:"true", models:[], ratios:[], jobs:[], host:{}, busy:false, message:"", error:false, requestKey:"", openRequest:"", localVideoReady:false, previewPath:"", metadata:null, edit:null, undo:[], redo:[], tool:"", saveId:"", saveMode:"", activeJobId:"" };
    const names = { text:"文生视频", first:"首帧生视频", "first-last":"首尾帧生视频", reference:"多模态参考", edit:"编辑原视频", extend:"延长原视频", regenerate:"参考原视频重新生成" };
    const editOps = ["edit","extend","regenerate"];
    const refOps = ["reference",...editOps];
    const params = ["model","operation","prompt","resolution","duration","ratio","firstFrame","lastFrame","imageRefs","videoRefs","audioRefs","generateAudio","watermark"];
    const creativeOptions = {
      style:{label:"风格",values:["自动","史诗电影","写实纪实","国风水墨","二维动画","三维动画","油画质感","复古胶片","赛博朋克"]},
      camera:{label:"镜头",values:["自动","固定镜头","缓慢推进","跟随主体","环绕镜头","航拍远景","低机位仰拍","特写"]},
      lighting:{label:"光线",values:["自动","自然日光","金色夕阳","电影逆光","柔和漫射光","夜景霓虹","戏剧性明暗"]},
      pace:{label:"节奏",values:["自动","舒缓","自然流畅","紧张快速","史诗庄重"]},
    };
    for(const key of Object.keys(creativeOptions))state[key]="自动";
    function post(message) { parent.postMessage(message,"*"); }
    function request(method, params) {
      const id = ++requestId;
      return new Promise((resolve,reject) => {
        const timer = setTimeout(() => { pending.delete(id); reject(new Error("操作超时；若已提交生成，请先刷新任务状态，勿重复提交。")); },180000);
        pending.set(id,{resolve,reject,timer}); post({jsonrpc:"2.0",id,method,params});
      });
    }
    async function call(name, args={}) {
      const response = await request("tools/call",{name,arguments:args});
      if(response?.isError) throw new Error(response.content?.map(item=>item.text||"").join("\n")||"视频操作失败。");
      return response?.structuredContent || {};
    }
    function tell(message,error=false) { state.message=message; state.error=error; $("#message").textContent=message; $("#activity").hidden=!message; $("#message").classList.toggle("error",error); publish(); }
    function model() { return state.models.find(item=>item.id===state.model); }
    function promptSignature() {return JSON.stringify([...params.map(key=>state[key]),...Object.keys(creativeOptions).map(key=>state[key])]);}
    function allowedOps() { return (model()?.operations||[]).filter(op=>editOps.includes(op)===(state.mode==="edit"&&state.ai)); }
    function allowedRatios() { return ["first","first-last","edit","extend"].includes(state.operation)?["adaptive"]:(model()?.ratios||state.ratios); }
    function normalized() {
      const changed=[]; const set=(key,value)=>{if(state[key]!==value){state[key]=value;changed.push(key);}};
      if(!model()) set("model",state.models[0]?.id||"");
      const current=model(); if(!current) return changed;
      if(state.ai&&!current.operations.some(op=>editOps.includes(op)))set("ai",false);
      if(!allowedOps().includes(state.operation)) set("operation",allowedOps()[0]);
      if(!current.resolutions.includes(state.resolution)) set("resolution",current.defaultResolution);
      if(!current.durations.includes(state.duration)) set("duration","5");
      if(state.operation==="edit") set("duration","-1");
      if(!allowedRatios().includes(state.ratio)) set("ratio",allowedRatios()[0]);
      if(!["first","first-last"].includes(state.operation)) set("firstFrame","");
      if(state.operation!=="first-last") set("lastFrame","");
      if(!refOps.includes(state.operation)) for(const field of ["imageRefs","videoRefs","audioRefs"])set(field,"");
      for(const [field,limit] of [["imageRefs",current.imageLimit],["videoRefs",current.videoLimit],["audioRefs",current.audioLimit]]) {
        if(state[field].split(/\n/).filter(Boolean).length>limit)set(field,"");
      }
      return changed;
    }
    function update(args) {
      for(const [key,option] of Object.entries(creativeOptions))if(option.values.includes(args[key]))state[key]=args[key];
      for(const key of params) if(typeof args[key]==="string")state[key]=args[key];
      const changed=normalized();
      if(state.expansion&&state.expansion.signature!==promptSignature())state.expansion=null;
      if(changed.length)tell("");
      render(); publish();
    }
    function mode(value) { state.mode=value;state.ai=false;state.tool="";normalized();render();publish(); }
    function select(id,label,values,advanced=false) { return {id,label,control:"select",value:state[id],live:true,advanced,options:values.map(value=>typeof value==="string"?{value,label:value}:value)}; }
    function textarea(id,label,placeholder) { return {id,label,control:"textarea",value:state[id],placeholder,live:true}; }
    function mediaField(id,label,kind,control="textarea") { return {id,label,control,value:state[id],live:true,placeholder:"每行一个链接 / 工作区路径",media:{kind,importTool:"import_media",...(control==="image"?{readTool:"read_media"}:{})}}; }
    function publish() {
      if(disposed)return;
      if(state.mode==="edit"&&!state.ai){void request("ui/update-model-context",{content:[{type:"text",text:"视频工作台：本地工具栏编辑，不调用 AI。"}],structuredContent:{}}).catch(()=>{});return;}
      const current=model();
      const fields=[select("model","视频模型",state.models.map(item=>({value:item.id,label:item.label})))];
      if(current) {
        fields.push(select("operation","生成方式",allowedOps().map(value=>({value,label:names[value]}))),textarea("prompt",state.mode==="edit"?"编辑指令":"视频描述",state.operation==="extend"?"向后延长 @video1，描述接下来发生的情节…":state.operation==="edit"?"修改 @video1 的背景为…":"场景、主体动作、镜头运动、声音…"));
        for(const [key,option] of Object.entries(creativeOptions))fields.push(select(key,option.label,option.values));
        if(["first","first-last"].includes(state.operation))fields.push(mediaField("firstFrame","首帧图片","image","image"));
        if(state.operation==="first-last")fields.push(mediaField("lastFrame","尾帧图片","image","image"));
        if(refOps.includes(state.operation))fields.push(mediaField("imageRefs",`参考图片 · 最多 ${current.imageLimit} 张`,"image"),mediaField("videoRefs",`${state.mode==="edit"?"原视频 / ":""}参考视频 · 最多 ${current.videoLimit} 个`,"video"),mediaField("audioRefs",`参考音频 · 最多 ${current.audioLimit} 个`,"audio"));
        fields.push(select("resolution","分辨率",current.resolutions),select("duration",state.operation==="extend"?"生成时长（秒）":"时长（秒）",(state.operation==="edit"?["-1"]:current.durations).map(value=>({value,label:value==="-1"?(state.operation==="edit"?"跟随原视频":"自动"):value}))),select("ratio","画幅",allowedRatios().map(value=>({value,label:value==="adaptive"?"自适应 / 跟随输入":value}))));
        if(current.id==="seedance-2.5")fields.push(select("generateAudio","同步生成声音",[{value:"true",label:"开启"},{value:"false",label:"关闭"}],true));
        if(current.id==="seedance-2.5")fields.push(select("watermark","AI 生成水印",[{value:"true",label:"保留"},{value:"false",label:"不显示"}],true));
      }
      const notice=!current?"请在设置 → 授权中心绑定火山引擎 Ark 或 RunningHub。模型授权不代表账户一定有调用权限或足够余额。":current.id==="minimax-h3"?"H3 原生工作流：文生、首帧、首尾帧。使用普通工作流密钥；0.5MP / 1MP 为像素总量，画幅对齐 32 像素，时长按 24fps 帧网格取整。包含声音，不提供声音或水印开关。云端排队和生成可能需要数分钟，按 RunningHub 用量计费。":state.operation==="edit"?"Seedance 编辑：原视频 4–30 秒，画幅与时长跟随输入。指令需明确增加、删除或修改的内容。":"生成按服务商实际用量计费。结果另存到本会话产出，不覆盖原视频。";
      void request("ui/update-model-context",{content:[{type:"text",text:`视频工作台：${state.mode}；模型 ${current?.label||"未绑定"}；任务属于当前会话。风格、镜头、光线、节奏是提示词偏好，不是模型原生参数。`}],structuredContent:{[INSPECTOR]:{schemaVersion:1,title:"视频参数",description:notice,advancedLabel:"高级参数",updateTool:"set_parameters",submitTool:"generate_or_edit",submitLabel:state.busy?"处理中…":state.preparedPrompt===promptSignature()?"确认描述并生成":"用当前会话 AI 扩写",submitDisabled:state.busy||!current||!state.host.sessionId,...(state.openRequest?{openRequestId:state.openRequest}:{}),fields,status:{message:state.message||"风格、镜头、光线、节奏用于 AI 扩写；确认描述后才会生成视频。",tone:state.error?"error":"info"}}}}).catch(()=>{});
    }
    function render() {
      $("#generateMode").setAttribute("aria-pressed",String(state.mode==="generate")); $("#editMode").setAttribute("aria-pressed",String(state.mode==="edit"));
      $("#generateMode").disabled=$("#editMode").disabled=state.busy;
      renderEditor();
    }
    async function refresh() {
      const response=await call("status"); state.models=response.models||[]; state.ratios=response.ratios||[]; state.localVideoReady=response.localVideoReady===true; state.statusLoaded=true;
      normalized(); if(!$('#toolPanel').contains(document.activeElement))render(); publish();
      await applyLaunch();
      const result=await call("jobs"); state.jobs=result.jobs||[];
      if(!state.jobsLoaded){state.jobsLoaded=true;state.activeJobId||=state.jobs.find(job=>!["failed","succeeded"].includes(job.status))?.id||"";}
      const current=state.jobs.find(job=>job.id===state.activeJobId);
      $('#recover').hidden=!current||!["uncertain","save_failed"].includes(current.status);
      if(current){tell(current.message,["failed","uncertain","save_failed"].includes(current.status));if(current.status==="failed")state.activeJobId="";if(current.status==="succeeded"&&current.path&&state.autoPreviewPath!==current.path){state.autoPreviewPath=current.path;if(state.undo.length){state.generatedPath=current.path;tell('AI 结果已保存到本会话产出；当前未保存的剪辑已保留。');}else{await preview(current.path);state.generatedPath=current.path;}state.activeJobId="";render();}}
    }
    function node(tag,text,className="") {const element=document.createElement(tag); element.textContent=text; element.className=className; return element;}
    function button(text,action) {const element=node("button",text); element.addEventListener("click",()=>{void Promise.resolve().then(action).catch(error=>tell(error.message,true));});return element;}
    async function preview(path,{preserveMode=false}={}) {
      const epoch=++previewEpoch;const chunks=[];let offset=0,mime="video/mp4";
      tell("正在加载预览…");
      while(!disposed&&epoch===previewEpoch) {
        const part=await call("read",{path,offset});
        if(!part.mime?.startsWith("video/"))throw new Error("请选择 MP4 或 MOV 视频。");
        if(part.size>100*1024*1024)throw new Error("视频超过 100 MB，请从会话产出文件中打开查看。");
        if(part.nextOffset<=offset&&offset<part.size)throw new Error("视频读取中断，请重新打开。");
        chunks.push(Uint8Array.from(atob(part.data),c=>c.charCodeAt(0)));offset=part.nextOffset;mime=part.mime;
        if(offset>=part.size)break;
      }
      if(disposed||epoch!==previewEpoch)return;
      if(previewUrl)URL.revokeObjectURL(previewUrl);previewUrl=URL.createObjectURL(new Blob(chunks,{type:mime}));
      $("#player").src=previewUrl;$("#viewport").hidden=false;$("#empty").hidden=true;state.previewPath=path;
      state.metadata=null;state.edit=null;state.undo=[];state.redo=[];state.saveId="";state.saveMode="";state.generatedPath="";state.tool="";if(!preserveMode){state.mode="edit";state.ai=false;}render();
      try{const metadata=await call("inspect",{path});if(disposed||epoch!==previewEpoch)return;state.metadata=metadata;state.edit=defaults();render();tell("");}catch(error){if(!disposed&&epoch===previewEpoch)tell(error.message,true);}
    }
    function useSource(path) {
      const editable=state.models.find(item=>item.operations.some(op=>editOps.includes(op)));
      if(!model()?.operations.some(op=>editOps.includes(op))) {
        if(!editable){tell("AI 内容编辑需要支持编辑原视频的模型，请在授权中心绑定 Seedance。常规剪辑可直接使用工具栏。",true);return;}
        state.model=editable.id;
      }
      state.mode="edit";state.ai=true;normalized();state.videoRefs=path;state.openRequest=crypto.randomUUID();render();publish();
    }
    async function applyLaunch() {
      const launch=state.host.launch;
      const key=launch?.requestId||launch?.source?.path;
      if(!state.statusLoaded||launch?.intent!=="edit-video"||!launch.source?.path||state.appliedLaunch===key)return;
      state.appliedLaunch=key;
      await preview(launch.source.path);
    }
    async function run() {
      if(state.busy)return;
      if(!state.prompt.trim())throw new Error("请先填写视频描述或编辑指令。");
      if(!state.host.sessionId)throw new Error("请先打开一个会话，再生成视频。");
      if(state.preparedPrompt!==promptSignature()){
        if(state.expansion&&Date.now()-state.expansion.startedAt<300000)throw new Error("当前会话 AI 正在扩写，请等待回填；修改描述或参数可以取消本次等待。");
        const expansion={id:crypto.randomUUID(),signature:promptSignature(),startedAt:Date.now()};
        state.expansion=expansion;state.busy=true;render();tell("已请求当前会话 AI 扩写，尚未提交视频生成…");
