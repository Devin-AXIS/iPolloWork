minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - "@opencode-ai/sdk"
  - "@opencode-ai/plugin"

# macOS release jobs build both Apple Silicon and Intel installers on the
# same runner. Keep both optional native packages available so electron-builder
# can place the binary that matches the installer target into the app bundle.
supportedArchitectures:
  os:
    - current
  cpu:
    - x64
    - arm64

packages:
  - "apps/*"
  - "packages/*"
  - "examples/plugin-packages/labelu-data-annotation"
  - "examples/plugin-packages/short-video-studio"

catalog:
  react: 19.2.4
  react-dom: 19.2.4

linkWorkspacePackages: true
preferWorkspacePackages: true
# OXC's WASM binding uses stable emnapi 1.x. wasm-runtime 1.2 requires
# incompatible emnapi 2.x prereleases; keep its supported stable runtime line.
overrides:
  "@oxc-parser/binding-wasm32-wasi>@napi-rs/wasm-runtime": 1.1.6
allowBuilds:
  onnxruntime-node: true
  "@ffmpeg-installer/darwin-arm64": true
  "@ffmpeg-installer/darwin-x64": true
  "@ffmpeg-installer/linux-arm64": true
  "@ffmpeg-installer/linux-x64": true
  "@ffprobe-installer/darwin-arm64": true
  "@ffprobe-installer/darwin-x64": true
  "@ffprobe-installer/linux-arm64": true
  "@ffprobe-installer/linux-x64": true
  "@whiskeysockets/baileys": true
  better-sqlite3: true
  canvas: false
  core-js: true
  electron: true
  esbuild: true
  lefthook: true
  msgpackr-extract: false
  msw: false
  node-pty: true
  protobufjs: true
  sharp: true

# electron/osx-sign 1.3.1 walks every bundled file with unbounded parallel I/O.
# The bundled DeepSeek Harness runtime is large enough to exhaust macOS file
# descriptors during release signing, so keep filesystem reads bounded.
patchedDependencies:
  "@electron/osx-sign@1.3.1": patches/@electron__osx-sign@1.3.1.patch
