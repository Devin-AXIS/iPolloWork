<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Waterfall</title>
<link rel="stylesheet" href="shared.css">
<style data-layout-styles="waterfall">.ipw-video-waterfall{display:grid;grid-template-rows:auto 1fr;gap:8%}.ipw-video-waterfall .chart{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:3%;align-items:end;position:relative;padding:0 2% 64px;border-bottom:3px solid var(--ipw-color-border)}.ipw-video-waterfall .bar{position:relative;min-height:120px;display:flex;align-items:flex-start;justify-content:center;padding-top:20px;color:var(--ipw-color-on-primary);background:var(--ipw-color-primary);font-size:26px}.ipw-video-waterfall .bar:nth-child(2),.ipw-video-waterfall .bar:nth-child(3),.ipw-video-waterfall .bar:nth-child(4){background:var(--ipw-color-muted);align-self:center;height:55%;transform:translateY(20%)}.ipw-video-waterfall .bar:last-child{height:78%;background:var(--ipw-color-primary)}.ipw-video-waterfall .label{position:absolute;bottom:-52px;left:0;right:0;color:var(--ipw-color-muted);font-size:20px;text-align:center;letter-spacing:.08em}.ipw-video-waterfall .bridge{position:absolute;top:49%;height:3px;background:var(--ipw-color-border);width:5%;transform:translateX(50%)}.ipw-video-waterfall .b1{left:21%}.ipw-video-waterfall .b2{left:41%}.ipw-video-waterfall .b3{left:61%}.ipw-video-waterfall .b4{left:81%}.ipw-video-waterfall .result{grid-column:1/-1;text-align:right;color:var(--ipw-color-primary);font-size:32px}</style></head><body>
<aside data-layout-preview-only>Waterfall — static scene-body preview. No timeline, duration or audio is included.</aside>
<template data-ipw-layout="waterfall" data-layout-description="A baseline changes through several contributing factors to a final result." data-layout-capacity="One baseline, up to three changes and one final metric.">
<div class="ipw-video-layout ipw-video-waterfall"><h2 data-slot="title">Show where the change comes from.</h2><div class="chart"><div class="bar" data-slot="baseline"><span data-slot="baseline-value">100</span><span class="label" data-slot="baseline-label">BASELINE</span></div><div class="bar" data-slot="change-1"><span data-slot="change-1-value">−18</span><span class="label" data-slot="change-1-label">INPUT</span></div><div class="bar" data-slot="change-2"><span data-slot="change-2-value">−12</span><span class="label" data-slot="change-2-label">PROCESS</span></div><div class="bar" data-slot="change-3"><span data-slot="change-3-value">−9</span><span class="label" data-slot="change-3-label">REWORK</span></div><div class="bar" data-slot="result"><span data-slot="result-value">61</span><span class="label" data-slot="result-label">NEW STATE</span></div><i class="bridge b1"></i><i class="bridge b2"></i><i class="bridge b3"></i><i class="bridge b4"></i><p class="result" data-slot="caption">The final state is explained by the steps between.</p></div></div>
</template><main data-layout-preview-only></main><script data-layout-preview-only>document.querySelector('main').append(document.querySelector('template').content.cloneNode(true));</script></body></html>
