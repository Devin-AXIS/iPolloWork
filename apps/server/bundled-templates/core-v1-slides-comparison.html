<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>iPolloWork · Comparison layout</title><link rel="stylesheet" href="shared.css"></head><body><main>
<section class="ipw-layout-comparison" data-ipw-slide="1" data-title="对比" data-layout="comparison" data-layout-description="Two alternatives compared on two or three shared criteria, plus one takeaway. Remove unused criteria or split dense evidence.">
<h2 data-pptx-text data-slot="title">按同一组标准，看清两种选择</h2>
<div class="comparison-row comparison-heading" data-pptx-shape="rect"><span data-pptx-text>比较维度</span><p data-pptx-text data-slot="option-a">方案 A</p><p data-pptx-text data-slot="option-b">方案 B</p></div>
<div class="comparison-row" data-pptx-shape="rect"><p data-pptx-text data-slot="criterion-1">投入</p><p data-pptx-text data-slot="a-1">填写真实投入条件</p><p data-pptx-text data-slot="b-1">填写对应投入条件</p></div>
<div class="comparison-row" data-pptx-shape="rect"><p data-pptx-text data-slot="criterion-2">使用</p><p data-pptx-text data-slot="a-2">填写使用方式</p><p data-pptx-text data-slot="b-2">填写对应使用方式</p></div>
<div class="comparison-row" data-pptx-shape="rect"><p data-pptx-text data-slot="criterion-3">维护</p><p data-pptx-text data-slot="a-3">填写维护责任</p><p data-pptx-text data-slot="b-3">填写对应维护责任</p></div>
<p class="comparison-note" data-pptx-text data-slot="takeaway">用一句话说明选择条件；未知事实保留为待确认。</p>
</section></main></body></html>
