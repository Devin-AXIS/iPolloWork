<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Core site focused CTA</title><link rel="stylesheet" href="shared.css"><style data-layout-styles="focused-cta">.ipw-site-focused-cta{display:flex;align-items:center;justify-content:space-between;gap:28px;padding:clamp(36px,6vw,64px) var(--ipw-page-padding);background:var(--ipw-color-primary);color:var(--ipw-color-on-primary)}.ipw-site-focused-cta h2{margin:0 0 10px;font-size:clamp(28px,4vw,50px);line-height:1.08}.ipw-site-focused-cta p{max-width:58ch;margin:0;line-height:1.6;opacity:.82}.ipw-site-focused-cta a{display:inline-flex;padding:12px 20px;border-radius:var(--ipw-button-radius);background:var(--ipw-color-on-primary);color:var(--ipw-color-primary);text-decoration:none;font-weight:700}@media(max-width:620px){.ipw-site-focused-cta{display:block}.ipw-site-focused-cta a{margin-top:22px}}</style></head><body><aside data-layout-preview-only>One clear next action after context has been established.</aside><template data-ipw-layout="focused-cta" data-layout-description="A final action band with one concise next step." data-layout-capacity="One title, short explanation and one action."><section class="ipw-site-focused-cta" id="cta"><div><h2 data-slot="title">Ready for the next step?</h2><p data-slot="description">State what happens after the action.</p></div><a href="#start" data-slot="action">Continue</a></section></template><main data-layout-preview-only></main><script data-layout-preview-only>document.querySelector('main').append(document.querySelector('template').content.cloneNode(true))</script></body></html>
