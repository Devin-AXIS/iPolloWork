<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Core site hero</title><link rel="stylesheet" href="shared.css"><style data-layout-styles="hero">.ipw-site-hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,.9fr);gap:clamp(28px,6vw,80px);align-items:center;padding:clamp(48px,8vw,112px) var(--ipw-page-padding);background:var(--ipw-color-bg)}.ipw-site-hero h1{margin:0 0 20px;font-size:clamp(42px,6vw,76px);line-height:1.02}.ipw-site-hero p{max-width:58ch;margin:0 0 28px;color:var(--ipw-color-muted);font-size:clamp(17px,2vw,21px);line-height:1.55}.ipw-site-hero .actions{display:flex;flex-wrap:wrap;gap:12px}.ipw-site-hero figure{min-height:280px;margin:0;border:1px solid var(--ipw-color-border);border-radius:var(--ipw-card-radius);background:var(--ipw-color-surface);overflow:hidden}.ipw-site-hero img{display:block;width:100%;height:100%;min-height:280px;object-fit:cover}@media(max-width:760px){.ipw-site-hero{grid-template-columns:1fr}.ipw-site-hero figure,.ipw-site-hero img{min-height:220px}}</style></head><body><aside data-layout-preview-only>One proposition, short support copy, actions and one visual.</aside><template data-ipw-layout="hero" data-layout-description="A proposition with supporting visual evidence." data-layout-capacity="One title, one paragraph, one or two actions, one visual."><section class="ipw-site-hero" id="hero"><div><p data-slot="eyebrow">A clear signal</p><h1 data-slot="title">Make the next step obvious.</h1><p data-slot="description">Explain the outcome and give the reader a reason to continue.</p><div class="actions"><a href="#next" data-slot="primary-action">Get started</a><a href="#details" data-slot="secondary-action">Learn more</a></div></div><figure><img src="assets/placeholder.jpg" alt="Replace with a relevant visual" data-slot="image"></figure></section></template><main data-layout-preview-only></main><script data-layout-preview-only>document.querySelector('main').append(document.querySelector('template').content.cloneNode(true))</script></body></html>
