<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Core site feature grid</title><link rel="stylesheet" href="shared.css"><style data-layout-styles="feature-grid">.ipw-site-feature-grid{padding:clamp(48px,8vw,96px) var(--ipw-page-padding);background:var(--ipw-color-bg)}.ipw-site-feature-grid header{max-width:680px;margin-bottom:36px}.ipw-site-feature-grid h2{margin:0 0 12px;font-size:clamp(32px,4vw,54px);line-height:1.08}.ipw-site-feature-grid header p{margin:0;color:var(--ipw-color-muted);font-size:18px}.ipw-site-feature-grid ul{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:0;padding:0;list-style:none}.ipw-site-feature-grid li{padding:24px;border:1px solid var(--ipw-color-border);border-radius:var(--ipw-card-radius);background:var(--ipw-color-surface)}.ipw-site-feature-grid h3{margin:0 0 10px;font-size:22px}.ipw-site-feature-grid li p{margin:0;color:var(--ipw-color-muted);line-height:1.6}@media(max-width:820px){.ipw-site-feature-grid ul{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){.ipw-site-feature-grid ul{grid-template-columns:1fr}}</style></head><body><aside data-layout-preview-only>Three to six peer capabilities or benefits.</aside><template data-ipw-layout="feature-grid" data-layout-description="A parallel grid for peer capabilities or benefits." data-layout-capacity="Three to six short items with title and description."><section class="ipw-site-feature-grid" id="features"><header><p data-slot="eyebrow">What it enables</p><h2 data-slot="title">Useful capabilities, clearly grouped.</h2><p data-slot="description">Give each peer item a distinct job.</p></header><ul><li><h3 data-slot="item-title">One capability</h3><p data-slot="item-description">Describe its specific value.</p></li><li><h3 data-slot="item-title">Another capability</h3><p data-slot="item-description">Connect it to the user's task.</p></li><li><h3 data-slot="item-title">A third capability</h3><p data-slot="item-description">Keep the benefit verifiable.</p></li></ul></section></template><main data-layout-preview-only></main><script data-layout-preview-only>document.querySelector('main').append(document.querySelector('template').content.cloneNode(true))</script></body></html>
