<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Relationship map</title>
<link rel="stylesheet" href="shared.css">
<style data-layout-styles="relationship-map">.ipw-video-map{display:grid;grid-template-columns:.82fr 1.18fr;gap:8%;align-items:center}.ipw-video-map .copy{display:grid;gap:24px}.ipw-video-map .map{position:relative;aspect-ratio:1.3;border:2px solid var(--ipw-color-border);padding:8%;display:grid;place-items:center}.ipw-video-map .map:before,.ipw-video-map .map:after{content:"";position:absolute;background:var(--ipw-color-primary);transform-origin:left center;height:3px;width:38%;left:31%;top:50%}.ipw-video-map .map:before{transform:rotate(-30deg)}.ipw-video-map .map:after{transform:rotate(30deg)}.ipw-video-map .nodes{position:relative;z-index:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4%;align-items:center;width:100%}.ipw-video-map .node{aspect-ratio:1;border:3px solid var(--ipw-color-primary);border-radius:50%;display:grid;place-items:center;text-align:center;padding:12px;font-size:24px;background:var(--ipw-color-bg)}.ipw-video-map .node:nth-child(2){transform:translateY(-24%)}.ipw-video-map .map-caption{position:absolute;bottom:7%;left:8%;right:8%;font-size:24px;color:var(--ipw-color-muted);text-align:center}</style></head><body>
<aside data-layout-preview-only>Relationship map — static scene-body preview. No timeline, duration or audio is included.</aside>
<template data-ipw-layout="relationship-map" data-layout-description="Three related factors converge on a shared outcome." data-layout-capacity="A short title, three nodes and one relationship statement.">
<div class="ipw-video-layout ipw-video-map"><div class="copy"><p class="eyebrow" data-slot="eyebrow">CONTEXT</p><h2 data-slot="title">Show how the pieces connect.</h2><p data-slot="body">Use one visual relationship to explain why the outcome follows.</p></div><div class="map"><div class="nodes"><div class="node" data-slot="node-1">Input</div><div class="node" data-slot="node-2">Shared<br>condition</div><div class="node" data-slot="node-3">Outcome</div></div><p class="map-caption" data-slot="caption">Three inputs reinforce one clear result.</p></div></div>
</template><main data-layout-preview-only></main><script data-layout-preview-only>document.querySelector('main').append(document.querySelector('template').content.cloneNode(true));</script></body></html>
