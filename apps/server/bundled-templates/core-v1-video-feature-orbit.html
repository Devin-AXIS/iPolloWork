<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Feature orbit</title>
<link rel="stylesheet" href="shared.css">
<style data-layout-styles="feature-orbit">.ipw-video-orbit{display:grid;grid-template-columns:.72fr 1.28fr;gap:8%;align-items:center}.ipw-video-orbit .copy{display:grid;gap:24px}.ipw-video-orbit .orbit{position:relative;aspect-ratio:1.2;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4%;align-items:center}.ipw-video-orbit .orbit:before,.ipw-video-orbit .orbit:after{content:"";position:absolute;border:2px solid var(--ipw-color-border);border-radius:50%;inset:10% 8%;transform:rotate(-12deg)}.ipw-video-orbit .orbit:after{inset:22% 20%;transform:rotate(22deg);border-color:var(--ipw-color-primary)}.ipw-video-orbit .card{position:relative;z-index:1;border:2px solid var(--ipw-color-border);background:var(--ipw-color-surface);padding:24px 20px;min-height:220px}.ipw-video-orbit .card:nth-child(2){transform:translateY(-16%)}.ipw-video-orbit .card:nth-child(3){transform:translateY(12%)}.ipw-video-orbit .card strong{display:block;font-size:28px;color:var(--ipw-color-primary);margin-bottom:20px}.ipw-video-orbit .card p{font-size:24px}</style></head><body>
<aside data-layout-preview-only>Feature orbit — static scene-body preview. No timeline, duration or audio is included.</aside>
<template data-ipw-layout="feature-orbit" data-layout-description="Several capabilities orbit one central promise." data-layout-capacity="Three concise capability cards and one shared promise.">
<div class="ipw-video-layout ipw-video-orbit"><div class="copy"><p class="eyebrow" data-slot="eyebrow">CAPABILITIES</p><h2 data-slot="title">Turn a feature set into one story.</h2><p data-slot="body">Keep each capability distinct while showing the promise they share.</p></div><div class="orbit"><article class="card" data-slot="feature-1"><strong data-slot="feature-1-title">Capture</strong><p data-slot="feature-1-body">Make the important signal visible.</p></article><article class="card" data-slot="feature-2"><strong data-slot="feature-2-title">Coordinate</strong><p data-slot="feature-2-body">Keep the next handoff clear.</p></article><article class="card" data-slot="feature-3"><strong data-slot="feature-3-title">Deliver</strong><p data-slot="feature-3-body">Close with a result people can use.</p></article></div></div>
</template><main data-layout-preview-only></main><script data-layout-preview-only>document.querySelector('main').append(document.querySelector('template').content.cloneNode(true));</script></body></html>
