<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Core site evidence pair</title><link rel="stylesheet" href="shared.css"><style data-layout-styles="evidence-pair">.ipw-site-evidence-pair{padding:clamp(48px,8vw,96px) var(--ipw-page-padding);background:var(--ipw-color-surface)}.ipw-site-evidence-pair h2{margin:0 0 30px;font-size:clamp(32px,4vw,54px);line-height:1.08}.ipw-site-evidence-pair ul{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin:0;padding:0;list-style:none}.ipw-site-evidence-pair li{padding:26px;border-left:3px solid var(--ipw-color-primary);background:var(--ipw-color-bg)}.ipw-site-evidence-pair blockquote{margin:0 0 18px;font:500 clamp(19px,2vw,26px)/1.35 var(--ipw-font-display)}.ipw-site-evidence-pair cite{color:var(--ipw-color-muted);font-style:normal}.ipw-site-evidence-pair p{margin:8px 0 0;color:var(--ipw-color-muted)}@media(max-width:680px){.ipw-site-evidence-pair ul{grid-template-columns:1fr}}</style></head><body><aside data-layout-preview-only>Use only for real attributed evidence; omit when no source exists.</aside><template data-ipw-layout="evidence-pair" data-layout-description="Two attributed proof points or case evidence items." data-layout-capacity="Two sourced items with statement, attribution and optional context."><section class="ipw-site-evidence-pair" id="evidence"><h2 data-slot="title">Proof that helps people decide.</h2><ul><li><blockquote data-slot="quote">Use a real source-backed statement.</blockquote><cite data-slot="source">Source, role</cite><p data-slot="context">Qualification or context.</p></li><li><blockquote data-slot="quote">A second independent point.</blockquote><cite data-slot="source">Source, role</cite><p data-slot="context">Keep conditions with the claim.</p></li></ul></section></template><main data-layout-preview-only></main><script data-layout-preview-only>document.querySelector('main').append(document.querySelector('template').content.cloneNode(true))</script></body></html>
