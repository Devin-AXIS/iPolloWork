<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Core site step sequence</title><link rel="stylesheet" href="shared.css"><style data-layout-styles="step-sequence">.ipw-site-step-sequence{padding:clamp(48px,8vw,96px) var(--ipw-page-padding);background:var(--ipw-color-bg)}.ipw-site-step-sequence h2{margin:0 0 32px;font-size:clamp(32px,4vw,54px);line-height:1.08}.ipw-site-step-sequence ol{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px;margin:0;padding:0;list-style:none;counter-reset:step}.ipw-site-step-sequence li{border-top:2px solid var(--ipw-color-primary);padding-top:14px;counter-increment:step}.ipw-site-step-sequence li::before{content:counter(step,decimal-leading-zero);color:var(--ipw-color-primary);font-weight:700}.ipw-site-step-sequence h3{margin:14px 0 8px;font-size:22px}.ipw-site-step-sequence p{margin:0;color:var(--ipw-color-muted);line-height:1.6}@media(max-width:700px){.ipw-site-step-sequence ol{grid-template-columns:1fr;gap:22px}}</style></head><body><aside data-layout-preview-only>An ordered process with three to five steps.</aside><template data-ipw-layout="step-sequence" data-layout-description="An ordered process that preserves step numbers and reading order." data-layout-capacity="Three to five steps with title and explanation."><section class="ipw-site-step-sequence" id="steps"><h2 data-slot="title">A process people can follow.</h2><ol><li><h3 data-slot="step-title">Prepare</h3><p data-slot="step-description">Name the input and condition.</p></li><li><h3 data-slot="step-title">Act</h3><p data-slot="step-description">Describe the operation and feedback.</p></li><li><h3 data-slot="step-title">Confirm</h3><p data-slot="step-description">Show how completion is known.</p></li></ol></section></template><main data-layout-preview-only></main><script data-layout-preview-only>document.querySelector('main').append(document.querySelector('template').content.cloneNode(true))</script></body></html>
