<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>iPolloWork · Parallel principles layout</title><link rel="stylesheet" href="shared.css"></head><body><main>
<section class="ipw-layout-parallel-principles" data-ipw-slide="1" data-title="并列原则" data-layout="parallel-principles" data-layout-description="Two or three peer principles, each with a short heading and one supporting paragraph. Reduce to two columns or split when capacity is exceeded.">
<h2 data-pptx-text data-slot="title">让三项原则，共同支持一个方向</h2><div class="principles-grid">
<article class="principle" data-pptx-shape="rect"><p class="layout-label" data-pptx-text data-slot="label-1">01</p><h3 data-pptx-text data-slot="heading-1">清晰</h3><p data-pptx-text data-slot="body-1">用具体语言说明核心原则，并给出与它直接相关的依据。</p></article>
<article class="principle" data-pptx-shape="rect"><p class="layout-label" data-pptx-text data-slot="label-2">02</p><h3 data-pptx-text data-slot="heading-2">一致</h3><p data-pptx-text data-slot="body-2">采用相同层级和比较尺度，让读者看清各项内容的关系。</p></article>
<article class="principle" data-pptx-shape="rect"><p class="layout-label" data-pptx-text data-slot="label-3">03</p><h3 data-pptx-text data-slot="heading-3">可行动</h3><p data-pptx-text data-slot="body-3">说明原则如何影响实际选择，不用抽象口号代替具体内容。</p></article>
</div></section></main></body></html>
