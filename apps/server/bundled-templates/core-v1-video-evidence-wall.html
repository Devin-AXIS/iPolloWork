<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Evidence wall</title>
<link rel="stylesheet" href="shared.css">
<style data-layout-styles="evidence-wall">.ipw-video-evidence{display:grid;grid-template-rows:auto 1fr;gap:8%}.ipw-video-evidence .wall{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3%;align-items:stretch}.ipw-video-evidence article{border:2px solid var(--ipw-color-border);padding:28px 26px;display:flex;flex-direction:column;justify-content:space-between;min-height:300px;background:var(--ipw-color-surface)}.ipw-video-evidence article:nth-child(2){transform:translateY(8%)}.ipw-video-evidence article:nth-child(3){transform:translateY(-4%)}.ipw-video-evidence article:nth-child(4){transform:translateY(12%);border-color:var(--ipw-color-primary)}.ipw-video-evidence .source{font-size:22px;letter-spacing:.08em;color:var(--ipw-color-primary)}.ipw-video-evidence h3{margin:28px 0 18px}.ipw-video-evidence p{font-size:26px}.ipw-video-evidence .finding{grid-column:1/-1;font-size:30px;color:var(--ipw-color-primary);border-top:3px solid var(--ipw-color-primary);padding-top:22px}</style></head><body>
<aside data-layout-preview-only>Evidence wall — static scene-body preview. No timeline, duration or audio is included.</aside>
<template data-ipw-layout="evidence-wall" data-layout-description="Several attributed observations converge on one finding." data-layout-capacity="Three or four short evidence cards and one synthesis line.">
<div class="ipw-video-layout ipw-video-evidence"><h2 data-slot="title">Let the evidence build the case.</h2><div class="wall"><article><span class="source" data-slot="source-1">SOURCE 01</span><h3 data-slot="heading-1">Observed behavior</h3><p data-slot="body-1">A concrete observation that anchors the story.</p></article><article><span class="source" data-slot="source-2">SOURCE 02</span><h3 data-slot="heading-2">Recorded signal</h3><p data-slot="body-2">A second piece of evidence using the same lens.</p></article><article><span class="source" data-slot="source-3">SOURCE 03</span><h3 data-slot="heading-3">Measured outcome</h3><p data-slot="body-3">A result that makes the pattern visible.</p></article><article><span class="source" data-slot="source-4">FINDING</span><h3 data-slot="heading-4">One useful conclusion</h3><p data-slot="body-4">Translate the evidence into a decision.</p></article><p class="finding" data-slot="finding">The sources point to one action the viewer can take next.</p></div></div>
</template><main data-layout-preview-only></main><script data-layout-preview-only>document.querySelector('main').append(document.querySelector('template').content.cloneNode(true));</script></body></html>
