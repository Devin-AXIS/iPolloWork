<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Checkpoint</title>
<link rel="stylesheet" href="shared.css">
<style data-layout-styles="checkpoint">.ipw-video-checkpoint{display:grid;grid-template-rows:auto 1fr;gap:8%}.ipw-video-checkpoint .checkpoint{display:grid;grid-template-columns:1fr auto 1fr;gap:5%;align-items:center}.ipw-video-checkpoint .state{border:2px solid var(--ipw-color-border);padding:38px 34px;min-height:260px;display:flex;flex-direction:column;justify-content:space-between}.ipw-video-checkpoint .state.active{border-color:var(--ipw-color-primary);background:var(--ipw-color-primary);color:var(--ipw-color-on-primary)}.ipw-video-checkpoint .state small{font-size:22px;letter-spacing:.1em;color:var(--ipw-color-muted)}.ipw-video-checkpoint .active small{color:inherit;opacity:.75}.ipw-video-checkpoint h3{margin:22px 0}.ipw-video-checkpoint p{font-size:26px}.ipw-video-checkpoint .gate{width:170px;height:170px;border:3px solid var(--ipw-color-primary);border-radius:50%;display:grid;place-items:center;text-align:center;font-size:24px;line-height:1.2;padding:20px}.ipw-video-checkpoint .note{font-size:28px;color:var(--ipw-color-primary);text-align:center}</style></head><body>
<aside data-layout-preview-only>Checkpoint — static scene-body preview. No timeline, duration or audio is included.</aside>
<template data-ipw-layout="checkpoint" data-layout-description="A process pauses at a human or policy decision before continuing." data-layout-capacity="Two states, one checkpoint label and a short decision note.">
<div class="ipw-video-layout ipw-video-checkpoint"><h2 data-slot="title">Make the decision point explicit.</h2><div class="checkpoint"><article class="state" data-slot="before"><small data-slot="before-label">BEFORE</small><h3 data-slot="before-title">Prepare</h3><p data-slot="before-body">The system gathers context and proposes the next action.</p></article><div class="gate" data-slot="gate">CHECK<br>POINT</div><article class="state active" data-slot="after"><small data-slot="after-label">AFTER</small><h3 data-slot="after-title">Proceed</h3><p data-slot="after-body">A clear approval or correction sends the process forward.</p></article></div><p class="note" data-slot="note">The viewer always knows who decides next.</p></div>
</template><main data-layout-preview-only></main><script data-layout-preview-only>document.querySelector('main').append(document.querySelector('template').content.cloneNode(true));</script></body></html>
