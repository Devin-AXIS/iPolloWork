<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Core site plan comparison</title><link rel="stylesheet" href="shared.css"><style data-layout-styles="plan-comparison">.ipw-site-plan-comparison{padding:clamp(48px,8vw,96px) var(--ipw-page-padding);background:var(--ipw-color-bg)}.ipw-site-plan-comparison h2{margin:0 0 28px;font-size:clamp(32px,4vw,54px);line-height:1.08}.ipw-site-plan-comparison .plans{display:grid;grid-template-columns:repeat(3,minmax(220px,1fr));gap:14px}.ipw-site-plan-comparison article{padding:24px;border:1px solid var(--ipw-color-border);border-radius:var(--ipw-card-radius);background:var(--ipw-color-surface)}.ipw-site-plan-comparison h3{margin:0 0 12px;font-size:22px}.ipw-site-plan-comparison .price{font:600 28px/1.1 var(--ipw-font-display)}.ipw-site-plan-comparison ul{margin:20px 0 0;padding-left:20px;color:var(--ipw-color-muted);line-height:1.7}.ipw-site-plan-comparison a{display:inline-flex;margin-top:20px}.ipw-site-plan-comparison article[data-featured=true]{border-color:var(--ipw-color-primary)}@media(max-width:760px){.ipw-site-plan-comparison .plans{grid-template-columns:1fr}}</style></head><body><aside data-layout-preview-only>Use only when options share comparable, verified criteria.</aside><template data-ipw-layout="plan-comparison" data-layout-description="Comparable options with shared criteria and one optional featured plan." data-layout-capacity="Two to four options with title, price or label, criteria and action."><section class="ipw-site-plan-comparison" id="plans"><h2 data-slot="title">Choose the right level of support.</h2><div class="plans"><article data-featured="true"><h3 data-slot="plan-name">Core</h3><p class="price" data-slot="plan-price">Verified label</p><ul><li data-slot="plan-criterion">Criterion one</li><li data-slot="plan-criterion">Criterion two</li></ul><a href="#contact" data-slot="plan-action">Choose Core</a></article><article><h3 data-slot="plan-name">Plus</h3><p class="price" data-slot="plan-price">Verified label</p><ul><li data-slot="plan-criterion">Criterion one</li><li data-slot="plan-criterion">Criterion two</li></ul><a href="#contact" data-slot="plan-action">Choose Plus</a></article></div></section></template><main data-layout-preview-only></main><script data-layout-preview-only>document.querySelector('main').append(document.querySelector('template').content.cloneNode(true))</script></body></html>
