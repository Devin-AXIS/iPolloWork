<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Timeline</title>
<link rel="stylesheet" href="shared.css">
<style data-layout-styles="timeline">.ipw-video-timeline{display:grid;grid-template-rows:auto 1fr;gap:10%}.ipw-video-timeline .rail{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3%;align-items:start;padding-top:32px}.ipw-video-timeline .rail:before{content:"";position:absolute;left:2%;right:2%;top:48px;height:3px;background:var(--ipw-color-border)}.ipw-video-timeline article{position:relative;z-index:1;background:var(--ipw-color-bg);border-top:3px solid var(--ipw-color-primary);padding-top:26px}.ipw-video-timeline .time{display:block;font-size:24px;color:var(--ipw-color-primary);letter-spacing:.08em;margin-bottom:22px}.ipw-video-timeline h3{margin-bottom:18px}.ipw-video-timeline p{font-size:26px}.ipw-video-timeline .end{grid-column:1/-1;font-size:30px;color:var(--ipw-color-primary);text-align:right;border-bottom:2px solid var(--ipw-color-primary);padding-bottom:20px}</style></head><body>
<aside data-layout-preview-only>Timeline — static scene-body preview. No timeline, duration or audio is included.</aside>
<template data-ipw-layout="timeline" data-layout-description="A sequence of milestones arranged on one visual rail." data-layout-capacity="Three or four milestones with short labels and one closing state.">
<div class="ipw-video-layout ipw-video-timeline"><h2 data-slot="title">Make the journey visible at a glance.</h2><div class="rail"><article><span class="time" data-slot="time-1">01</span><h3 data-slot="heading-1">Start</h3><p data-slot="body-1">Name the first condition or trigger.</p></article><article><span class="time" data-slot="time-2">02</span><h3 data-slot="heading-2">Build</h3><p data-slot="body-2">Show the change that moves the story forward.</p></article><article><span class="time" data-slot="time-3">03</span><h3 data-slot="heading-3">Test</h3><p data-slot="body-3">Make the proof or checkpoint concrete.</p></article><article><span class="time" data-slot="time-4">04</span><h3 data-slot="heading-4">Arrive</h3><p data-slot="body-4">Close on the resulting state.</p></article><p class="end" data-slot="end">A clear sequence creates momentum.</p></div></div>
</template><main data-layout-preview-only></main><script data-layout-preview-only>document.querySelector('main').append(document.querySelector('template').content.cloneNode(true));</script></body></html>
