# IMPORTANT: appId intentionally matches the Tauri shell so both builds share
# the same macOS bundle identifier, keychain entries, Launchpad slot, and TCC
# permissions. In-place migration from Tauri to Electron depends on this.
appId: com.differentai.ipollowork
productName: iPollo
protocols:
  - name: iPolloWork
    schemes:
      - ipollowork
directories:
  output: dist-electron
files:
  - electron/**/*
  - server/**/*
  - "!{electron,server}/**/*.{test,spec}.*"
  - "!{electron,server}/**/{tests,__tests__,__fixtures__,__mocks__}{,/**/*}"
  # Template installation copies real directories from extraResources.
  # Exclude the staged copy from app.asar to avoid shipping it twice.
  - "!server/dist/bundled-templates/**"
  - "!server/dist/opencode-plugins/**"
  - package.json
extraResources:
  - from: ../server/models
    to: video-models
  - from: video-codecs
    to: video-codecs
  - from: ../../examples/plugin-packages/figma
    to: plugin-packages/figma
    filter: &runtimeFiles
      - "**/*"
      - "!**/*.{test,spec}.*"
      - "!**/{tests,__tests__,__fixtures__,__mocks__}{,/**/*}"
  - from: ../../examples/plugin-packages/notion
    to: plugin-packages/notion
    filter: *runtimeFiles
  - from: ../../examples/plugin-packages/linear
    to: plugin-packages/linear
    filter: *runtimeFiles
  - from: ../../examples/plugin-packages/sentry
    to: plugin-packages/sentry
    filter: *runtimeFiles
  - from: ../../examples/plugin-packages/stripe
    to: plugin-packages/stripe
    filter: *runtimeFiles
  - from: ../../examples/plugin-packages/context7
    to: plugin-packages/context7
    filter: *runtimeFiles
  - from: ../../examples/plugin-packages/github
    to: plugin-packages/github
    filter: *runtimeFiles
  - from: ../../examples/plugin-packages/wechat-official
    to: plugin-packages/wechat-official
    filter: *runtimeFiles
  - from: ../../examples/plugin-packages/xiaohongshu-ops
    to: plugin-packages/xiaohongshu-ops
    filter:
      - "ipollowork.plugin.json"
      - "LICENSE"
      - "LICENSES/**/*"
      - "service/**/*"
      - "skills/**/*"
      - "!**/*.{test,spec}.*"
      - "!**/{tests,__tests__,__fixtures__,__mocks__}{,/**/*}"
      - "!skills/**/node_modules/**/*"
      - "!skills/**/app/data/**/*"
      - "!skills/**/app/dist/**/*"
  - from: ../../examples/plugin-packages/douyin-ops
    to: plugin-packages/douyin-ops
    filter:
      - "ipollowork.plugin.json"
      - "LICENSE"
      - "LICENSES/**/*"
      - "service/**/*"
      - "skills/**/*"
      - "ui/**/*"
      - "!**/*.{test,spec}.*"
      - "!**/{tests,__tests__,__fixtures__,__mocks__}{,/**/*}"
      - "!**/node_modules/**/*"
  - from: ../../examples/plugin-packages/wechat-channels-ops
    to: plugin-packages/wechat-channels-ops
    filter:
      - "ipollowork.plugin.json"
      - "LICENSE"
      - "LICENSES/**/*"
      - "service/**/*"
      - "skills/**/*"
      - "ui/**/*"
      - "!**/*.{test,spec}.*"
      - "!**/{tests,__tests__,__fixtures__,__mocks__}{,/**/*}"
      - "!**/node_modules/**/*"
  - from: ../../examples/plugin-packages/design-agent
    to: plugin-packages/design-agent
    filter: *runtimeFiles
  - from: ../../examples/plugin-packages/reference-context
    to: plugin-packages/reference-context
    filter: *runtimeFiles
  - from: ../../examples/plugin-packages/video-agent
    to: plugin-packages/video-agent
    filter: *runtimeFiles
  - from: ../../examples/plugin-packages/media-studio
    to: plugin-packages/media-studio
    filter: *runtimeFiles
  - from: ../../examples/plugin-packages/deepseek-harness
    to: plugin-packages/deepseek-harness
    filter: *runtimeFiles
  - from: ../../examples/plugin-packages/operation-recorder/dist/package
    to: plugin-packages/operation-recorder
    filter:
      - "ipollowork.plugin.json"
      - "service/**/*"
      - "skills/**/*"
      - "ui/**/*"
      - "native/**/*"
      - "!**/*.{test,spec}.*"
      - "!**/{tests,__tests__,__fixtures__,__mocks__}{,/**/*}"
      - "!**/node_modules/**/*"
  - from: ../../examples/plugin-packages/labelu-data-annotation/dist/package
    to: plugin-packages/labelu-data-annotation
    filter: *runtimeFiles
  - from: ../../examples/plugin-packages/short-video-studio/dist/package
    to: plugin-packages/short-video-studio
    filter: *runtimeFiles
  - from: ../../examples/plugin-packages/jev-decision-model
    to: plugin-packages/jev-decision-model
    filter:
      - "ipollowork.plugin.json"
      - "service/**/*"
      - "skills/**/*"
      - "ui/**/*"
      - "assets/**/*"
      - "!**/*.{test,spec}.*"
      - "!**/{tests,__tests__,__fixtures__,__mocks__}{,/**/*}"
      - "!**/node_modules/**/*"
  - from: ../../examples/plugin-packages/ipollo-onto
    to: plugin-packages/ipollo-onto
    filter:
      - "ipollowork.plugin.json"
      - "service/**/*"
      - "skills/**/*"
      - "ui/**/*"
      - "assets/**/*"
      - "!**/*.{test,spec}.*"
      - "!**/{tests,__tests__,__fixtures__,__mocks__}{,/**/*}"
      - "!**/node_modules/**/*"
  # Templates are installed by copying their full directory into the local
  # library. Electron's virtual ASAR filesystem can read them but Node cannot
  # recursively copy an ASAR directory on macOS, so keep these assets real.
  - from: ../server/dist/bundled-templates
    to: server/dist/bundled-templates
    filter:
      - "**/*"
      # These generated archives duplicate the directories and are not used
      # by the bundled-template loader.
      - "!**/*.ipwp"
  - from: ../app/dist
    to: app-dist
  - from: server/dist/opencode-plugins
    to: opencode-plugins
    filter: *runtimeFiles
  - from: server/dist/opencode-runtime
    to: opencode-runtime
    filter: *runtimeFiles
  - from: ../../packages/docs
    to: ipollowork-docs
    filter:
      - "**/*.md"
      - "**/*.mdx"
      - "docs.json"
  - from: hyperframes-runtime
    to: hyperframes
    filter:
      - "**/*"
      - "!**/*.{test,spec}.*"
      - "!**/{tests,__tests__,__fixtures__,__mocks__}{,/**/*}"
      - "!**/*.map"
      - "!node_modules/.bun/**/node_modules/.bin/**"
  - from: ../../vendor/hyperframes/registry
    to: hyperframes/registry
    filter: *runtimeFiles
asar: true
asarUnpack:
  - "**/node_modules/onnxruntime-node/**/*"
  - "**/node_modules/sharp/**/*"
  - "**/node_modules/@img/**/*"
  - node_modules/.pnpm/@lydell+node-pty*/**
  - node_modules/node-pty/**
npmRebuild: false
afterPack: scripts/electron-after-pack.cjs
afterSign: scripts/electron-after-sign.cjs
# electron-updater feed. The public GitHub Release carries the platform
# manifests consumed by the Electron desktop clients.
publish:
  - provider: github
    owner: Devin-AXIS
    repo: iPolloWork
    releaseType: release
mac:
  icon: resources/icons/mac/icon.icns
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  # Notarization is performed by scripts/electron-after-sign.cjs so it can use
  # the App Store Connect API-key flow consistently for local releases and CI.
  notarize: false
  signIgnore:
    - "\\.(?:png|jpe?g|webp|gif|svg|ico|icns|pak|html?|css|mjs|js|cjs|json|map|txt|mdx?|woff2?|ttf|otf|pdf|ipwp|ipwt)$"
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: iPolloWork uses the microphone when you start Voice Mode so you can speak commands to your agent.
  extraResources:
    - from: resources/icons/mac
      to: icons/mac
      filter:
        - icon.icns
    - from: resources/sidecars
      to: sidecars
      filter:
        - opencode
        - opencode-aarch64-apple-darwin
        - opencode-x86_64-apple-darwin
        - ipollowork-orchestrator
        - ipollowork-orchestrator-aarch64-apple-darwin
        - ipollowork-orchestrator-x86_64-apple-darwin
        - versions.json
        - versions.json-aarch64-apple-darwin
        - versions.json-x86_64-apple-darwin
    - from: resources/helpers
      to: helpers
      filter:
        - "iPolloWork Computer Use.app/**"
  target:
    - dmg
    - zip
linux:
  icon: resources/icons/icon.png
  extraResources:
    - from: resources/sidecars
      to: sidecars
      filter:
        - opencode
        - opencode-aarch64-unknown-linux-gnu
        - opencode-x86_64-unknown-linux-gnu
        - ipollowork-orchestrator
        - ipollowork-orchestrator-aarch64-unknown-linux-gnu
        - ipollowork-orchestrator-x86_64-unknown-linux-gnu
        - versions.json
        - versions.json-aarch64-unknown-linux-gnu
        - versions.json-x86_64-unknown-linux-gnu
  target:
    - AppImage
    - tar.gz
win:
  icon: resources/icons/windows/icon.ico
  extraResources:
    - from: resources/icons
      to: icons
      filter:
        - icon.png
        - icon.ico
        - windows/icon.ico
    - from: resources/sidecars
      to: sidecars
      filter:
        - opencode.exe
        - opencode-aarch64-pc-windows-msvc.exe
        - opencode-x86_64-pc-windows-msvc.exe
        - ipollowork-orchestrator.exe
        - ipollowork-orchestrator-aarch64-pc-windows-msvc.exe
        - ipollowork-orchestrator-x86_64-pc-windows-msvc.exe
        - versions.json
        - versions.json-aarch64-pc-windows-msvc.exe
        - versions.json-x86_64-pc-windows-msvc.exe
  target:
    - nsis
nsis:
  include: build/installer.nsh
artifactName: ipollowork-${os}-${arch}-${version}.${ext}
