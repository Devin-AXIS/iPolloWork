name: Setup iPolloWork toolchain
description: Use the same Node, Bun and pnpm versions for checks and releases.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: 22.22.1
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.14
    - name: Install pnpm
      shell: bash
      env:
        BUN_INSTALL: ${{ runner.temp }}/ipollowork-toolchain
        PNPM_HOME: ${{ runner.temp }}/ipollowork-pnpm
      run: |
        set -euo pipefail
        export PATH="$BUN_INSTALL/bin:$PATH"
        bun install --global pnpm@11.4.0
        echo "$BUN_INSTALL/bin" >> "$GITHUB_PATH"
        echo "PNPM_HOME=$PNPM_HOME" >> "$GITHUB_ENV"
