name: Setup iPolloWork toolchain
description: Use the same Node, Bun and pnpm versions for checks and releases.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: 22.22.1
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.14
    - name: Install pnpm
      shell: bash
      env:
        COREPACK_HOME: ${{ runner.temp }}/ipollowork-corepack
        PNPM_HOME: ${{ runner.temp }}/ipollowork-pnpm
      run: |
        set -euo pipefail
        mkdir -p "$COREPACK_HOME/bin"
        corepack enable --install-directory "$COREPACK_HOME/bin" pnpm
        corepack install --global pnpm@11.4.0
        echo "$COREPACK_HOME/bin" >> "$GITHUB_PATH"
        echo "COREPACK_HOME=$COREPACK_HOME" >> "$GITHUB_ENV"
        echo "PNPM_HOME=$PNPM_HOME" >> "$GITHUB_ENV"
        corepack pnpm --version
