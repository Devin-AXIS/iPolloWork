name: Nightly Eval Smoke

# Runs the core startup smoke against a real Electron app under Xvfb,
# every night and on demand. This local flow needs no cloud credentials.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eval-smoke:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Install OpenCode CLI
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENCODE_GITHUB_REPO: ${{ vars.OPENCODE_GITHUB_REPO || 'anomalyco/opencode' }}
        run: |
          set -euo pipefail
          repo="${OPENCODE_GITHUB_REPO:-anomalyco/opencode}"
          version="$(node -e "const fs=require('fs'); const parsed=JSON.parse(fs.readFileSync('constants.json','utf8')); process.stdout.write(String(parsed.opencodeVersion||'').trim().replace(/^v/,''));")"
          if [ -z "$version" ]; then
            echo "Unable to resolve OpenCode version from constants.json." >&2
            exit 1
          fi
          url="https://github.com/${repo}/releases/download/v${version}/opencode-linux-x64-baseline.tar.gz"
          tmp_dir="$RUNNER_TEMP/opencode"
          mkdir -p "$tmp_dir/extracted"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 -H "Authorization: Bearer ${GITHUB_TOKEN}" -o "$tmp_dir/opencode.tar.gz" "$url"
          tar -xzf "$tmp_dir/opencode.tar.gz" -C "$tmp_dir/extracted"
          install_dir="$HOME/.opencode/bin"
          mkdir -p "$install_dir"
          cp "$tmp_dir/extracted/opencode" "$install_dir/opencode"
          chmod 755 "$install_dir/opencode"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install desktop test services
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb dbus

      - name: Start Electron app under Xvfb
        id: desktop-startup
        shell: bash
        env:
          IPOLLOWORK_DEV_MODE: "1"
          ELECTRON_DISABLE_SANDBOX: "1"
          IPOLLOWORK_ELECTRON_REMOTE_DEBUG_PORT: "9823"
          ELECTRON_EXTRA_LAUNCH_ARGS: "--no-sandbox --disable-gpu --disable-dev-shm-usage --enable-unsafe-swiftshader"
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 1600x1000x24 &
          export DISPLAY=:99
          nohup dbus-run-session -- pnpm dev > /tmp/ipollowork-dev.log 2>&1 &
          app_pid=$!
          echo "Waiting for Electron CDP on :9823..."
          for i in $(seq 1 120); do
            if curl -sf http://127.0.0.1:9823/json/list > /dev/null 2>&1; then
              echo "CDP ready after ~$((i*5))s"
              exit 0
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              echo "Electron startup exited before CDP was ready." >&2
              tail -100 /tmp/ipollowork-dev.log >&2
              exit 1
            fi
            sleep 5
          done
          echo "Electron CDP did not come up." >&2
          tail -100 /tmp/ipollowork-dev.log >&2
          exit 1

      - name: Run core smoke flow
        shell: bash
        env:
          IPOLLOWORK_EVAL_CDP_URL: "http://127.0.0.1:9823"
        run: pnpm evals --flow app-smoke

      - name: Upload eval reports
        if: always() && (steps.desktop-startup.outcome == 'success' || steps.desktop-startup.outcome == 'failure')
        uses: actions/upload-artifact@v7
        with:
          name: eval-results
          path: |
            evals/results/
            /tmp/ipollowork-dev.log
          retention-days: 14
          if-no-files-found: error
