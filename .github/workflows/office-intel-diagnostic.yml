name: Diagnose the retained Intel runtime
on:
  push:
    branches: [ci/office-intel-diagnostic-20261119]
env:
  FAILED_RUN: '44562262558'
permissions:
  contents: read
  actions: read
jobs:
  retained:
    runs-on: macos-15-intel
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
      - name: Download the exact failed application
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$FAILED_RUN" =~ ^[0-9]+$ ]]
          directory="$RUNNER_TEMP/retained"
          mkdir "$directory"
          gh run download "$FAILED_RUN" --repo "$GITHUB_REPOSITORY" --name "diagnostic-mac-x64-$FAILED_RUN" --dir "$directory"
          test "$(cat "$directory/source-commit.txt")" = 093bd559ed0d290cfe787287e01a241b45deaa08
          archive="$directory/application.zip"
          if [[ ! -f "$archive" ]]; then archive="$directory/prepared-runtime.tgz"; fi
          test -f "$archive"
          digest="$(awk '{print $1}' "$directory/SHA256SUMS.txt")"
          [[ "$digest" =~ ^[a-f0-9]{64}$ ]]
          printf '%s  %s\n' "$digest" "$archive" | shasum -a 256 -c -
          if [[ "$archive" = *.zip ]]; then
            ditto -x -k "$archive" "$directory"
            codesign --verify --deep --strict "$directory/iPollo.app"
          else
            tar -xzf "$archive" -C "$directory"
          fi
      - name: Run the full payload and Host checks on the retained application
        run: |
          set -euo pipefail
          directory="$RUNNER_TEMP/retained"
          if [[ -d "$directory/iPollo.app" ]]; then
            executable="$directory/iPollo.app/Contents/MacOS/iPollo"
            root="$directory/iPollo.app/Contents/Resources/app.asar/dsh"
            resources="$directory/iPollo.app/Contents/Resources/runtime"
          else
            executable="$directory/electron/Electron.app/Contents/MacOS/Electron"
            root="$directory/dsh"
            resources="$directory/runtime"
          fi
          probe_home="$(mktemp -d "$RUNNER_TEMP/retained-home.XXXXXX")"
          export HOME="$probe_home" USERPROFILE="$probe_home" DSH_HOME="$probe_home" XDG_CACHE_HOME="$probe_home" ELECTRON_RUN_AS_NODE=1 NARB_NATIVE_CACHE_DIR="$probe_home/native-cache" NARB_DISABLE_NATIVE_CACHE=0
          unset NODE_OPTIONS NODE_REPL_EXTERNAL_MODULE
          caffeinate -dimsu -t 1500 &
          awake=$!
          node integrations/desktop/scripts/diagnose-office-processes.mjs > "$RUNNER_TEMP/office-process-samples.log" 2>&1 &
          sampler=$!
          trap 'kill "$sampler" "$awake" 2>/dev/null || true' EXIT
          "$executable" --expose-internals integrations/desktop/tests/fixtures/runtime-payload-smoke.mjs "$root" "$resources"
          export DIAGNOSTIC_CURRENT_RELEASE=1
          "$executable" --expose-internals --experimental-transform-types integrations/desktop/scripts/diagnose-full-published-host.mjs "$root" "$resources"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retained-office-process-samples
          path: ${{ runner.temp }}/office-process-samples.log
          retention-days: 1
