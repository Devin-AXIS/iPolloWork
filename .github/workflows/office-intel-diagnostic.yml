name: Compare published Intel application runtime
on:
  push:
    branches: [ci/office-intel-diagnostic-20261119]
permissions:
  contents: read
jobs:
  published:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare the same small documents
        run: |
          python -m pip install python-docx==1.2.0 openpyxl==3.1.5 python-pptx==1.0.2
          mkdir "$RUNNER_TEMP/office-inputs"
          python integrations/desktop/tests/fixtures/office-conversion-inputs.py "$RUNNER_TEMP/office-inputs"
      - name: Download and verify the published signed Intel application
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v1.0.7 --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP" --pattern ipollowork-mac-x64-1.0.7.dmg
          printf '%s  %s\n' 957d51904ac44e2df70560fec69977f314140ce2777c7e55d584a2c2ed86bb91 "$RUNNER_TEMP/ipollowork-mac-x64-1.0.7.dmg" | shasum -a 256 -c -
      - name: Compare native dependencies and Office in the notarized application
        run: |
          set -euo pipefail
          volume="$RUNNER_TEMP/ipollo-published-mount"
          mkdir "$volume"
          hdiutil attach "$RUNNER_TEMP/ipollowork-mac-x64-1.0.7.dmg" -readonly -nobrowse -mountpoint "$volume" -quiet
          trap 'hdiutil detach "$volume" -quiet || true' EXIT
          app="$volume/iPollo.app"
          codesign --verify --deep --strict "$app"
          xcrun stapler validate "$app"
          executable="$app/Contents/MacOS/iPollo"
          root="$app/Contents/Resources/app.asar/dsh"
          resources="$app/Contents/Resources/runtime"
          home="$(mktemp -d "$RUNNER_TEMP/published-smoke-home.XXXXXX")"
          export HOME="$home" USERPROFILE="$home" DSH_HOME="$home" XDG_CACHE_HOME="$home" ELECTRON_RUN_AS_NODE=1 NARB_NATIVE_CACHE_DIR="$home/native-cache" NARB_DISABLE_NATIVE_CACHE=0
          unset NODE_OPTIONS NODE_REPL_EXTERNAL_MODULE
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          const file='integrations/desktop/tests/fixtures/runtime-payload-smoke.mjs';
          writeFileSync(file,"const diagnosticLog=console.error.bind(console);console.error=(...args)=>diagnosticLog(new Date().toISOString(),...args);\n"+readFileSync(file,'utf8'));
          NODE
          caffeinate -dimsu "$executable" --expose-internals integrations/desktop/tests/fixtures/runtime-payload-smoke.mjs "$root" "$resources"
          caffeinate -dimsu "$executable" --expose-internals integrations/desktop/scripts/diagnose-office-provider.mjs "$root" "$RUNNER_TEMP/office-inputs"
          caffeinate -dimsu "$executable" --expose-internals --experimental-transform-types integrations/desktop/scripts/diagnose-full-published-host.mjs "$root" "$resources"
