name: iPolloWork integrations
on:
  push:
    branches: [main]
    paths: ['plugins/ipollo-enterprise/**', 'plugins/ipollowork-suite/**', 'services/ipollowork/**', 'integrations/**', '.github/workflows/ipollowork-integrations.yml']
  pull_request:
    paths: ['plugins/ipollo-enterprise/**', 'plugins/ipollowork-suite/**', 'services/ipollowork/**', 'integrations/**', '.github/workflows/ipollowork-integrations.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: ipollowork_test
          POSTGRES_PASSWORD: fixture-only
        ports: ['5432/tcp']
        options: >-
          --health-cmd "pg_isready -U postgres -d ipollowork_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.15.0'
      - uses: pnpm/action-setup@v5.0.0
      - name: Build matching DSH workspace
        run: |
          pnpm install --frozen-lockfile
          pnpm run build:artifacts
      - name: Check enterprise connector
        run: npm run check --prefix plugins/ipollo-enterprise
      - name: Install suite dependencies
        working-directory: plugins/ipollowork-suite
        run: |
          npm ci --ignore-scripts --workspaces=false
          npm run link:workspace
      - name: Check and package suite
        working-directory: plugins/ipollowork-suite
        run: |
          npm run check --workspaces=false
          npm run pack:check --workspaces=false
      - name: Install account service dependencies
        working-directory: services/ipollowork
        run: npm ci --ignore-scripts --workspaces=false
      - name: Check and build account services
        working-directory: services/ipollowork
        env:
          TEST_DATABASE_URL: postgresql://postgres:fixture-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/ipollowork_test
        run: |
          npm run check --workspaces=false
          npm run build --workspaces=false
