name: iPollo release packages
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v<version> GitHub release receiving verified installers
        required: true
        default: v1.0.1
      target:
        description: Installer platform
        type: choice
        default: windows
        options: [windows, linux, windows-and-linux]
permissions:
  contents: write
jobs:
  windows:
    if: inputs.target == 'windows' || inputs.target == 'windows-and-linux'
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Prepare pinned runtime and product
        shell: pwsh
        run: |
          npm run setup:build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Configure unsigned installer
        shell: pwsh
        run: |
          @'
          DSH_DESKTOP_APP_ID=com.deepseek.harness
          DSH_DESKTOP_AUTO_UPDATE_ENV=production
          DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=https://work.ipollo.net
          '@ | Set-Content integrations/desktop/.env.windows
      - name: Build and verify Windows x64
        shell: pwsh
        run: |
          npm run package:desktop:win:x64 -- --unsigned
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: iPollo-windows-x64
          path: integrations/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/*.exe
          if-no-files-found: error
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        with:
          name: website-windows-x64
          path: integrations/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/website-installers/*.exe
          if-no-files-found: error
          include-hidden-files: true
      - name: Publish verified installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $files = Get-ChildItem integrations/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/*.exe
          $websiteFiles = Get-ChildItem integrations/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/website-installers/*.exe
          if ($files.Count -ne 1 -or $websiteFiles.Count -ne 1) { throw 'Expected one verified installer and one website copy' }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$version") { throw "The release tag must match v$version" }
          gh release upload $env:RELEASE_TAG $websiteFiles.FullName --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
  linux:
    if: inputs.target == 'linux' || inputs.target == 'windows-and-linux'
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
      - name: Prepare pinned runtime and product
        run: |
          npm run setup:build
          npm run build
      - name: Build and verify Linux x64
        run: npm run package:desktop:linux:x64
      - uses: actions/upload-artifact@v4
        with:
          name: website-linux-x64
          path: integrations/desktop/.desktop-build/targets/linux-x64/unsigned-artifacts/website-installers/*.AppImage
          if-no-files-found: error
          include-hidden-files: true
      - name: Publish verified installer
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          version=$(node -p 'require("./package.json").version')
          test "$RELEASE_TAG" = "v$version"
          set -- integrations/desktop/.desktop-build/targets/linux-x64/unsigned-artifacts/website-installers/*.AppImage
          test "$#" -eq 1
          test -f "$1"
          gh release upload "$RELEASE_TAG" "$1" --repo "$GITHUB_REPOSITORY"
