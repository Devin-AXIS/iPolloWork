name: iPollo release packages
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing numeric draft release receiving the verified installers
        required: true
      signed_macos:
        description: Build Developer ID signed and notarized Mac installers and update ZIPs
        type: boolean
        default: true
      macos_target:
        description: Build both Mac architectures or retry one verified packaging target
        type: choice
        options: [both, mac-arm64, mac-x64]
        default: both
      windows:
        description: Build the Windows x64 installer and its update files
        type: boolean
        default: true
      linux:
        description: Build the standalone Linux x64 AppImage for the website
        type: boolean
        default: true
      source_ref:
        description: Optional immutable commit for rebuilding an existing draft
        type: string
permissions:
  contents: write
concurrency:
  group: ipollo-release-packages-${{ inputs.release_tag }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      source: ${{ steps.release.outputs.source }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Resolve the draft and its source commit
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_REF: ${{ inputs.source_ref || github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Use a numeric tag such as v1.0.5.' >&2
            exit 1
          fi
          draft=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,targetCommitish)
          if ! jq -e '.isDraft and (.isPrerelease | not)' <<< "$draft" >/dev/null; then
            echo "$RELEASE_TAG must be a stable draft." >&2
            exit 1
          fi
          resolve_commit() {
            local ref
            ref=$(jq -rn --arg ref "$1" '$ref | @uri')
            gh api "repos/$GITHUB_REPOSITORY/commits/$ref" --jq .sha
          }
          source=$(resolve_commit "$SOURCE_REF")
          target=$(jq -r .targetCommitish <<< "$draft")
          if [[ "$target" != "$source" ]]; then
            if [[ "$(resolve_commit "$target")" != "$source" ]]; then
              echo "Draft $RELEASE_TAG targets $target. Select that commit as source_ref." >&2
              exit 1
            fi
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$source"
          fi
          printf 'source=%s\nversion=%s\n' "$source" "${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

  windows:
    if: inputs.windows
    needs: release
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.source }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install pinned build dependencies
        shell: pwsh
        run: node integrations/tooling/setup.mjs --plugins
      - name: Configure unsigned installer
        shell: pwsh
        run: |
          @'
          DSH_DESKTOP_APP_ID=com.deepseek.harness
          DSH_DESKTOP_AUTO_UPDATE_ENV=production
          DSH_DESKTOP_UPDATE_URL=https://github.com/Devin-AXIS/iPolloWork/releases/latest/download
          DSH_DESKTOP_UPDATE_CHANNEL=stable
          DSH_DESKTOP_WINDOWS_PACK_CONCURRENCY=1
          DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=https://cloud.ipollo.net
          '@ | Set-Content integrations/desktop/.env.windows
      - name: Build and verify Windows x64
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: |
          node integrations/desktop/run.mjs package-target.ts win-x64 --unsigned --build-version $env:RELEASE_VERSION
      - name: Attach verified Windows installer and blockmap
        id: upload
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: |
          $directory = 'integrations/desktop/.desktop-build/targets/win-x64/unsigned-artifacts'
          $base = "ipollowork-win-x64-$env:RELEASE_VERSION-unsigned.exe"
          $website = Join-Path $directory "website-installers/ipollowork-win-x64-$env:RELEASE_VERSION.exe"
          $installer = Join-Path $directory "website-installers/$base"
          $blockmap = Join-Path $directory "website-installers/$base.blockmap"
          Copy-Item -LiteralPath $website -Destination $installer
          Copy-Item -LiteralPath (Join-Path $directory "iPollo-$env:RELEASE_VERSION-win-x64-unsigned.exe.blockmap") -Destination $blockmap
          gh release upload $env:RELEASE_TAG $website $installer $blockmap --repo $env:GITHUB_REPOSITORY --clobber
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: iPollo-windows-x64
          path: |
            integrations/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/website-installers/*.exe
            integrations/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/*.blockmap
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0

  linux:
    if: inputs.linux
    needs: release
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      RELEASE_VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.source }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
      - name: Install pinned build dependencies
        run: node integrations/tooling/setup.mjs --plugins
      - name: Build and verify Linux x64 AppImage
        run: npm run package:desktop:linux:x64 -- --build-version "$RELEASE_VERSION"
      - name: Attach verified Linux installer
        id: upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          directory=integrations/desktop/.desktop-build/targets/linux-x64/unsigned-artifacts/website-installers
          gh release upload "$RELEASE_TAG" "$directory/ipollowork-linux-x86_64-$RELEASE_VERSION.AppImage" --repo "$GITHUB_REPOSITORY" --clobber
      - uses: actions/upload-artifact@v4
        if: failure() && steps.upload.outcome == 'failure'
        with:
          name: website-linux-x64
          path: integrations/desktop/.desktop-build/targets/linux-x64/unsigned-artifacts/website-installers/*.AppImage
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0

  macos:
    if: inputs.signed_macos
    needs: release
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.macos_target == 'both' && '["mac-arm64","mac-x64"]' || inputs.macos_target == 'mac-arm64' && '["mac-arm64"]' || '["mac-x64"]') }}
    runs-on: ${{ matrix.target == 'mac-arm64' && 'macos-15' || 'macos-15-intel' }}
    timeout-minutes: 120
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      RELEASE_VERSION: ${{ needs.release.outputs.version }}
      PACKAGE_TARGET: ${{ matrix.target }}
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.source }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
      - name: Verify the selected macOS SDK and Swift compiler
        run: |
          xcodebuild -version
          xcrun swift --version
      - name: Restore notarized helpers for the identical pinned DSH release
        id: cua_helper
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # This donor ships the identical immutable DSH source and both helper architectures.
          pin="$(git hash-object integrations/runtime/upstream.json)"
          if [[ "$pin" != 772d5fb3ed2890b4548b8685ae532cb6b7e06cf6 ]]; then
            exit 0
          fi
          directory="$(mktemp -d "$RUNNER_TEMP/ipollo-helper-donor.XXXXXX")"
          archive="$directory/iPollo-1.0.1-mac-arm64.dmg"
          gh release download v1.0.1 --repo "$GITHUB_REPOSITORY" --dir "$directory" --pattern "$(basename "$archive")"
          printf '%s  %s\n' aee5a694e5e77534fbc099cb956ac39bcbc1ffee9c0ce30578f4ffc818b960dd "$archive" | shasum -a 256 -c -
          volume="$directory/mount"
          mkdir "$volume"
          hdiutil attach "$archive" -readonly -nobrowse -mountpoint "$volume" -quiet
          trap 'hdiutil detach "$volume" -quiet' EXIT
          source="$volume/iPollo.app/Contents/Resources/app.asar.unpacked/dsh/node_modules/@deepseek-ai/dsh-cua-macos/native/bin"
          test -f "$source/darwin-arm64/current.json"
          test -f "$source/darwin-x64/current.json"
          destination="integrations/desktop/.desktop-build/cua-helper/native"
          mkdir -p "$destination"
          ditto "$source" "$destination/bin"
          for arch in arm64 x64; do
            architecture="$destination/bin/darwin-$arch"
            receipt="$(node -e 'process.stdout.write(JSON.parse(require("node:fs").readFileSync(process.argv[1],"utf8")).bundle)' "$architecture/current.json")"
            [[ "$receipt" =~ ^[a-f0-9]{64}$ ]]
            helper="$architecture/$receipt/DSH Computer Use.app"
            /usr/bin/codesign --verify --deep --strict "$helper"
            for attempt in 1 2 3 4; do
              if /usr/bin/xcrun stapler validate "$helper"; then
                break
              else
                result=$?
                if (( result != 68 || attempt == 4 )); then exit "$result"; fi
              fi
              sleep "$((attempt * 15))"
            done
          done
          printf 'reused=true\n' >> "$GITHUB_OUTPUT"
      - name: Set Intel pnpm store path
        if: matrix.target == 'mac-x64'
        run: echo "PNPM_CONFIG_STORE_DIR=$RUNNER_TEMP/ipollo-intel-pnpm-store" >> "$GITHUB_ENV"
      - name: Restore Intel build dependencies
        if: matrix.target == 'mac-x64'
        id: intel_deps
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: |
            ${{ runner.temp }}/ipollo-intel-pnpm-store
            ~/.npm/_cacache
          key: ipollo-intel-deps-v1-node24.15.0-${{ hashFiles('integrations/runtime/upstream.json', 'integrations/publisher/package-lock.json', 'plugins/ipollowork-suite/package-lock.json', 'plugins/stage/package-lock.json') }}
      - name: Install pinned build dependencies
        run: node integrations/tooling/setup.mjs --plugins
      - name: Save Intel build dependencies
        if: matrix.target == 'mac-x64' && steps.intel_deps.outputs.cache-primary-key != '' && steps.intel_deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: |
            ${{ runner.temp }}/ipollo-intel-pnpm-store
            ~/.npm/_cacache
          key: ${{ steps.intel_deps.outputs.cache-primary-key }}
      - name: Prepare Apple signing configuration
        env:
          CERTIFICATE_P12: ${{ secrets.APPLE_CODESIGN_CERT_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CODESIGN_CERT_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_API_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          umask 077
          for required in CERTIFICATE_P12 NOTARY_KEY_P8 NOTARY_KEY_ID NOTARY_ISSUER; do
            if [[ -z "${!required}" ]]; then
              echo "Missing signing configuration $required" >&2
              exit 1
            fi
          done
          export MAC_CERT_FILE="$RUNNER_TEMP/ipollo-signing.p12"
          export MAC_NOTARY_FILE="$RUNNER_TEMP/ipollo-notary.p8"
          printf '%s' "$CERTIFICATE_P12" | base64 -D > "$MAC_CERT_FILE"
          printf '%s' "$NOTARY_KEY_P8" | base64 -D > "$MAC_NOTARY_FILE"
          inspect="$RUNNER_TEMP/ipollo-certificate-inspection.keychain-db"
          trap 'security delete-keychain "$inspect" >/dev/null 2>&1 || true' EXIT
          inspection_password="$(openssl rand -hex 32)"
          security create-keychain -p "$inspection_password" "$inspect"
          security unlock-keychain -p "$inspection_password" "$inspect"
          security import "$MAC_CERT_FILE" -k "$inspect" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          export MAC_IDENTITY
          MAC_IDENTITY="$(security find-identity -p codesigning "$inspect" | sed -nE 's/^[^"]*"(Developer ID Application: [^"]+)"[^"]*$/\1/p' | sort -u)"
          export MAC_TEAM
          MAC_TEAM="$(printf '%s\n' "$MAC_IDENTITY" | sed -nE 's/^Developer ID Application: .+ \(([A-Z0-9]{10})\)$/\1/p')"
          if [[ ! "$MAC_TEAM" =~ ^[A-Z0-9]{10}$ ]]; then
            echo 'Expected one Developer ID Application identity' >&2
            exit 1
          fi
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs'
          import { parseEnv } from 'node:util'
          const values = {
            DSH_DESKTOP_APP_ID: 'com.deepseek.harness',
            DSH_DESKTOP_AUTO_UPDATE_ENV: 'production',
            DSH_DESKTOP_UPDATE_CHANNEL: 'stable',
            DSH_DESKTOP_UPDATE_URL: 'https://github.com/' + process.env.GITHUB_REPOSITORY + '/releases/latest/download',
            DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN: 'https://cloud.ipollo.net',
            DSH_DESKTOP_MACOS_SIGNING_IDENTITY: process.env.MAC_IDENTITY.replace(/^Developer ID Application: /, ''),
            DSH_DESKTOP_MACOS_TEAM_ID: process.env.MAC_TEAM,
            DSH_DESKTOP_MACOS_PACK_CONCURRENCY: '1',
            CSC_LINK: process.env.MAC_CERT_FILE,
            CSC_KEY_PASSWORD: process.env.CERTIFICATE_PASSWORD ?? '',
            APPLE_API_KEY: process.env.MAC_NOTARY_FILE,
            APPLE_API_KEY_ID: process.env.NOTARY_KEY_ID,
            APPLE_API_ISSUER: process.env.NOTARY_ISSUER,
          }
          const lines = Object.entries(values).map(([key, value]) => {
            const quote = ["'", '"', String.fromCharCode(96)].find(character => !value.includes(character))
            if (!quote || /[\r\n]/u.test(value)) throw new Error('Invalid signing setting ' + key)
            const line = key + '=' + quote + value + quote
            if (parseEnv(line)[key] !== value) throw new Error('Could not encode signing setting ' + key)
            return line
          })
          writeFileSync('integrations/desktop/.env.macos', lines.join('\n') + '\n', { mode: 0o600 })
          NODE
      - name: Build and notarize the native Computer Use helpers
        if: steps.cua_helper.outputs.reused != 'true'
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process'
          import { loadDesktopPackageEnvironment } from './integrations/desktop/scripts/desktop-package-environment.mjs'
          import { withMacOSSigningKeychain } from './integrations/desktop/scripts/macos-signing-keychain.mjs'
          const configuration = loadDesktopPackageEnvironment('darwin')
          await withMacOSSigningKeychain(configuration, async environment => {
            execFileSync(process.execPath, ['--import', 'tsx/esm', 'integrations/desktop/scripts/prepare-cua-helper.ts'], {
              env: { ...process.env, ...environment }, stdio: 'inherit',
            })
          })
          NODE
      - name: Build and verify macOS DMG
        run: node integrations/desktop/run.mjs package-target.ts "$PACKAGE_TARGET" --build-version "$RELEASE_VERSION"
      - name: Install the DMG and open the real application with an old plugin dependency
        run: |
          set -euo pipefail
          dmg="integrations/desktop/.desktop-build/targets/$PACKAGE_TARGET/artifacts/website-installers/ipollowork-$PACKAGE_TARGET-$RELEASE_VERSION.dmg"
          mount="$RUNNER_TEMP/ipollo-installed-volume"
          installed="$RUNNER_TEMP/Installed Applications/iPollo.app"
          mkdir -p "$mount" "$(dirname "$installed")"
          hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mount" -quiet
          trap 'hdiutil detach "$mount" -quiet' EXIT
          ditto "$mount/iPollo.app" "$installed"
          node integrations/desktop/scripts/smoke-installed-macos.mjs "$installed" installed-macos-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-${{ matrix.target }}-${{ github.run_id }}
          path: installed-macos-evidence/
          if-no-files-found: ignore
          retention-days: 7
      - name: Attach verified macOS installer and update files
        id: upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          directory="integrations/desktop/.desktop-build/targets/$PACKAGE_TARGET/artifacts"
          base="iPollo-$RELEASE_VERSION-$PACKAGE_TARGET"
          gh release upload "$RELEASE_TAG" \
            "$directory/website-installers/ipollowork-$PACKAGE_TARGET-$RELEASE_VERSION.dmg" \
            "$directory/$base.zip" "$directory/$base.zip.blockmap" "$directory/$PACKAGE_TARGET-release.json" \
            --repo "$GITHUB_REPOSITORY" --clobber
      - uses: actions/upload-artifact@v4
        if: failure() && steps.upload.outcome == 'failure'
        with:
          name: iPollo-${{ matrix.target }}
          path: |
            integrations/desktop/.desktop-build/targets/${{ matrix.target }}/artifacts/website-installers/*.dmg
            integrations/desktop/.desktop-build/targets/${{ matrix.target }}/artifacts/*.zip
            integrations/desktop/.desktop-build/targets/${{ matrix.target }}/artifacts/*.zip.blockmap
            integrations/desktop/.desktop-build/targets/${{ matrix.target }}/artifacts/*-release.json
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
      - name: Preserve the signed application when any macOS packaging check fails
        if: failure()
        run: |
          set -euo pipefail
          directory="integrations/desktop/.desktop-build/targets/$PACKAGE_TARGET/artifacts"
          subdirectory=mac
          if [[ "$PACKAGE_TARGET" == mac-arm64 ]]; then subdirectory=mac-arm64; fi
          app="$directory/$subdirectory/iPollo.app"
          if [[ -d "$app" ]]; then
            mkdir -p retained-application
            ditto -c -k --sequesterRsrc --keepParent "$app" retained-application/application.zip
            git rev-parse HEAD > retained-application/source-commit.txt
            shasum -a 256 retained-application/application.zip > retained-application/SHA256SUMS.txt
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: retained-${{ matrix.target }}-${{ github.run_id }}
          path: retained-application/
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 0
